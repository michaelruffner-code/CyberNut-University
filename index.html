up you want to deploy to (for example, CyberNut Admins, Teachers, All High Schools students).","Select the group, turn on the App Distribution toggle, then click Save."]}],"l":[{"text":"https://admin.google.com","url":"https://admin.google.com"}],"video_only":false},{"id":"deploy-chrome-extension","g":"s4","t":"Deploy the Chrome extension","sum":"Force install the CyberNut Chrome extension from Google Admin and enable it in CyberNut to add more Chip report buttons in Gmail.","p":"google","k":"setup","a":"it-admin","m":8,"u":"2026-07-13","src":["deploying-the-cybernut-chrome-extension-for-gmail"],"orig":["https://knowledgebase.cybernut.com/cybernut-knowledge-base/deploying-the-cybernut-chrome-extension-for-gmail"],"v":[{"url":"https://cybernut.storylane.io/share/wwwumiefmyvd","host":"Storylane"}],"sh":4,"b":[{"t":"p","x":"The CyberNut extension puts Chip, the blue squirrel button, in more visible places so users can report suspicious emails. The updated version adds Chip in three new locations."},{"t":"list","items":["A quick action in the email list.","The top ribbon of an open email.","A floating icon. Users can drag it anywhere and it stays in that position each time they open an email. Your Tech Admin must turn on the floating icon feature in CyberNut."]},{"t":"note","x":"The extension works only in Chrome, and only when the user is signed in with their school Chrome profile."},{"t":"h","x":"Directions for Installing the Extension"},{"t":"steps","items":["Go to the Google Admin Console at https://admin.google.com.","Click Devices in the left sidebar.","Click Chrome.","Click Apps & extensions.","Click the Users & Browsers tab at the top.","Select the users you want to deploy to (for example, Staff).","In the bottom right, click the yellow plus icon.","Click the waffle style icon labeled Add Chrome app or extension by ID.","In the Extension ID field, paste hoaajnafdcffakciamdkdhlhmnkneecb.","Select From the Chrome Web Store, then click Save.","From the dropdown, click Force Install.","Click Save."]},{"t":"code","x":"hoaajnafdcffakciamdkdhlhmnkneecb"},{"t":"note","x":"After the extension is installed for everyone, you can wait a day or so and then change the setting to Allow install if you want users to be able to remove it themselves."},{"t":"p","x":"Once the extension is installed, you can change how the floating squirrel behaves in the CyberNut Admin Portal."},{"t":"steps","items":["Log in at https://admin.cybernut.com.","Go to Settings in the bottom left corner.","Open the Add-on tab, turn on Chrome Extension has been deployed, choose any other options you want, then click Save."]},{"t":"note","x":"It may take up to 24 hours for all users to see the extension."}],"l":[{"text":"admin.google.com","url":"https://admin.google.com"},{"text":"admin.cybernut.com","url":"https://admin.cybernut.com"}],"video_only":false},{"id":"chrome-extension-opt-out","g":"s4","t":"Let one person turn off the Chrome extension","sum":"Set the Chrome extension installation policy to Force install, allow users to disable, so a specific user can turn it off.","p":"google","k":"how-to","a":"it-admin","m":3,"u":"2026-05-04","src":["allowing-individual-users-to-disable-the-cybernut-chrome-extension"],"orig":["https://knowledgebase.cybernut.com/cybernut-knowledge-base/allowing-individual-users-to-disable-the-cybernut-chrome-extension"],"v":[],"sh":4,"b":[{"t":"steps","items":["Sign in to the Google Admin Console at https://admin.google.com.","Go to Devices > Chrome > Apps & extensions.","Choose the Group or OU where you first assigned the extension for those users (for example, High School Staff), then click the CyberNut Reporting Tool entry.","Change the Installation policy to Force install, allow users to disable, then save.","Have the end user click the Extensions icon in Chrome and select Manage Extensions.","Turn off the extension using its toggle button."]}],"l":[{"text":"https://admin.google.com","url":"https://admin.google.com/"}],"video_only":false},{"id":"install-outlook-add-in","g":"s4","t":"Install the Outlook add-in","sum":"Deploy the CyberNut Outlook add-in from the Microsoft 365 Admin Center using the new or legacy manifest URL.","p":"microsoft","k":"setup","a":"it-admin","m":5,"u":"2026-06-29","src":["install-outlook-addon"],"orig":["https://knowledgebase.cybernut.com/cybernut-knowledge-base/install-outlook-addon"],"v":[{"url":"https://cybernut.storylane.io/share/y4f0o0oiirjv","host":"Storylane"}],"sh":1,"b":[{"t":"steps","items":["Sign in to the Microsoft 365 Admin Center at https://admin.cloud.microsoft/ and open the Settings dropdown on the left side.","Click Integrated Apps.","Click the small blue Add-ins link at the top of the screen.","Click Deploy Add-in to start the deployment.","Click Next, then click Upload Custom Apps. In the field labeled I have a URL for the manifest file, enter the correct manifest URL below exactly as shown, including https.","Set the add-on to deploy to specific groups, then select every user who will take part in CyberNut campaigns."]},{"t":"p","x":"If all users run the newest Outlook versions (Microsoft 365 Outlook or Outlook for Windows), use this manifest URL:"},{"t":"code","x":"https://cybernut-outlook-addon.vercel.app/manifest.xml"},{"t":"p","x":"If users run a mix of Outlook versions, use this manifest URL:"},{"t":"code","x":"https://legacyaddin.cybernut.com/manifest.xml"},{"t":"note","x":"Deployment can take up to 72 hours. If users run the desktop version of Outlook, restart the Outlook client."}],"l":[{"text":"Microsoft 365 Admin Center","url":"https://admin.cloud.microsoft/"}],"video_only":false},{"id":"outlook-add-in-users","g":"s4","t":"Assign the Outlook add-in to users or groups","sum":"Add or remove users and groups for the CyberNut add-in in Microsoft 365 Integrated Apps so every campaign group can report and train.","p":"microsoft","k":"how-to","a":"it-admin","m":4,"u":"2026-02-06","src":["assigning-groups-users-m365"],"orig":["https://knowledgebase.cybernut.com/cybernut-knowledge-base/assigning-groups-users-m365"],"v":[{"url":"https://cybernut.storylane.io/share/ld3fyqfm4wed","host":"Storylane"}],"sh":1,"b":[{"t":"steps","items":["Sign in to the Microsoft 365 Admin Center and open Settings from the sidebar.","Select Integrated Apps from the dropdown menu.","Find and select the CyberNut Reporting Tool.","On the add-in overview page, review the currently assigned users at the bottom. They should include every group chosen for your campaign. Users in a missing group cannot complete CyberNut training. Click Edit to change the assigned groups.","Search for users or groups to add them to or remove them from receiving the add-on.","Click Update to save."]},{"t":"note","x":"It may take up to 72 hours before new users see the add-on."}],"l":[{"text":"Microsoft 365 Admin Center","url":"https://admin.cloud.microsoft/"}],"video_only":false},{"id":"remove-new-outlook-add-in","g":"s4","t":"Remove the newest Outlook add-in","sum":"Remove the newest CyberNut Outlook add-in from Integrated apps to avoid duplicate add-ins for legacy Outlook users.","p":"microsoft","k":"troubleshoot","a":"it-admin","m":3,"u":"2026-02-05","src":["remove-new-outlook-addin"],"orig":["https://knowledgebase.cybernut.com/cybernut-knowledge-base/remove-new-outlook-addin"],"v":[],"sh":3,"b":[{"t":"h","x":"Summary"},{"t":"p","x":"If you give users of legacy Outlook (2016) access to the CyberNut add-in, you must do it for all users unless they are in a separate user group. Otherwise users will see two versions of the add-in, which causes confusion."},{"t":"p","x":"To remove the newest version, follow these steps."},{"t":"steps","items":["Sign in to the Microsoft 365 Admin Center at https://admin.cloud.microsoft/.","In the left menu, go to Settings and then Integrated apps. You may need to click Show All.","Select Cybernut from the app list.","Click Remove app."]},{"t":"note","x":"Removal can take up to 72 hours."},{"t":"p","x":"If you need to install the legacy version of the add-in instead, see the article on installing the legacy Outlook add-in."}],"l":[{"text":"Microsoft 365 Admin Center","url":"https://admin.cloud.microsoft/"},{"text":"legacy version","to":"install-outlook-add-in"}],"video_only":false},{"id":"remove-gmail-add-on","g":"s4","t":"Remove the Gmail add-on","sum":"Uninstall the CyberNut Reporting Tool add-on from each user, group, or OU in the Google Admin Console.","p":"google","k":"how-to","a":"it-admin","m":3,"u":"2026-07-17","src":["how-do-i-remove-the-cybernut-addon"],"orig":["https://knowledgebase.cybernut.com/cybernut-knowledge-base/how-do-i-remove-the-cybernut-addon"],"v":[],"sh":4,"b":[{"t":"h","x":"Removing the CyberNut add-on from Google Workspace"},{"t":"steps","items":["Sign in to the Google Admin console at https://admin.google.com.","Go to Apps > Google Workspace Marketplace apps > Apps list.","Find and select the user, group, or OU where you deployed the add-on (for example, Staff).","Select CyberNut Reporting Tool.","Select Uninstall App.","Repeat these steps for every other user, group, or OU where you deployed the add-on."]}],"l":[{"text":"https://admin.google.com","url":"https://admin.google.com"}],"video_only":false},{"id":"remove-chrome-extension","g":"s4","t":"Remove the Chrome extension","sum":"Remove or block the CyberNut Chrome extension for users, groups, or OUs in the Google Admin Console.","p":"google","k":"how-to","a":"it-admin","m":4,"u":"2026-05-01","src":["removing-the-cybernut-chrome-extension-for-gmail-0"],"orig":["https://knowledgebase.cybernut.com/cybernut-knowledge-base/removing-the-cybernut-chrome-extension-for-gmail-0"],"v":[],"sh":6,"b":[{"t":"steps","items":["Open the Google Admin Console at https://admin.google.com.","In the left sidebar, click Devices.","Click Chrome.","Click Apps & extensions.","Select the Users & Browsers tab at the top.","Choose the users, groups, or OUs you want to remove the extension from.","In the top right corner, click the trash can icon to delete the extension, or see step 8.","As an alternative, use Block and uninstall Chrome for a sub-OU or group where you installed it earlier.","Click Save."]},{"t":"note","x":"You must be at the same location (user, group, or OU) where you installed the extension, or change the policies for that user, group, or OU."},{"t":"note","x":"Changes may take up to 24 hours to appear for users."}],"l":[{"text":"https://admin.google.com","url":"https://admin.google.com"}],"video_only":false},{"id":"dynamic-groups-google","g":"s5","t":"Turn on Dynamic Groups (Google)","sum":"Add the cloud-identity.groups.readonly scope to CyberNut's domain wide delegation so Google dynamic groups sync.","p":"google","k":"setup","a":"it-admin","m":3,"u":"2026-09-10","src":["dynamic-groups-scopes"],"orig":["https://knowledgebase.cybernut.com/cybernut-knowledge-base/dynamic-groups-scopes"],"v":[],"sh":2,"b":[{"t":"p","x":"If your organization uses dynamic groups, follow these steps to update the OAuth scopes in Google."},{"t":"steps","items":["Sign in to the Google Admin Console at https://admin.google.com/.","Go to Security > Access and data control > API controls, then select Manage Domain Wide Delegation.","Select Edit on the row that lists CyberNut.","Scroll down, add the OAuth scope below, then select Authorize and then Confirm."]},{"t":"code","x":"https://www.googleapis.com/auth/cloud-identity.groups.readonly"}],"l":[{"text":"admin.google.com","url":"https://admin.google.com/"}],"video_only":false},{"id":"compromised-account-scopes-google","g":"s5","t":"Turn on Compromised Account Detection (Google)","sum":"Add the admin.directory.user scopes in Google Admin and turn on Compromised Account Detection and auto suspend in CyberNut Settings.","p":"google","k":"setup","a":"it-admin","m":6,"u":"2026-08-12","src":["compromised-settings"],"orig":["https://knowledgebase.cybernut.com/cybernut-knowledge-base/compromised-settings"],"v":[],"sh":1,"b":[{"t":"h","x":"Part 1: Update Domain Wide Delegation Scopes"},{"t":"steps","items":["Sign in to the Google Admin Console at https://admin.google.com.","Go to Security > Access and data control > API controls, then select Manage Domain Wide Delegation.","Select Edit on the row for CyberNut.","Scroll down and enter the scopes below. Select Authorize, then Confirm."]},{"t":"code","x":"https://www.googleapis.com/auth/admin.directory.user,https://www.googleapis.com/auth/admin.directory.user.security"},{"t":"h","x":"Part 2: Enable Compromised Account feature in CyberNut Admin Portal"},{"t":"steps","items":["Sign in to the CyberNut Admin Portal at https://admin.cybernut.com.","Select Settings in the bottom left corner.","Select Compromised Accounts.","Scroll down and turn on Enable Compromised Account Detection.","Turn on Email admins when an account is flagged as compromised. The addresses that receive these emails are set on the Report Button tab.","If you want flagged accounts suspended, turn on Automatically suspend compromised accounts.","If certain addresses must never be suspended automatically, add them to the exceptions list.","Select Save at the bottom of the screen."]},{"t":"note","x":"After you update the OAuth scope, it may take up to 24 hours before you can enable this feature."}],"l":[{"text":"Google Admin Console","url":"https://admin.google.com/"},{"text":"CyberNut Admin Portal","url":"https://admin.cybernut.com/"}],"video_only":false},{"id":"reported-threats-delete-microsoft","g":"s5","t":"Turn on Reported Threats Delete (Microsoft)","sum":"Add Entra permissions, upload a self signed certificate and Exchange Administrator role, then turn on Reported Threats Delete in CyberNut.","p":"microsoft","k":"setup","a":"it-admin","m":15,"u":"2026-08-17","src":["enable-reported-threats-delete-microsoft"],"orig":["https://knowledgebase.cybernut.com/cybernut-knowledge-base/enable-reported-threats-delete-microsoft"],"v":[{"url":"https://cybernut.storylane.io/share/7synz568k2n5","host":"Storylane"}],"sh":12,"b":[{"t":"h","x":"Part 1: Adding API Permissions in Azure Active Directory"},{"t":"p","x":"This was likely done during your initial technical integration, but you should review it."},{"t":"steps","items":["Go to the Microsoft Entra admin center at https://entra.microsoft.com/.","Select App Registrations.","Select View All Applications in the directory.","Search for CyberNut Admin and open it.","Confirm the permissions below are granted, including Mail.ReadWrite.","If the permissions are set, continue to Part 2. If not, follow the procedures in Enabling Direct Mail Injection and Active Directory Sync for Microsoft."]},{"t":"list","items":["Group.Read.All","GroupMember.Read.All","User.Read.All","Mail.Send","Mail.ReadWrite","User-PasswordProfile.ReadWrite.All","User.EnableDisableAccount.All","User.RevokeSessions.All","Exchange.ManageAsApp","full_access_as_app"]},{"t":"h","x":"Part 2: Creating and Managing a Self-Signed Certificate"},{"t":"h","x":"Creating a Certificate Using PowerShell (or Terminal on a Mac)"},{"t":"p","x":"Mac users should follow the separate Terminal guide. On your district machine, open PowerShell with administrator rights and run the script below. Replace YourStrongPasswordHere with a password of your choice. You only need this password once, when you upload the certificate to the CyberNut Admin Portal."},{"t":"code","x":"# Define certificate parameters\n$certDnsName = \"CyberNutCert\"\n$certPassword = ConvertTo-SecureString -String \"YourStrongPasswordHere\" -Force -AsPlainText\n$certDirectory = \"C:\\Certificates\"\n$certPfxPath = \"$certDirectory\\CyberNutCert.pfx\"\n$certCerPath = \"$certDirectory\\CyberNutCert.cer\"\n$certValidityPeriod = 365  # Valid for 1 year\n\n# Create the directory if it doesn't exist\nif (-Not (Test-Path -Path $certDirectory)) {\n    New-Item -ItemType Directory -Path $certDirectory\n}\n\n# Create a new self-signed certificate\n$cert = New-SelfSignedCertificate -DnsName $certDnsName -CertStoreLocation \"cert:\\LocalMachine\\My\" -KeyExportPolicy Exportable -KeySpec Signature -NotAfter (Get-Date).AddDays($certValidityPeriod)\n\n# Export the certificate to a .pfx file with a password\nExport-PfxCertificate -Cert $cert -FilePath $certPfxPath -Password $certPassword\nWrite-Host \"Certificate created and exported to $certPfxPath\"\n\n# Import the certificate into the Current User's certificate store\n$certImported = Import-PfxCertificate -FilePath $certPfxPath -CertStoreLocation \"Cert:\\CurrentUser\\My\" -Password $certPassword\nWrite-Host \"Certificate imported successfully into the CurrentUser\\My store.\"\n\n# Optionally export the public certificate to a .cer file\n$thumbprint = $certImported.Thumbprint.ToUpper().Trim()\n$certToExport = Get-ChildItem -Path \"Cert:\\CurrentUser\\My\" | Where-Object { $_.Thumbprint.ToUpper().Trim() -eq $thumbprint }\n\nif ($certToExport) {\n    Export-Certificate -Cert $certToExport -FilePath $certCerPath\n    Write-Host \"Public certificate exported to $certCerPath\"\n} else {\n    Write-Host \"Certificate not found in the store. Public certificate export skipped.\"\n}\n\nWrite-Host \"Script completed successfully.\""},{"t":"p","x":"The script creates a self-signed certificate named CyberNutCert in C:\\Certificates that is valid for 365 days, and exports a password protected CyberNutCert.pfx file and a public CyberNutCert.cer file."},{"t":"h","x":"Locate the Certificate"},{"t":"p","x":"The script output shows where both files are saved. You should have two files, one ending in .pfx and one ending in .cer."},{"t":"h","x":"Uploading the Certificate to Azure"},{"t":"steps","items":["In the Microsoft Entra admin center (https://entra.microsoft.com/), select App Registrations, then View all applications in the directory.","Select the CyberNut Admin app.","Select Certificates & secrets, select Upload Certificate, and upload the .cer file you created with the script.","Confirm the uploaded certificate appears in this section."]},{"t":"h","x":"Assigning Exchange Administrator Role"},{"t":"steps","items":["In your CyberNut Admin app registration, select Roles and Administrators, then click the blue here link.","Search for the Exchange Administrator role and select the role name, not the checkbox.","On the next screen, select Add Assignments, search for CyberNut Admin, select its checkbox, and click add.","Under Exchange Administrator | Assignments, confirm that CyberNut Admin is listed as assigned."]},{"t":"h","x":"Upload CyberNut .pfx File to CyberNut Admin Portal"},{"t":"steps","items":["Go to the CyberNut Admin Portal at https://admin.cybernut.com and sign in with SSO.","Select Settings, then Threat Manager.","Click Upload under Microsoft Certificate.","Upload the .pfx file the script generated.","Enter the same password you used in the script and turn on the Reported Threats Delete toggle at the top.","Click Save."]},{"t":"note","x":"The password must exactly match the one in the script. If there is a typo, your threats will not be deleted."}],"l":[{"text":"Microsoft Entra admin center","url":"https://entra.microsoft.com/."},{"text":"here (Microsoft DMI procedures)","to":"dmi-microsoft"},{"text":"Terminal on a Mac","to":"reported-threats-delete-mac-certificate"},{"text":"CyberNut Admin Portal","url":"https://admin.cybernut.com"}],"video_only":false},{"id":"reported-threats-delete-mac-certificate","g":"s5","t":"Make the Reported Threats Delete certificate on a Mac","sum":"Generate the certificate for Microsoft Reported Threats Delete on a Mac using an OpenSSL Terminal script.","p":"microsoft","k":"setup","a":"it-admin","m":6,"u":"2026-10-05","src":["create-cert-terminal"],"orig":["https://knowledgebase.cybernut.com/cybernut-knowledge-base/create-cert-terminal"],"v":[],"sh":0,"b":[{"t":"p","x":"Yes, you can create the certificate with Terminal on macOS. Paste the script below into a plain text editor and replace the password placeholder with your own strong password. Then copy the edited script into Terminal and run it."},{"t":"p","x":"The script creates a folder named Certificates in your home directory. Upload the .cer file to Azure and the .pfx file to the CyberNut Admin Portal."},{"t":"code","x":"CERT_DIR=\"$HOME/Certificates\"\nCERT_NAME=\"CyberNutCert\"\nCERT_PASSWORD=\"YourStrongPasswordHere\"\nVALIDITY_DAYS=365\nmkdir -p \"$CERT_DIR\"\ncd \"$CERT_DIR\"\nopenssl genrsa -out \"${CERT_NAME}.key\" 2048\nopenssl req -new -x509 -key \"${CERT_NAME}.key\" -out \"${CERT_NAME}.cer\" -days $VALIDITY_DAYS -subj \"/CN=${CERT_NAME}\"\nopenssl pkcs12 -export -out \"${CERT_NAME}.pfx\" -inkey \"${CERT_NAME}.key\" -in \"${CERT_NAME}.cer\" -password \"pass:${CERT_PASSWORD}\"\necho \"Done. Files in: $CERT_DIR\"\nls -la \"${CERT_NAME}\".*"},{"t":"note","x":"Replace YourStrongPasswordHere with your own strong password before running the script."}],"l":[],"video_only":false},{"id":"what-is-cybernut","g":"c1","t":"What is CyberNut?","sum":"Learn what CyberNut is and how its five campaign types work, from Baseline and Onboarding to Compliance and Student Training.","p":"both","k":"concept","a":"everyone","m":4,"u":"2026-06-30","src":["what-is-cybernut"],"orig":["https://knowledgebase.cybernut.com/cybernut-knowledge-base/what-is-cybernut"],"v":[],"sh":0,"b":[{"t":"p","x":"CyberNut protects schools by teaching faculty, staff and students to recognize cyber threats. Its hands-on approach to phishing training is the reason engagement has risen."},{"t":"p","x":"We provide:"},{"t":"list","items":["Realistic phishing simulations tailored to each user","Adaptive training that adjusts to how each user performs","Interactive, hands-on experiences that raise cyber awareness"]},{"t":"h","x":"Purpose of Campaigns"},{"t":"p","x":"Campaigns are the main way the program is delivered. Each one runs for a set period and sends training emails to staff to build awareness and reinforce security habits. Each campaign has a specific aim, such as preparing new users during onboarding, mimicking real phishing attacks, measuring current behavior or reinforcing compliance. Together they form a thorough and engaging security awareness program."},{"t":"h","x":"Types of Campaigns"},{"t":"h","x":"Baseline Campaign"},{"t":"p","x":"This campaign helps a district decide whether it needs a reporting tool. It is offered to every district as a Free Trial. After partnering with CyberNut, you are encouraged to start the Onboarding and Phishing Training Campaigns promptly so staff can begin reporting potential threats."},{"t":"h","x":"Onboarding Campaign"},{"t":"p","x":"Staff receive a welcome email and a short one minute tutorial on identifying and reporting suspicious email, so they can take part with confidence. You can schedule it on its own or while scheduling the Phishing Training Campaign."},{"t":"h","x":"Phishing Training Campaign"},{"t":"p","x":"This campaign provides ongoing, adaptive simulations. Phishing emails are tailored to each recipient's behavior so staff can spot and report threats in real time. Correct responses earn acorns. Mistakes trigger a brief, targeted micro-lesson. The campaign runs continuously and with low pressure throughout the school year."},{"t":"h","x":"Compliance Campaign"},{"t":"p","x":"This campaign delivers mandatory compliance training from CyberNut. Admins can see who has completed the materials and who has not, which keeps tracking organized and accountable."},{"t":"h","x":"Student Training Campaign"},{"t":"p","x":"Designed for middle and high school learners, this campaign includes 19 lessons with optional quizzes. Topics include media literacy, device and account security, healthy technology use, cybersecurity basics and safe online behavior. Administrators schedule campaigns and choose the exact date each lesson is emailed to students, so training fits classroom goals and school calendars."}],"l":[],"video_only":false},{"id":"learning-journey","g":"c1","t":"The CyberNut learning journey","sum":"Understand the three phases of CyberNut training, the eight attack types, and how users move across five difficulty levels.","p":"both","k":"concept","a":"everyone","m":4,"u":"2025-11-02","src":["what-is-the-cybernut-learning-journey"],"orig":["https://knowledgebase.cybernut.com/cybernut-knowledge-base/what-is-the-cybernut-learning-journey"],"v":[],"sh":0,"b":[{"t":"h","x":"How We Train Your School Community to Spot and Stop Cyber Threats"},{"t":"p","x":"CyberNut helps schools protect themselves by teaching faculty, staff, and students to recognize and report cyber threats. Training is hands on and personalized. Adaptive learning AI lets each user progress at their own pace."},{"t":"h","x":"Phase I: Quick Onboarding"},{"t":"p","x":"Goal: prepare everyone to report phishing emails."},{"t":"list","items":["Takes about 30 seconds.","Users get a welcome email with a link to an interactive tutorial on how to report suspicious emails.","After the tutorial, users are ready for real phishing simulations."]},{"t":"h","x":"Phase II: Basic Training"},{"t":"p","x":"Goal: learn to recognize different types of phishing attacks. Users are trained on eight attack types:"},{"t":"list","items":["Business Email Compromise","Deceptive URL","Malicious Attachment","Credential Harvesting","Tech Support Scam","Reward Scam","Brand Impersonation","Social Engineering"]},{"t":"p","x":"How it works:"},{"t":"list","items":["Each user starts with a Level 2 (medium difficulty) phishing email.","The system adjusts based on what the user does: click, report, or ignore.","If the user clicks, the next email is an easier Level 1.","If the user reports correctly, the next email is a harder Level 3.","This continues until each user has received two simulations from each of the eight categories.","No two users get the same emails or the same difficulty path."]},{"t":"h","x":"Phase III: Adaptive Learning"},{"t":"p","x":"Goal: target individual weaknesses to build stronger instincts."},{"t":"list","items":["After the first training rounds, the AI reviews which attack types each person struggles with most.","It also reviews their clicks, reports, and engagement patterns.","It then builds a personalized training plan focused on each user's weak spots.","Example: a user who struggles with reward scams keeps practicing that category, while a user who handles them well moves on to harder challenges."]},{"t":"h","x":"The five difficulty levels"},{"t":"p","x":"See How phishing training levels work for the current level definitions and the rules for moving up and down."},{"t":"h","x":"The Result"},{"t":"p","x":"Realistic simulations, adaptive difficulty, and personalized learning paths help schools:"},{"t":"list","items":["Strengthen cybersecurity awareness across staff and students.","Create lasting behavior change.","Build a culture of caution and confidence online."]}],"l":[{"text":"How phishing training levels work","to":"training-levels"}],"video_only":false},{"id":"training-levels","g":"c1","t":"How phishing training levels work","sum":"The five difficulty levels, how users move between them, and the eight attack categories CyberNut trains against.","p":"both","k":"concept","a":"everyone","m":5,"u":"2026-02-12","src":["how-many-levels-of-difficulty-are-there-for-the-phishing-emails","does-clicking-on-a-phishing-email-automatically-move-a-user-down-a-level","do-staff-have-to-report-emails-to-move-up-levels-or-can-they-level-up-by-just-not-clicking","can-users-start-a-phishing-campaign-at-level-3-instead-of-level-2","what-kinds-of-phishing-attacks-does-cybernut-train-against","what-happens-if-staff-refuse-to-use-the-cybernut-add-on"],"orig":["https://knowledgebase.cybernut.com/cybernut-knowledge-base/how-many-levels-of-difficulty-are-there-for-the-phishing-emails","https://knowledgebase.cybernut.com/cybernut-knowledge-base/does-clicking-on-a-phishing-email-automatically-move-a-user-down-a-level","https://knowledgebase.cybernut.com/cybernut-knowledge-base/do-staff-have-to-report-emails-to-move-up-levels-or-can-they-level-up-by-just-not-clicking","https://knowledgebase.cybernut.com/cybernut-knowledge-base/can-users-start-a-phishing-campaign-at-level-3-instead-of-level-2","https://knowledgebase.cybernut.com/cybernut-knowledge-base/what-kinds-of-phishing-attacks-does-cybernut-train-against","https://knowledgebase.cybernut.com/cybernut-knowledge-base/what-happens-if-staff-refuse-to-use-the-cybernut-add-on"],"v":[],"sh":0,"b":[{"t":"p","x":"CyberNut phishing simulations have five difficulty levels. Each one reflects how sophisticated real phishing attacks are, and difficulty adjusts automatically for each user based on how they respond."},{"t":"h","x":"The five levels"},{"t":"list","items":["Level 1: generic emails with clear misspellings, weak grammar and counterfeit branding. Very easy to recognize.","Level 2: emails with light personalization that still show visual or language mistakes and questionable links.","Level 3: polished, professionally branded emails that look genuine and are harder to spot.","Level 4: convincing replicas of login pages for trusted services that try to collect user credentials.","Level 5: advanced spear phishing simulations that use AI written messages, tailored to context, for specific individuals or departments."]},{"t":"note","x":"Levels 4 and 5 were scheduled to roll out during 2026. Ask your Customer Success Manager whether they are active for your district."},{"t":"h","x":"How users move between levels"},{"t":"list","items":["Every user starts at Level 2, which is medium difficulty. This keeps a consistent baseline across all accounts.","Clicking a phishing email moves the user down one level in that attack category.","Reporting a phishing email correctly moves the user up a level.","Progress is tracked separately for each attack category, so a user can be at different levels in categories such as Reward Scams and Deceptive URLs.","Staff can move up without reporting. Not clicking counts as safe behavior. Reporting with the CyberNut add-on moves them up faster."]},{"t":"h","x":"Can a campaign start at Level 3?"},{"t":"p","x":"No. All users start at Level 2. Custom default difficulty levels are not available today, and CyberNut welcomes feature requests."},{"t":"h","x":"The eight attack categories"},{"t":"p","x":"CyberNut phishing simulations cover eight major attack categories. Each one focuses on a different social engineering tactic or deception method. Over time users receive simulations from every category to build well rounded awareness."},{"t":"list","items":["Business Email Compromise (BEC): recognize emails that impersonate executives or colleagues and ask for sensitive actions or payments.","Deceptive URL Links: spot misleading or shortened links that redirect to malicious sites.","Malicious Attachments: identify suspicious file attachments that may contain malware.","Credential Harvesting: detect fake sign in pages built to steal login details.","Tech Support Scams: recognize fraudulent IT or help desk emails that claim account problems or security alerts.","Reward Scams: avoid offers of prizes, gift cards, or bonuses used as bait.","Brand Impersonation Scams: tell real communications from trusted brands or vendors apart from fake ones.","Social Engineering Traps: question messages that manipulate emotions through urgency, fear, or curiosity."]}],"l":[],"video_only":false},{"id":"microtraining","g":"c1","t":"What is microtraining?","sum":"Learn what the short microtraining lesson is and how staff earn acorns after clicking or reporting a simulated phishing email.","p":"both","k":"concept","a":"staff","m":3,"u":"2026-07-08","src":["what-is-microtraining"],"orig":["https://knowledgebase.cybernut.com/cybernut-knowledge-base/what-is-microtraining"],"v":[{"url":"https://www.loom.com/share/9331070ed6df404fad599ded368a18b5","host":"Loom"},{"url":"https://www.loom.com/share/a9fc3d4b78c6408fbe35b52e397fb33b","host":"Loom"},{"url":"https://www.loom.com/share/f00634ebfb704bafa4458ce3e45230e8","host":"Loom"},{"url":"https://www.loom.com/share/a1740818f96e4ba5b1441e143980b407","host":"Loom"}],"sh":0,"b":[{"t":"p","x":"Microtraining is a short lesson that appears after you interact with a simulated phishing email. It is meant as a supportive reminder, not a punishment."},{"t":"p","x":"If you click a link in a simulated email, you go straight to a brief training that shows what to watch for in the future. If you correctly report the email instead, you still get the training so the lesson sticks either way."},{"t":"p","x":"Completing the microtraining earns acorns, which recognize your progress in building stronger security habits. It takes about a minute and is designed to help, not to single anyone out."},{"t":"p","x":"The microtraining experience has been redesigned around interactive red flag detection."},{"t":"list","items":["A modernized design that highlights the red flags in each simulation email.","A new quiz format that checks what you have learned and lets you show your cybersecurity knowledge.","The same acorn reward system, which keeps things engaging and competitive."]}],"l":[],"video_only":false},{"id":"acorns","g":"c1","t":"How acorns work","sum":"Learn how users earn Training and Threat acorns and how acorns drive individual and team leaderboard rankings.","p":"both","k":"concept","a":"portal-admin","m":3,"u":"2026-01-26","src":["how-do-i-link-my-google-cloud-console-project-with-the-cybernut-admin-portal-0-9"],"orig":["https://knowledgebase.cybernut.com/cybernut-knowledge-base/how-do-i-link-my-google-cloud-console-project-with-the-cybernut-admin-portal-0-9"],"v":[],"sh":0,"b":[{"t":"h","x":"Overview"},{"t":"p","x":"CyberNut administrators see two acorn columns: Training Acorns and Threat Acorns."},{"t":"list","items":["When a user reports an email and it is quarantined or deleted from the Reported Threats screen, the reporter earns 3 acorns. These are separate from acorns earned through campaigns.","Real threat acorns appear on the Leaderboard Screen under User Selection.","Rankings use total acorns, which combine Real Threat acorns and Campaign acorns.","Users with the same total share a rank and are sorted by full name (first name plus last name).","Leaderboard screens that show Campaign Earned points gain a Real Threat acorns column with each user's real threat total.","Team rankings use normalized acorns: the sum of all users' campaign acorns plus the sum of all users' real threat acorns, divided by the total number of users."]}],"l":[],"video_only":false},{"id":"baseline-campaign","g":"c2","t":"Create a Baseline campaign","sum":"Create, schedule, and monitor a baseline phishing simulation campaign for staff or students in the Admin Portal.","p":"both","k":"how-to","a":"portal-admin","m":12,"u":"2026-09-24","src":["creating-a-baseline-campaign"],"orig":["https://knowledgebase.cybernut.com/cybernut-knowledge-base/creating-a-baseline-campaign"],"v":[{"url":"https://cybernut.storylane.io/share/fcksxz4ahrwd","host":"Storylane"}],"sh":1,"b":[{"t":"p","x":"The walkthrough covers setting up a phishing simulation, including the name, audience, schedule and timezone, selecting user groups, and scheduling. After launch it shows real time tracking of delivery, clicks, engagement and individual results so you can spot staff who need more training."},{"t":"steps","items":["Sign in to the CyberNut Admin Portal at https://admin.cybernut.com.","Click + Create campaign to start a phishing simulation.","Choose the phishing simulation option.","Continue to the next screen.","Click Next to enter the campaign details.","In Campaign name, enter a name that is easy to find later.","Select Staff or Student as the target audience.","Open the Start field to set the go live date.","Pick the start date. The end date fills in automatically.","Open Timezone and match it to your team's location.","With the dates set, click Next to choose target users.","Use Search to find the user group.","Select the group. It is added to the campaign automatically.","Check or clear individual users to refine the audience.","Click Next to reach the final confirmation.","Click Schedule campaign to confirm.","Open Campaigns to see the new campaign in the list.","Click Scheduled to filter for queued campaigns.","Open Fall 2026 Baseline Campaign to review its details.","Click the tile showing assigned users.","This tile shows how many simulation emails have been sent.","This shows how many users clicked a link in the emails.","This shows how many distinct emails were clicked.","This shows the total click count across all emails.","Toggle to % to view results as percentages.","This shows which email categories get the most clicks as the simulation runs.","This is a ranked leaderboard of the users who clicked most.","Open the Activity tab for a real time timeline of interactions.","Click Users for per user data showing who clicked, who reported, and who may need follow up.","This shows how many simulation emails each user has received.","This shows each user's total click count so you can spot repeat clickers.","This shows each user's unique click count so you can separate one time mistakes from habits."]},{"t":"h","x":"You're All Set"},{"t":"p","x":"You can now create, schedule and monitor a baseline phishing simulation."}],"l":[{"text":"https://admin.cybernut.com","url":"https://admin.cybernut.com/"}],"video_only":false},{"id":"onboarding-campaign","g":"c2","t":"Create an onboarding campaign","sum":"Create an onboarding phishing campaign with dates, completion window, reminders, teams, test emails, and custom email templates.","p":"both","k":"how-to","a":"portal-admin","m":15,"u":"2026-07-24","src":["creating-an-onboarding-campaign"],"orig":["https://knowledgebase.cybernut.com/cybernut-knowledge-base/creating-an-onboarding-campaign"],"v":[{"url":"https://cybernut.storylane.io/share/vxez7ypzjyml","host":"Storylane"}],"sh":42,"b":[{"t":"p","x":"Admins sign in to the Admin Portal, start a Phishing Simulations campaign, and set it up as an Onboarding campaign by configuring its name, audience, schedule, reminders, teams, test recipients and emails, then scheduling it."},{"t":"steps","items":["Sign in to the CyberNut Admin Portal at https://admin.cybernut.com.","Click Create campaign.","Click Phishing Simulations.","Scroll down and choose Onboarding as the campaign type.","Click Next.","Give the campaign a name that is easy to recognize.","Turn on the option to continue a previous campaign, if you want one.","Choose Staff or Student as the target group.","Choose when the campaign should start.","Select the start date.","Choose when the campaign should end.","Select the end date.","Select your time zone so emails send at the right local time.","Enter how many days users have to finish onboarding.","Enter how often reminders should be sent.","Confirm the settings and click Next.","Click Create a team.","Name the team by clicking Untitled and typing a clear name.","Click Select users to add people to the team.","Choose the user group for this team.","Click Next when the team is ready.","Click Assign to choose a Team Captain (optional but useful).","Choose the user who will be Team Captain.","Confirm everything and click Next.","Click Next.","Click Edit to choose who receives the test emails.","Select the users who will be the test recipients.","Choose the group to assign the onboarding campaign to.","Add or remove individual users within those groups as needed.","Finalize your selections and click Next.","Click Assign to confirm the user selection.","Select a Team Captain if needed.","Click Next.","Click Next.","Click Next.","Begin customizing the onboarding email.","Personalize the content of the email, which is sent at the start of onboarding.","Click Save to keep your changes.","To change the reminder email template, click Edit again.","Click Save to apply your changes.","Click Next to review everything.","Click Schedule campaign to launch.","Click View Campaign to see the details."]},{"t":"h","x":"You Did It. Campaign Created!"}],"l":[{"text":"https://admin.cybernut.com","url":"https://admin.cybernut.com"}],"video_only":false},{"id":"phishing-training-campaign","g":"c2","t":"Create a phishing training campaign","sum":"Create an automated phishing training campaign with reminders, teams, template categories, Team Captain, and custom emails.","p":"both","k":"how-to","a":"portal-admin","m":15,"u":"2026-07-13","src":["creating-a-baseline-campaign-0"],"orig":["https://knowledgebase.cybernut.com/cybernut-knowledge-base/creating-a-baseline-campaign-0"],"v":[{"url":"https://cybernut.storylane.io/share/xmlnnrdtbhor","host":"Storylane"}],"sh":29,"b":[{"t":"steps","items":["Sign in to the CyberNut Admin Portal at https://admin.cybernut.com.","Click Create campaign to start.","Select Automated Phishing Training to set up ongoing awareness training for your team.","Choose Phishing Training Campaign to configure your first simulation.","Click Next.","Enter a campaign name that will be easy to identify later.","Open the dropdown if you want to continue from a previous campaign.","Click Clear to start a new campaign instead of reusing one.","Tick the box to notify users when the campaign begins.","Turn on reminder emails to help users stay on track.","Enter how many days users have to finish onboarding.","Set how often reminders are sent until users complete it.","Click Select to choose the campaign start timing.","Pick the start date from the calendar.","Choose when the campaign should end.","Select an end date that gives everyone enough time to participate.","Find and select your organization's time zone so emails arrive at the right time.","Click Next to set up teams.","Click Create a team to group users and track their progress.","Replace Untitled with a meaningful team name.","Click Select users to add members to the team.","Choose a user group from the list to assign all its members at once.","Confirm that the group's users are selected, and adjust if needed.","Click Next.","Click All selected to add the email templates users will receive.","Select the template categories you want to use.","Switch on the templates you want, then click Next. You can preview some of the emails."]},{"t":"note","x":"CAUTION: If you plan to assign templates by department, see How to Create a Phishing Training Campaign by Department. Create your Google or Microsoft groups before creating the campaign."},{"t":"steps","items":["Click Assign to designate a Team Captain for the group.","Select the user who will be Team Captain for this campaign.","Click Next.","Click Next.","Click Next.","To personalize the email, click Edit.","Edit the body text to match your organization's tone and messaging.","Click the eye icon to preview what users will see.","Close the preview with the X.","Click Save to lock in your changes.","Repeat the same steps to customize the reminder email template.","When everything is set, click Next to review and launch.","Click Schedule campaign to go live."]}],"l":[{"text":"https://admin.cybernut.com","url":"https://admin.cybernut.com"},{"text":"How to Create a Phishing Training Campaign by Department","to":"phishing-training-by-department"}],"video_only":false},{"id":"phishing-training-by-department","g":"c2","t":"Create a phishing training campaign by department","sum":"Build a phishing training campaign that sends department-specific templates using Google or Microsoft groups, teams, and Team Captains.","p":"both","k":"how-to","a":"portal-admin","m":25,"u":"2026-08-05","src":["creating-a-baseline-campaign-dept"],"orig":["https://knowledgebase.cybernut.com/cybernut-knowledge-base/creating-a-baseline-campaign-dept"],"v":[{"url":"https://cybernut.storylane.io/share/lwdagq9xa9gv","host":"Storylane"}],"sh":63,"b":[{"t":"note","x":"Google or Microsoft Groups must be created first if you want templates assigned by team (Administrative Staff, Finance, Human Resources, Student Services, Teaching Staff, Technology). Otherwise the general templates work for all users. See How to create Google Groups for CyberNut and How to create Microsoft Groups for CyberNut."},{"t":"steps","items":["Log in to CyberNut at https://admin.cybernut.com.","Click + Create campaign.","Choose the phishing simulation option, which sends realistic test emails to your team.","Select the Training Campaign, which can include the Onboarding campaign during setup.","Click Next.","Name the campaign so you will recognize it later.","Optionally carry over progress from a previous campaign, including onboarding completions and earlier teams.","Choose Staff or Students as the target group.","To include onboarding, check the box to email users when the campaign starts.","Optionally carry over onboarding progress from a previous campaign.","Check the box to send reminders to anyone who misses the onboarding deadline.","Enter the number of days allowed to complete onboarding.","Enter how often reminders are sent.","Click the Start field to set the launch date.","Select a date.","Click the End field to set when the campaign closes.","Select an end date.","Click the Timezone field.","Select your time zone from the list.","Click Next to go to team setup.","What are teams? Department specific templates exist for the six departments listed above. To use them, create Google or Microsoft Groups before creating the team in CyberNut.","Click Create a team.","Click the Untitled field and name the team.","Click Select users to add people.","Search for a user group.","Choose your user group.","Search for and select individuals.","Click Next when the team is ready.","Click All selected to pick all available templates.","Expand a category to preview templates or switch them off.","Click EdTech Vendor to view its 25 sender templates.","Click the button to toggle that sender.","Optionally enable department specific email templates.","Click the specific department for more targeted emails.","Click Next.","Click Assign to give someone access to monitor only the learning portion for this group. Also add that person to your Single Sign-On group.","Select the Team Captain.","Click Next.","Click Next.","To update existing teams, click Edit.","Click users to review group members.","Select High School Staff as your team.","Choose your preference.","Click Already in another team (2) to see overlapping members.","Click Resolve Conflicts to fix overlaps.","Click Next.","Click All selected to include all sender templates.","Expand a category to preview or disable specific senders.","Select a sender to preview.","Click the button to toggle the sender.","Optionally enable department specific email templates.","Click Next.","Select HS Principal if the Team Captain needs updating.","Choose your option.","Click Next.","Click Next.","Click Next.","Click Edit to customize the onboarding email announcing the campaign start.","Customize the onboarding email.","Click Save.","Click Edit to customize the onboarding reminder email.","Customize the reminder email.","Click Save.","Click Next to move toward launch.","Click Schedule campaign to queue it and go live."]},{"t":"p","x":"Congratulations! You have built a phishing training campaign."}],"l":[{"text":"https://admin.cybernut.com","url":"https://admin.cybernut.com"},{"text":"How to create Google Groups for CyberNut","to":"google-groups"},{"text":"How to create Microsoft Groups for CyberNut","to":"microsoft-groups"}],"video_only":false},{"id":"compliance-campaign","g":"c2","t":"Create a compliance training campaign","sum":"Watch a video walkthrough of creating a staff compliance training campaign in the Admin Portal.","p":"both","k":"how-to","a":"portal-admin","m":3,"u":"2025-11-02","src":["creating-a-compliance-campaign"],"orig":["https://knowledgebase.cybernut.com/cybernut-knowledge-base/creating-a-compliance-campaign"],"v":[{"url":"https://cybernut.storylane.io/share/6yobolhwyllj","host":"Storylane"}],"sh":0,"b":[{"t":"note","x":"Since the October 10, 2026 release, you pick courses first and then set up the campaign, and you can set a date for each video."},{"t":"p","x":"Click below to view the full screen walkthrough of creating a compliance training campaign."}],"l":[],"video_only":false},{"id":"student-training-campaign","g":"c2","t":"Create a student training campaign","sum":"Set up a student cybersecurity training campaign with courses, per-course send dates, teams, and a customized email.","p":"both","k":"how-to","a":"portal-admin","m":8,"u":"2025-12-31","src":["creating-a-student-training-campaign"],"orig":["https://knowledgebase.cybernut.com/cybernut-knowledge-base/creating-a-student-training-campaign"],"v":[{"url":"https://cybernut.storylane.io/share/oxncvyx4ftuc","host":"Storylane"}],"sh":17,"b":[{"t":"note","x":"Since the October 10, 2026 release, you pick courses first and then set up the campaign, and you can set a date for each video. Some screens may appear in a different order than the steps below."},{"t":"steps","items":["Log in to the CyberNut Admin Portal at https://admin.cybernut.com.","Click Create campaign.","Click CyberSecurity Training.","Click Student Training Campaign, then Next.","Enter a name for the campaign.","Scroll down, click Start, and choose the campaign start and end dates.","Choose the correct Timezone.","Decide whether to include Quizzes, then click Next.","Check Select All or choose courses individually.","Click Select Date and pick the date students should receive the email to start the course.","Review the selected courses and dates, then click Next.","Click Create a team.","Name the team (for example Smith HS, 9th Grade, etc).","Click Select users.","Check the box next to a user group in the left panel, select all users or individual users in the right panel, then click Next.","Click Next again and create more teams if needed.","After adding all teams, click Next.","Edit the Sender, Subject and/or email content students will receive, then click Next.","Click Create campaign."]}],"l":[{"text":"https://admin.cybernut.com","url":"https://admin.cybernut.com"}],"video_only":false},{"id":"policy-acknowledgement-campaign","g":"c2","t":"Create a policy acknowledgement campaign","sum":"Create a policy acknowledgement campaign in the Admin Portal with groups, dates, sender, subject, and a View Policy link.","p":"both","k":"how-to","a":"portal-admin","m":8,"u":"2025-11-21","src":["how-do-i-link-my-google-cloud-console-project-with-the-cybernut-admin-portal-0-8"],"orig":["https://knowledgebase.cybernut.com/cybernut-knowledge-base/how-do-i-link-my-google-cloud-console-project-with-the-cybernut-admin-portal-0-8"],"v":[{"url":"https://cybernut.storylane.io/share/xduc0j5qxxq9","host":"Storylane"}],"sh":16,"b":[{"t":"steps","items":["Click Create campaign.","Enter a campaign name and choose a Group type.","Click Start and pick a start date.","Click the date that should end the campaign.","Choose the time zone.","Click Next.","Select the group.","Click Select All or check the box beside each individual.","Click Next.","Update the email Sender if needed.","Update the Subject if needed.","Update the title if needed.","Highlight View Policy, click the hyperlink button, and edit the link information as needed.","Update the message body if needed.","Click Next.","Click Create campaign."]}],"l":[],"video_only":false},{"id":"edit-campaign","g":"c3","t":"Edit a phishing training campaign","sum":"Change the name, recipients, and Team Captain of an active phishing training campaign and save with Update campaign.","p":"both","k":"how-to","a":"portal-admin","m":7,"u":"2026-08-26","src":["editing-a-phishing-training-campaign"],"orig":["https://knowledgebase.cybernut.com/cybernut-knowledge-base/editing-a-phishing-training-campaign"],"v":[{"url":"https://cybernut.storylane.io/share/qct6wyznlcp2","host":"Storylane"}],"sh":1,"b":[{"t":"steps","items":["Sign in to the CyberNut Admin Portal at https://admin.cybernut.com.","Open the Campaigns section.","Select the campaign you want to change.","Rename the campaign if needed.","Click the checkmark to save the new name.","Click Edit to open the campaign settings.","Click Edit to change who receives the emails and whether a Team Captain is assigned.","Click the user count, for example 5 users, to adjust recipients.","Choose the user group as the target audience.","Check or uncheck the users who should receive the emails.","Click Next when your selections are correct.","Click the Team Captain option.","Check or uncheck the Team Captain option depending on whether you need one.","Click Next to continue.","Click Next again to confirm the configuration before the final save.","Click Next to review your settings.","Click Update campaign to save the changes and apply them to the campaign."]}],"l":[{"text":"https://admin.cybernut.com","url":"https://admin.cybernut.com"}],"video_only":false},{"id":"change-users-after-start","g":"c3","t":"Add or remove users after a campaign starts","sum":"Learn that users can be changed in active or scheduled campaigns, with a link to the campaign editing guide.","p":"both","k":"how-to","a":"portal-admin","m":1,"u":"2026-03-19","src":["can-i-add-or-remove-users-for-a-campaign-after-it-has-started"],"orig":["https://knowledgebase.cybernut.com/cybernut-knowledge-base/can-i-add-or-remove-users-for-a-campaign-after-it-has-started"],"v":[],"sh":0,"b":[{"t":"p","x":"Yes. You can change the users in an active or scheduled campaign. See Edit a phishing training campaign for the steps."}],"l":[{"text":"Editing a Phishing Training Campaign","to":"edit-campaign"}],"video_only":false},{"id":"teams","g":"c3","t":"What are CyberNut Teams?","sum":"Learn how Teams group staff by building or department for team analytics, leaderboards, and department-specific simulations.","p":"both","k":"concept","a":"portal-admin","m":4,"u":"2026-07-07","src":["what-are-cybernut-teams"],"orig":["https://knowledgebase.cybernut.com/cybernut-knowledge-base/what-are-cybernut-teams"],"v":[],"sh":0,"b":[{"t":"p","x":"Teams let you sort staff by building, department or school. Setup requires some preparation in your Google or Microsoft environment, but it replaces one district wide score, which says little about where risk is concentrated, with a view of which groups are performing well and which need attention."},{"t":"h","x":"What you can do with Teams"},{"t":"list","items":["Find your real exposure. Instead of one blended pass rate, the analytics dashboard shows results for each building, department or school so you can see where to focus.","Increase participation with leaderboards. Team leaderboards rank groups against each other, encouraging friendly competition and more engagement with training.","Send department specific simulations. Assign each team scenarios based on its real work so training feels relevant and is harder to ignore."]},{"t":"h","x":"Before you start"},{"t":"p","x":"Teams in CyberNut are built from groups in your directory. Before creating a team, you need a dedicated Google Group or Microsoft 365 group for it in your own environment. Create a separate group for each team, following the guide for your platform: How to create Google Groups for CyberNut, or How to create Microsoft Groups for CyberNut."},{"t":"h","x":"Setting up a team"},{"t":"steps","items":["In Google or Microsoft, create a dedicated group for the team and add the relevant staff, using the guides above.","In CyberNut, create the team and connect it to that group through Google directory sync or Microsoft Active Directory.","When you build a phishing simulation campaign, select the team you want to assign email templates to."]},{"t":"h","x":"Department-specific templates"},{"t":"list","items":["CyberNut provides several thousand email templates that work across all departments, roles and users.","It also provides templates built for specific departments: Administrators, Finance, HR, IT, Student Services and Teachers.","To use department specific templates, first create the matching Google or Microsoft group, then create the team in CyberNut before assigning templates.","For a full walkthrough, see How to create a Phishing Training Campaign by Department."]}],"l":[{"text":"How to create Google Groups for CyberNut","to":"google-groups"},{"text":"How to create Microsoft Groups for CyberNut","to":"microsoft-groups"},{"text":"How to create a Phishing Training Campaign by Department","to":"phishing-training-by-department"}],"video_only":false},{"id":"team-captain-google","g":"c3","t":"Assign a Team Captain (Google)","sum":"Assign a Team Captain to a campaign and add them to the CyberNut SSO group in Google Admin so they see only that campaign.","p":"google","k":"how-to","a":"portal-admin","m":6,"u":"2026-05-07","src":["assignteamcaptain-google"],"orig":["https://knowledgebase.cybernut.com/cybernut-knowledge-base/assignteamcaptain-google"],"v":[],"sh":10,"b":[{"t":"steps","items":["Sign in to the CyberNut Admin Portal at https://admin.cybernut.com.","Choose a campaign that is currently active.","Click Edit in the upper right corner.","Click Edit next to the team.","Click Assign in the Team Captain section.","Search for and select a Team Captain (for example High School Principal), then click Next twice.","Repeat for any other teams, then click Next.","Review the campaign and click Update campaign.","Sign in to the Google Admin Console at https://admin.google.com.","Go to Directory > Groups and open the CyberNut Admin group, or the group assigned to SSO for CyberNut.","Click Add Members.","Search for the Team Captain you chose in CyberNut (for example High School Principal), select them, then click Add to Group.","Have the new Team Captain sign in to the CyberNut Admin Portal at https://admin.cybernut.com using SSO. They will see only the campaign assigned to them."]}],"l":[{"text":"https://admin.cybernut.com","url":"https://admin.cybernut.com"},{"text":"https://admin.google.com","url":"https://admin.google.com"}],"video_only":false},{"id":"team-captain-microsoft","g":"c3","t":"Assign a Team Captain (Microsoft)","sum":"Assign a Team Captain to a campaign and add them to the CyberNut SSO enterprise app in Microsoft Entra ID.","p":"microsoft","k":"how-to","a":"portal-admin","m":7,"u":"2026-05-07","src":["assignteamcaptain-microsoft"],"orig":["https://knowledgebase.cybernut.com/cybernut-knowledge-base/assignteamcaptain-microsoft"],"v":[],"sh":14,"b":[{"t":"steps","items":["Sign in to the CyberNut Admin Portal at https://admin.cybernut.com.","Choose an active campaign.","Click Edit.","Click Edit for the team.","In the Team Captain section, click Assign.","Search for and select a Team Captain (for example High School Principal), then click Next twice.","Repeat for other teams as needed, then click Next.","Review the campaign and click Update campaign.","Sign in to the Microsoft Azure Portal at https://portal.azure.com/.","In the Manage Microsoft Entra ID section, click View.","Click Enterprise applications.","Find and open the CyberNut SSO application.","Click the Assign users and groups link.","Click Add user/group.","Click the None Selected link.","Search for the user or users who will be Team Captains, check them, and click Select.","On the next screen, click Assign.","Have the new Team Captain sign in to the CyberNut Admin Portal at https://admin.cybernut.com using SSO. They will see only the campaign assigned to them."]}],"l":[{"text":"https://admin.cybernut.com","url":"https://admin.cybernut.com"},{"text":"https://portal.azure.com/","url":"https://portal.azure.com/"}],"video_only":false},{"id":"reset-leaderboard","g":"c3","t":"Reset leaderboard rankings","sum":"Set a monthly, trimester, quarterly, or one-time leaderboard reset for a campaign while keeping history in Period History.","p":"both","k":"how-to","a":"portal-admin","m":4,"u":"2026-08-03","src":["reset-leaderboard"],"orig":["https://knowledgebase.cybernut.com/cybernut-knowledge-base/reset-leaderboard"],"v":[],"sh":9,"b":[{"t":"h","x":"What's New"},{"t":"list","items":["Flexible Competition Periods: admins can run time limited competitions on a monthly, quarterly or on demand basis. All time user data is kept, because acorn totals are stored in a separate record.","Automatic Historical Archiving: each reset saves a snapshot of the rankings, including winners and date ranges. These snapshots are kept indefinitely in the Period History tab for auditing and recognition."]},{"t":"steps","items":["Choose an active campaign.","Click Leaderboard.","If needed, use the button to switch to the Current leaderboard period.","Click Leaderboard settings.","Adjust the leaderboard settings here.","Choose Monthly to reset the leaderboard on a set day of the month.","Choose Trimester to reset the leaderboard across three periods.","Choose Quarterly to reset the leaderboard across four periods.","Choose One-time custom to reset the leaderboard on a specific date."]}],"l":[{"text":"[1]","url":"https://docs.google.com/document/d/1X8aDA25_cu12OTfN7l7vVnhzHDwqAIVBOzMD9RWrVs4/edit"}],"video_only":false},{"id":"add-an-admin","g":"c3","t":"Add an admin to the Admin Portal","sum":"Give a colleague admin access through Settings Users plus sign-up, or by adding them to the CyberNut SSO group in Google or Microsoft.","p":"both","k":"how-to","a":"portal-admin","m":7,"u":"2026-02-13","src":["how-do-i-add-an-admin-to-my-cybernut-account"],"orig":["https://knowledgebase.cybernut.com/cybernut-knowledge-base/how-do-i-add-an-admin-to-my-cybernut-account"],"v":[],"sh":4,"b":[{"t":"steps","items":["Sign in to the CyberNut Admin Portal at https://admin.cybernut.com.","Open Settings.","Select Users, scroll to the bottom, and add the people you want. This grants them access to the account but does not create their accounts or send them an email.","Choose the path that fits your setup. Use the first path if you are only running a Baseline Campaign or have not set up single sign-on. Use the second path if single sign-on and the full technical integration are complete."]},{"t":"h","x":"Baseline Campaign only, or single sign-on not set up"},{"t":"steps","items":["Have each new admin open the Admin Portal at https://admin.cybernut.com.","Click Sign up in the top right corner of the browser.","Complete every sign up step."]},{"t":"h","x":"Single sign-on is set up"},{"t":"p","x":"If single sign-on is complete, follow the Google or Microsoft directions below. Microsoft users should scroll down."},{"t":"h","x":"Directions for Google"},{"t":"steps","items":["Open the Google Admin Console at https://admin.google.com.","Select Directory from the left menu.","Click Groups.","Click the CyberNut Admin group.","Click Add Members.","Add the people who should have Single Sign-On access. For example, create a CyberNut Manager and add them to this group.","Click Add to Group."]},{"t":"h","x":"Directions for Microsoft"},{"t":"steps","items":["Open the Microsoft Azure Portal at https://portal.azure.com/.","Click View for Manage Microsoft Entra ID.","Select Enterprise applications from the left menu.","Find and click the CyberNut SSO application.","Select Assign users and groups.","Click Add user/group.","Click None Selected.","Search for and select the user or users.","Click Select.","Click Assign."]}],"l":[{"text":"CyberNut Admin Portal","url":"https://admin.cybernut.com"},{"text":"Google Admin Console","url":"https://admin.google.com"},{"text":"Microsoft Azure Portal","url":"https://portal.azure.com/"}],"video_only":false},{"id":"admin-settings-tour","g":"c3","t":"Tour of Admin Portal Settings","sum":"Watch a walkthrough video of the Settings area in the CyberNut Admin Portal.","p":"both","k":"how-to","a":"portal-admin","m":3,"u":"2026-07-11","src":["settings-feature"],"orig":["https://knowledgebase.cybernut.com/cybernut-knowledge-base/settings-feature"],"v":[{"url":"https://cybernut.storylane.io/share/f70k6j8h2rl4","host":"Storylane"}],"sh":0,"b":[],"l":[],"video_only":true},{"id":"change-campaign-dates","g":"c3","t":"Can I change campaign dates?","sum":"Learn that campaign dates cannot currently be changed and that this capability is on the roadmap.","p":"both","k":"concept","a":"portal-admin","m":1,"u":"2026-01-29","src":["can-i-change-the-dates-of-the-campaign"],"orig":["https://knowledgebase.cybernut.com/cybernut-knowledge-base/can-i-change-the-dates-of-the-campaign"],"v":[],"sh":0,"b":[{"t":"p","x":"Editing the dates of a campaign is not available right now. The team is improving the platform and date changes are on the current roadmap. More details are expected soon."}],"l":[],"video_only":false},{"id":"campaign-length","g":"c3","t":"How long should a campaign run?","sum":"Learn the recommended campaign length is the full academic year, with customizable start and end dates.","p":"both","k":"concept","a":"portal-admin","m":1,"u":"2025-11-03","src":["how-long-should-i-run-the-campaign"],"orig":["https://knowledgebase.cybernut.com/cybernut-knowledge-base/how-long-should-i-run-the-campaign"],"v":[],"sh":0,"b":[{"t":"p","x":"The recommended approach is to keep your phishing training campaign running for the whole school year. You can still adjust the start and end dates to suit your needs."}],"l":[],"video_only":false},{"id":"simulation-frequency","g":"c3","t":"How often are simulations sent?","sum":"Learn that each user gets one phishing simulation per week and that blackout dates pause all emails.","p":"both","k":"concept","a":"portal-admin","m":1,"u":"2025-11-03","src":["how-often-are-phishing-simulations-emailed-to-users"],"orig":["https://knowledgebase.cybernut.com/cybernut-knowledge-base/how-often-are-phishing-simulations-emailed-to-users"],"v":[],"sh":0,"b":[{"t":"p","x":"During a campaign, each user receives one simulated phishing email per week. If you submit a blackout date, sending pauses for that period."}],"l":[],"video_only":false},{"id":"welcome-email-timing","g":"c3","t":"When do welcome emails go out?","sum":"Learn that Welcome Emails go out in waves on day one and every user gets one within 24 hours of the start.","p":"both","k":"concept","a":"portal-admin","m":1,"u":"2025-11-03","src":["at-what-time-will-the-users-receive-their-welcome-email"],"orig":["https://knowledgebase.cybernut.com/cybernut-knowledge-base/at-what-time-will-the-users-receive-their-welcome-email"],"v":[],"sh":0,"b":[{"t":"p","x":"Welcome Emails go out in batches over the first day of the campaign. CyberNut staggers the sends to reduce system load, so users do not all receive their email at the same moment. Every user is guaranteed to receive the email within 24 hours of the campaign start date."}],"l":[],"video_only":false},{"id":"baseline-results","g":"c4","t":"Read Baseline campaign results","sum":"Read a completed baseline campaign's Overview, Activity, and Users tabs to find click rates, themes, and highest-risk users.","p":"both","k":"how-to","a":"portal-admin","m":8,"u":"2026-09-24","src":["baseline-campaign-analytics"],"orig":["https://knowledgebase.cybernut.com/cybernut-knowledge-base/baseline-campaign-analytics"],"v":[{"url":"https://cybernut.storylane.io/share/zvyysyfkbqri","host":"Storylane"}],"sh":19,"b":[{"t":"h","x":"Overview"},{"t":"p","x":"This walkthrough shows how to review a completed security awareness phishing campaign. It covers the campaign dashboard, key metrics such as click rates and user engagement, which phishing email themes were most effective, and individual user behavior. The goal is to understand baseline security risk and identify high risk users for follow up training."},{"t":"steps","items":["Sign in to the CyberNut Admin Portal at https://admin.cybernut.com/.","Open Campaigns, the central hub for tracking all security awareness activity.","Click the Completed tab to show only finished campaigns with results ready to review.","Select the Fall 2026 Baseline campaign, which the walkthrough uses throughout.","Review the overview, which shows all key campaign metrics in one place.","Click the % toggle to switch from raw numbers to percentages for easier benchmarking.","Note the total number of assigned users, your starting point for scope and coverage.","Note the total emails sent. Each user receives 3, so dividing by 3 should match the user count.","Check the click rate, the share of users who engaged with at least one phishing email. This is a key baseline risk indicator.","Check unique clicks, which remove duplicates to show how many distinct emails caught attention.","Check the ratio of total clicks to total emails sent, which helps spot sends with disproportionate engagement.","Scan the top email categories to see which phishing themes were most effective, and use this to guide your next training focus.","Review the highest risk users based on click behavior, a starting point for targeted follow up or training.","Open the Activity tab for a chronological timeline of when and how users interacted with campaign emails.","Click a specific date to open the exact email that triggered the interaction.","Preview the email to see what the user saw, which helps explain why they may have clicked.","Open the Users tab to break down results by individual and identify who needs the most support.","Click a user to see their interactions, including emails received and how they responded.","Review that user's full activity breakdown: clicks, timing and emails engaged with.","Return to the Overview tab for a high level summary to anchor your debrief or reporting."]},{"t":"p","x":"Congratulations! You now know how to read and navigate a completed baseline campaign, from top line metrics to individual user activity."}],"l":[{"text":"https://admin.cybernut.com/","url":"https://admin.cybernut.com/"}],"video_only":false},{"id":"onboarding-results","g":"c4","t":"Read Onboarding campaign results","sum":"Watch a video walkthrough of the analytics dashboard for an onboarding campaign.","p":"both","k":"how-to","a":"portal-admin","m":3,"u":"2025-11-04","src":["onboarding-campaign-analytics"],"orig":["https://knowledgebase.cybernut.com/cybernut-knowledge-base/onboarding-campaign-analytics"],"v":[{"url":"https://cybernut.storylane.io/share/qm8hfypq2e4e","host":"Storylane"}],"sh":0,"b":[{"t":"p","x":"Click below for a full screen walkthrough video."}],"l":[],"video_only":false},{"id":"training-results","g":"c4","t":"Read phishing training results","sum":"Watch a video walkthrough of the analytics dashboard for a phishing training campaign.","p":"both","k":"how-to","a":"portal-admin","m":3,"u":"2025-11-04","src":["training-campaign-analytics"],"orig":["https://knowledgebase.cybernut.com/cybernut-knowledge-base/training-campaign-analytics"],"v":[{"url":"https://cybernut.storylane.io/share/ylsdolvp1ivo","host":"Storylane"}],"sh":0,"b":[{"t":"p","x":"Click below for a full screen walkthrough video."}],"l":[],"video_only":false},{"id":"compliance-results","g":"c4","t":"Read compliance campaign results","sum":"Review compliance campaign participants, completion status, and leaderboard, and resend links or mark users completed.","p":"both","k":"how-to","a":"portal-admin","m":5,"u":"2025-11-04","src":["compliance-campaign-analytics"],"orig":["https://knowledgebase.cybernut.com/cybernut-knowledge-base/compliance-campaign-analytics"],"v":[{"url":"https://cybernut.storylane.io/share/676hj1lq8u12","host":"Storylane"}],"sh":0,"b":[{"t":"p","x":"Click below for a full screen walkthrough video."},{"t":"steps","items":["Open the Active tab if the campaign is scheduled or running, or the Completed tab if its end date has passed.","Click the card for your campaign.","The overview shows the campaign name, start date, compliance due date, reminder email frequency, time zone and blackout dates.","Click the Participants button to view participants.","Click Results to see the data: total users, emails sent (including reminders and warnings), and how many users have not started, are in progress, or have completed. You can toggle the view to show each category as a percentage.","Turn off the summary toggle to display the leaderboard, which lists each user and the acorns they have earned by completing quizzes in the Compliance module.","The Not Started, In Progress and Completed tabs each list their users. For users who have not started or are still in progress, you can resend the training link email or mark them as completed. Marking them completed moves them to the Completed tab, which shows all finished users."]}],"l":[],"video_only":false},{"id":"onboarding-data-timing","g":"c4","t":"When will onboarding data appear?","sum":"Learn that onboarding data syncs the first night, so completion data appears on Day 2 of the campaign.","p":"both","k":"concept","a":"portal-admin","m":1,"u":"2025-11-03","src":["when-will-i-see-data-for-onboarding"],"orig":["https://knowledgebase.cybernut.com/cybernut-knowledge-base/when-will-i-see-data-for-onboarding"],"v":[],"sh":0,"b":[{"t":"p","x":"Campaign data syncs during the first night of a campaign. Completion results should start to appear on Day 2."}],"l":[],"video_only":false},{"id":"reported-threats","g":"t1","t":"Reported Threats 2.0","sum":"Review, remediate, escalate, and search reported phishing emails in the redesigned case-based Reported Threats dashboard.","p":"both","k":"how-to","a":"portal-admin","m":15,"u":"2026-07-14","src":["threat-without-att"],"orig":["https://knowledgebase.cybernut.com/cybernut-knowledge-base/threat-without-att"],"v":[{"url":"https://cybernut.storylane.io/share/3ien8dyx1rvy","host":"Storylane"}],"sh":43,"b":[{"t":"note","x":"Since the October 10, 2026 release, the Reported Threats page opens on the last 30 days, escalated cases are pinned to the top of Needs Review, and bulk actions can quarantine or delete all emails in the selected cases."},{"t":"p","x":"Threat management without ATT."},{"t":"p","x":"The Active Threat Manager has been redesigned with three main changes."},{"t":"list","items":["Case-based dashboard. Reported threats are grouped by sender and subject so admins can review clusters of similar emails at once.","Advanced Threat Search. From any reported threat case, admins can start a domain wide search, pre-filled with the sender and subject, to find related messages.","Action Audit Log. A chronological, read only record of actions on a case, showing whether an admin or CyberNut performed each one."]},{"t":"steps","items":["Sign in to CyberNut at https://admin.cybernut.com.","Click Reported Threats.","New reported threats appear after login, or you can open Reported Threats from the left panel.","Remediated threats are sorted into categories for future reference.","Filter results by number of days.","Click Needs Review to see threats you have not remediated yet.","Click a threat's row to review it.","Open the case. The email preview opens automatically inside it.","Preview the email, or click Headers to see its metadata.","Click Remediate to act on the threat.","Choose the appropriate remediation option for the email or emails.","Click to mark the email or emails as Spam.","If enabled in settings, a template appears after you choose. Click Mark Spam to send a reply to the people who reported it.","Click to mark the email or emails as Safe.","Click to mark the email or emails as Ignore.","Click to escalate the email or emails for further review.","Click Reporters to see who reported the threat.","Review the email preview inside the case.","Preview the email and check its headers.","Click Accounts secured to check protected accounts.","Click Audit Log to view activity history.","Click to open Advanced Threat Search and find all users who received the email.","The Date and Subject fields are pre-filled.","Click Search to start the query.","At any time, open Advanced Threat Search from the left panel.","Click the Date field to select a timeframe.","Enter a recipient email if needed.","Enter a subject if needed. Part of a subject is enough.","Enter a Message ID for a more exact search.","Click Search to run the query.","Click the subject to view details.","Check the box beside the email to act on it.","Click Action to see the available options.","Choose from the list of actions.","After you select an action, a message explains what will happen.","Click Compromised Accounts to check for security breaches.","View whether any accounts are compromised.","Click the case to review its details.","Review all details about the email to support your investigation.","Click ATT recommended actions to view recommendations.","Click Key Evidence to see detailed evidence.","Click Reporters to check reporter information.","Click Accounts secured to confirm protections were applied.","Click Audit Log to review the action history.","Take action and remediate as needed, as shown earlier."]},{"t":"p","x":"Congratulations! You have learned about Reported Threats 2.0. Read this article to learn about the Automatic Threat Terminator, which improves the threats manager."}],"l":[{"text":"https://admin.cybernut.com","url":"https://admin.cybernut.com"},{"text":"this article","to":"automatic-threat-terminator"}],"video_only":false},{"id":"processing-status","g":"t1","t":"What the Processing statuses mean","sum":"Understand Pending, Analyzing, Complete, and Error statuses on the Processing tab and when to retry or contact support.","p":"both","k":"troubleshoot","a":"portal-admin","m":3,"u":"2026-08-25","src":["what-does-processing-mean-on-reported-threats"],"orig":["https://knowledgebase.cybernut.com/cybernut-knowledge-base/what-does-processing-mean-on-reported-threats"],"v":[],"sh":0,"b":[{"t":"h","x":"Overview"},{"t":"p","x":"The Processing tab holds reported threats while CyberNut analyzes them. Each item shows one of four statuses: Pending, Analyzing, Complete or Error."},{"t":"h","x":"The four statuses"},{"t":"list","items":["Pending: the item is queued and analysis has not started. No action needed. It starts automatically.","Analyzing: CyberNut is working on the item now. No action needed. Wait for it to finish.","Complete: analysis is done and results are on the case record. Review them.","Error: analysis failed. Action needed. See the Error section below."]},{"t":"h","x":"How long should this take?"},{"t":"p","x":"Most items go from Pending to Analyzing to Complete within minutes. Volume, file size and content type all affect timing. If an item stays in Pending or Analyzing for more than 24 hours, treat it as stuck and contact CyberNut Support."},{"t":"h","x":"If an item shows Error"},{"t":"p","x":"An Error appears only after CyberNut has automatically retried the item up to three times. To retry manually:"},{"t":"steps","items":["Open the item's case record.","Select the manual retry action.","The item returns to the queue and analysis restarts."]},{"t":"note","x":"If the item fails again after your manual retry, contact CyberNut Support with the case ID. Do not keep retrying, since a repeat failure usually needs support to investigate."},{"t":"h","x":"Quick troubleshooting"},{"t":"list","items":["Long running Pending or Analyzing: refresh the page first, because status does not always update live. If it has not moved after 24 hours, contact Support with the case ID.","Error status: use manual retry on the case record. If it errors again, contact Support.","Item missing from Processing: completed items move to their associated tab once processed. Check there first.","Everything stuck at once: this likely indicates a system level problem. Contact Support instead of retrying items one by one."]},{"t":"h","x":"Getting help"},{"t":"p","x":"When contacting Support about a stuck or failed item, include the case ID and the status shown so the team can pull that item's processing history."}],"l":[],"video_only":false},{"id":"automatic-threat-terminator","g":"t1","t":"Automated Threat Terminator (ATT)","sum":"Learn how the ATT add-on scores and labels reported threats and set up auto-remediation rules for phishing and spam.","p":"both","k":"concept","a":"portal-admin","m":6,"u":"2026-07-11","src":["threat-with-att"],"orig":["htt
