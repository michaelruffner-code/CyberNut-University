<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Guides for running CyberNut in your district: campaigns, threat protection, reporting tools and troubleshooting.">
<meta name="robots" content="noindex">
<meta property="og:title" content="CyberNut Help Center">
<meta property="og:description" content="Guides for running CyberNut in your district.">
<meta name="theme-color" content="#004DCD">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23004DCD'/%3E%3Ccircle cx='32' cy='32' r='14' fill='%23F3DD4A'/%3E%3C/svg%3E">
<title>CyberNut Help Center</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&amp;family=JetBrains+Mono:wght@500&amp;display=swap">
<style>
/* Layout: CyberNut blue header and hero like cybernut.com, then three views (home, article reader) driven by the URL hash */
:root{
  --bg:#f5f8ff; --surface:#ffffff; --sunk:#eef3ff; --ink:#0b1b3f; --muted:#4a5c85; --line:#d9e3f5;
  --navy:#004dcd; --navy-ink:#ffffff; --accent:#004dcd; --accent-soft:#d2e2ff; --brand:#004dcd; --brand-deep:#001643;
  --yellow:#f3dd4a; --yellow-ink:#001643;
  --g:#1a5fd6; --g-soft:#e3ecff; --ms:#6b3fc0; --ms-soft:#efe8fa; --good:#16804f; --good-soft:#dff3e8; --warn-soft:#fff7d6; --warn:#7a5a00;
  --shadow:0 1px 2px rgba(0,22,67,.06),0 8px 24px rgba(0,22,67,.06);
  --display:"Figtree","Segoe UI",Arial,sans-serif;
  --body:"Figtree","Segoe UI",Arial,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#06102a; --surface:#0d1a3c; --sunk:#0a1534; --ink:#eaf0ff; --muted:#9fb0d6; --line:#203058;
  --navy:#8db3ff; --navy-ink:#06102a; --accent:#8db3ff; --accent-soft:#16295c; --brand:#004dcd; --brand-deep:#001643;
  --yellow:#f3dd4a; --yellow-ink:#001643;
  --g:#8db3ff; --g-soft:#16295c; --ms:#c3a6f5; --ms-soft:#2a1e48; --good:#4cc490; --good-soft:#123527; --warn-soft:#332a0c; --warn:#f0d36a;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#06102a; --surface:#0d1a3c; --sunk:#0a1534; --ink:#eaf0ff; --muted:#9fb0d6; --line:#203058;
  --navy:#8db3ff; --navy-ink:#06102a; --accent:#8db3ff; --accent-soft:#16295c; --brand:#004dcd; --brand-deep:#001643;
  --yellow:#f3dd4a; --yellow-ink:#001643;
  --g:#8db3ff; --g-soft:#16295c; --ms:#c3a6f5; --ms-soft:#2a1e48; --good:#4cc490; --good-soft:#123527; --warn-soft:#332a0c; --warn:#f0d36a;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.6}
h1,h2,h3,h4{font-family:var(--display);line-height:1.12;margin:0;text-wrap:balance;letter-spacing:-.01em}
p{margin:0}
a{color:var(--navy)}
:focus-visible{outline:3px solid var(--yellow);outline-offset:2px;border-radius:8px}
.wrap{max-width:1160px;margin:0 auto;padding-inline:20px}
button{font-family:var(--body)}

/* Top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--brand);color:#fff}
.top .wrap{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center;padding-block:12px}
.brand{display:flex;align-items:center;gap:10px;white-space:nowrap;text-decoration:none;color:#fff;font-weight:600;font-size:15px}
.brand .logo{height:32px;width:auto;display:block}
.brand span{padding-left:10px;border-left:1px solid rgba(255,255,255,.35);opacity:.95}
.search{flex:1 1 320px;position:relative;min-width:0}
.search input{width:100%;font:16px var(--body);padding:11px 16px 11px 42px;border:0;border-radius:999px;background:#fff;color:#0b1b3f}
.search input::placeholder{color:#6b7a99}
.search input:focus{outline:3px solid var(--yellow);outline-offset:1px}
.search svg{position:absolute;left:15px;top:50%;transform:translateY(-50%);width:18px;height:18px;stroke:#4a5c85}
.plat{display:flex;gap:4px;background:rgba(255,255,255,.14);border-radius:999px;padding:4px}
.plat button{font:600 14px var(--body);border:0;background:transparent;color:#fff;padding:7px 14px;border-radius:999px;cursor:pointer;white-space:nowrap}
.plat button[aria-pressed="true"]{background:#fff;color:#004dcd}

/* Home */
.herox{background:var(--brand);color:#fff;padding-block:40px 92px;position:relative;overflow:hidden}
.herox::after{content:"";position:absolute;right:-120px;top:-80px;width:420px;height:420px;border-radius:50%;background:radial-gradient(circle,rgba(210,226,255,.18),rgba(210,226,255,0) 70%);pointer-events:none}
.hero{display:grid;gap:18px;position:relative;z-index:1}
.hero h1{font-size:clamp(34px,5.4vw,56px);font-weight:800;max-width:16ch}
.hero h1 em{font-style:normal;background:var(--yellow);color:var(--yellow-ink);padding:0 .18em;border-radius:6px}
.hero p.sub{color:#d2e2ff;font-size:19px;max-width:58ch}
.lift{margin-top:-68px;position:relative;z-index:2;display:grid;gap:18px}
.wizcta{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:18px;align-items:center;background:var(--surface);color:var(--ink);border-radius:20px;padding:20px 24px;box-shadow:var(--shadow);border:1px solid var(--line)}
.wizcta .ic{width:52px;height:52px;border-radius:14px;background:var(--yellow);display:grid;place-items:center}
.wizcta .ic svg{width:28px;height:28px}
.wizcta b{font-size:21px;font-weight:800;display:block}
.wizcta span{color:var(--muted);font-size:15px}
.wizcta a{background:var(--brand);color:#fff;text-decoration:none;font-weight:700;padding:12px 22px;border-radius:999px;white-space:nowrap}
.paths{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.path{display:grid;gap:8px;align-content:start;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:20px;text-decoration:none;color:var(--ink);box-shadow:var(--shadow);transition:border-color .15s,transform .15s}
.path:hover{border-color:var(--navy);transform:translateY(-3px)}
.path .pi{width:40px;height:40px;border-radius:12px;background:var(--accent-soft);display:grid;place-items:center}
.path .pi svg{width:22px;height:22px;stroke:var(--navy);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.who{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.path b{font-size:20px;font-weight:700}
.path span.d{font-size:14.5px;color:var(--muted)}
.path span.n{font-size:13px;color:var(--navy);font-weight:600;margin-top:2px}
.news{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 16px;font-size:15px}
.news b{background:var(--yellow);color:var(--yellow-ink);font-size:12px;letter-spacing:.06em;text-transform:uppercase;padding:3px 10px;border-radius:999px}
.news a{font-weight:700}
.qa{padding-block:36px 0;display:grid;gap:14px}
.qa h2,.journey h2{font-size:26px;font-weight:800}
.qgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px}
.q{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px 18px;display:grid;gap:4px;align-content:start}
.q .qq{font-weight:700;font-size:15.5px}
.q .aa{font-size:15px;color:var(--muted)}
.q a{font-size:13.5px;font-weight:700;text-decoration:none}
.journey{padding-block:36px 0;display:grid;gap:14px}
.journey p.sub{color:var(--muted);max-width:62ch}

.tasks{display:grid;gap:14px}
.tasks-h,.browse-h{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 14px}
.tasks-h h2,.browse-h h2{font-size:26px;font-weight:800}
.tasks-h h2{color:#fff}
.tasks-h span{color:#d2e2ff}
.browse-h{margin-top:14px}
.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.task{display:grid;grid-template-columns:auto minmax(0,1fr);gap:14px;align-items:start;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px 18px;text-decoration:none;color:var(--ink);box-shadow:var(--shadow);transition:border-color .15s,transform .15s}
.task:hover{border-color:var(--navy);transform:translateY(-2px)}
.task .pi{width:42px;height:42px;border-radius:12px;background:var(--brand);display:grid;place-items:center}
.task .pi svg{width:22px;height:22px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.task .tt{display:grid;gap:2px;min-width:0}
.task .tt b{font-size:16px;font-weight:700}
.task .tt span{font-size:14px;color:var(--muted)}
.task .tt .tm{font-size:12.5px;color:var(--navy);font-weight:600;margin-top:4px}

.keyf{display:grid;gap:14px;margin-top:10px}
.keyf-h{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 14px}
.keyf-h h2{font-size:26px;font-weight:800}
.keyf-h span{color:var(--muted)}
.kgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px}
.kf{background:linear-gradient(160deg,#0a2a78,#001643);color:#fff;border-radius:20px;padding:22px;display:grid;gap:12px;align-content:start;box-shadow:var(--shadow)}
.kf .kt{display:flex;gap:12px;align-items:center}
.kf .ki{width:46px;height:46px;border-radius:14px;background:var(--yellow);display:grid;place-items:center;flex:none}
.kf .ki svg{width:24px;height:24px;stroke:#001643;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.kf h3{font-size:21px;font-weight:800;color:#fff}
.kf .kv{color:#d2e2ff;font-size:15.5px}
.kf ul{margin:0;padding:0;list-style:none;display:grid;gap:8px}
.kf li{position:relative;padding-left:24px;font-size:14.5px;color:#eef3ff}
.kf li::before{content:"";position:absolute;left:2px;top:7px;width:10px;height:10px;border-radius:50%;background:var(--yellow)}
.kf .kb{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px}
.kf .kb a{font:700 14px var(--body);padding:9px 16px;border-radius:999px;text-decoration:none}
.kf .kb a.p{background:var(--yellow);color:#001643}
.kf .kb a.s{border:1.5px solid rgba(255,255,255,.5);color:#fff}
.chip.key{background:var(--yellow);color:#001643}

/* Figures */
figure.fig{margin:0;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px;display:grid;gap:10px}
figure.fig svg{width:100%;height:auto;display:block}
figure.fig figcaption{font-size:14px;color:var(--muted)}
.f-box{fill:var(--accent-soft);stroke:var(--navy);stroke-width:1.5}
.f-hi{fill:var(--brand)}
.f-yl{fill:var(--yellow)}
.f-t{fill:var(--ink);font:600 14px var(--body)}
.f-tw{fill:#fff;font:700 14px var(--body)}
.f-twd{fill:#e6eeff;font:500 12.5px var(--body)}
.f-ty{fill:#001643;font:700 13px var(--body)}
.f-s{fill:var(--muted);font:500 12.5px var(--body)}
.f-big{fill:var(--ink);font:800 17px var(--body)}
.f-ln{stroke:var(--muted);stroke-width:1.5;fill:none}
.f-up{stroke:var(--good);stroke-width:2.5;fill:none}
.f-dn{stroke:#d1453b;stroke-width:2.5;fill:none}
.f-scroll{overflow-x:auto}

.main{display:grid;grid-template-columns:230px minmax(0,1fr);gap:40px;padding-block:44px 72px;align-items:start}
nav.side{position:sticky;top:calc(env(safe-area-inset-top,0px) + 84px);display:grid;gap:2px}
nav.side a{display:flex;justify-content:space-between;gap:8px;padding:9px 14px;border-radius:999px;text-decoration:none;color:var(--ink);font-weight:600;font-size:15px}
nav.side a:hover{background:var(--surface)}
nav.side a.on{background:var(--brand);color:#fff}
nav.side a.on small{color:#d2e2ff}
nav.side small{color:var(--muted);font-weight:500;font-variant-numeric:tabular-nums}
.content{display:grid;gap:60px;min-width:0}
section.sec{display:grid;gap:20px;scroll-margin-top:96px}
.sechead{display:grid;gap:6px}
.sechead h2{font-size:clamp(26px,3.6vw,34px);font-weight:800}
.sechead p{color:var(--muted);max-width:62ch}
.group{display:grid;gap:10px}
.ghead{display:flex;gap:14px;align-items:flex-start}
.ghead .gt{display:grid;gap:2px;flex:1;min-width:0}
.ghead h3{font-size:19px;font-weight:700}
.ghead p{font-size:15px;color:var(--muted)}
.ghead .ct{font-size:13px;color:var(--muted)}
.list{list-style:none;margin:0;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.list li+li{border-top:1px solid var(--line)}
.art{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 16px;padding:14px 18px;text-decoration:none;color:var(--ink)}
.art:hover{background:var(--sunk)}
.art .t{font-weight:700;font-size:16px}
.art .s{grid-column:1;font-size:14.5px;color:var(--muted)}
.art .meta{grid-row:1/span 2;grid-column:2;display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end;max-width:230px}
.chip{font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;white-space:nowrap}
.chip.g{background:var(--g-soft);color:var(--g)}
.chip.m{background:var(--ms-soft);color:var(--ms)}
.chip.k{background:var(--sunk);color:var(--muted)}
.chip.v{background:var(--yellow);color:var(--yellow-ink)}
.min{font-size:12px;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.symptoms .art .t::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--yellow);box-shadow:0 0 0 2px var(--brand);margin-right:10px;vertical-align:middle}
.crumb{font-size:12px;color:var(--accent);font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:16px;padding:24px;color:var(--muted)}
mark{background:var(--yellow);color:#001643;border-radius:3px;padding:0 2px}
#results{display:grid;gap:14px;padding-block:28px 64px}
#results h2{font-size:24px}
.support{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px 20px;display:grid;gap:8px;align-content:start}
.card b{font-size:18px;font-weight:700}
.card p{font-size:15px;color:var(--muted)}
.btn{font:700 14px var(--body);padding:9px 18px;border-radius:999px;border:1.5px solid var(--navy);background:transparent;color:var(--navy);cursor:pointer;text-decoration:none;display:inline-block;justify-self:start}
.btn.solid{background:var(--brand);border-color:var(--brand);color:#fff}
.status{font-size:13px;color:var(--good);min-height:1em}

/* Article reader */
.dochero{background:var(--brand);color:#fff;padding-block:28px 36px}
.dochero .back{color:#d2e2ff}
.dochero .crumb{color:var(--yellow)}
.dochero h1{font-size:clamp(30px,4.6vw,46px);font-weight:800;margin-top:8px;max-width:22ch}
.dochero .docmeta{color:#d2e2ff;margin-top:12px}
.dochero .chip.k{background:rgba(255,255,255,.16);color:#fff}
.dochero .chip.g,.dochero .chip.m{background:#fff}
.dochero .lede{color:#e6eeff;margin-top:12px}
.reader{display:grid;grid-template-columns:minmax(0,1fr) 270px;gap:44px;padding-block:32px 72px;align-items:start}
.back{font-size:14px;font-weight:700;text-decoration:none;display:inline-flex;gap:6px;align-items:center}
article.doc{display:grid;gap:20px;min-width:0}
.docmeta{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:14px}
.lede{font-size:19px;max-width:64ch}
.body{display:grid;gap:14px;max-width:74ch;overflow-wrap:anywhere}
article.doc,.lede,aside.rail,.pbody,.card{overflow-wrap:anywhere}
.body h3{font-size:23px;font-weight:800;margin-top:16px}
.body ol.steps{list-style:none;margin:0;padding:0;display:grid;gap:10px;counter-reset:st}
.body ol.steps li{position:relative;padding:13px 16px 13px 56px;background:var(--surface);border:1px solid var(--line);border-radius:14px;counter-increment:st}
.body ol.steps li::before{content:counter(st);position:absolute;left:14px;top:11px;width:28px;height:28px;border-radius:50%;background:var(--brand);color:#fff;display:grid;place-items:center;font:800 14px var(--display)}
.body ul{margin:0;padding-left:22px;display:grid;gap:6px}
.callout{background:var(--warn-soft);border-left:4px solid var(--yellow);border-radius:12px;padding:12px 16px;font-size:15.5px}
.callout b{color:var(--warn)}
.codebox{position:relative;background:var(--sunk);border:1px solid var(--line);border-radius:12px}
.codebox pre{margin:0;padding:14px 16px;padding-right:90px;font:500 13.5px/1.6 var(--mono);white-space:pre-wrap;word-break:break-all;overflow-x:auto}
.codebox button{position:absolute;top:8px;right:8px}
.media{display:grid;grid-template-columns:200px minmax(0,1fr);gap:0;background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:var(--shadow)}
.media .poster{background:linear-gradient(135deg,#004dcd,#001643);display:grid;place-items:center;min-height:140px;position:relative;text-decoration:none}
.media .poster .play{width:62px;height:62px;border-radius:50%;background:var(--yellow);display:grid;place-items:center;box-shadow:0 0 0 10px rgba(243,221,74,.22);transition:transform .15s}
.media .poster:hover .play{transform:scale(1.07)}
.media .poster .play svg{width:22px;height:22px;fill:#001643;margin-left:4px}
.media .mtext{padding:18px 20px;display:grid;gap:8px;align-content:center}
.media .mtext b{font-size:18px;font-weight:800}
.media .mtext p{color:var(--muted);font-size:15px}
.media .mlinks{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px}
.shots{display:flex;gap:12px;align-items:center;background:var(--sunk);border-radius:14px;padding:12px 16px;font-size:15px}
.shots svg{width:22px;height:22px;flex:none;stroke:var(--navy);fill:none;stroke-width:2}
.orig{font-size:14px;color:var(--muted);border-top:1px solid var(--line);padding-top:14px;display:grid;gap:4px}
aside.rail{position:sticky;top:calc(env(safe-area-inset-top,0px) + 90px);display:grid;gap:18px}
aside.rail h4{font-size:12.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700;margin-bottom:6px}
aside.rail a{display:block;text-decoration:none;font-size:15px;padding:5px 0}
aside.rail a.btn{display:inline-block;padding:9px 18px}
aside.rail a.cur{font-weight:800;color:var(--ink)}
.pn{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.pn a{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 16px;text-decoration:none;color:var(--ink);font-weight:700;font-size:15px}
.pn a small{display:block;color:var(--muted);font-weight:500;font-size:12px}
.pn a.next{text-align:right;grid-column:2}

/* Campaign planner */
.wiz{display:grid;gap:22px;padding-block:28px 72px;max-width:880px}
.wiz h1{font-size:clamp(30px,4.6vw,46px);font-weight:800}
.qbox{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:20px 22px;display:grid;gap:12px;box-shadow:var(--shadow)}
.qbox h3{font-size:18px;font-weight:700}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{font:700 15px var(--body);padding:11px 18px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;text-align:left}
.opt small{display:block;font-weight:500;color:var(--muted);font-size:13px}
.opt[aria-pressed="true"]{border-color:var(--brand);background:var(--accent-soft);box-shadow:inset 0 0 0 1px var(--brand)}
.plan{display:grid;gap:12px}
.plan .progress{display:flex;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:10px 18px;font-size:15px}
.bar{flex:1;height:8px;border-radius:99px;background:var(--sunk);overflow:hidden}
.bar i{display:block;height:100%;background:var(--brand);width:0;transition:width .3s}
.phase{font-size:21px;font-weight:800;margin-top:12px}
.pstep{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.pstep.done{border-color:var(--good)}
.prow{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:14px;align-items:center;padding:14px 18px}
.check{width:28px;height:28px;border-radius:50%;border:2px solid var(--line);background:var(--surface);cursor:pointer;display:grid;place-items:center;color:transparent;font-weight:800;padding:0}
.pstep.done .check{background:var(--good);border-color:var(--good);color:#fff}
.prow b{display:block;font-size:16px}
.prow span{font-size:14px;color:var(--muted)}
.pstep.done .prow b{text-decoration:line-through;text-decoration-color:var(--muted)}
.expand{font:700 14px var(--body);background:transparent;border:0;color:var(--navy);cursor:pointer;white-space:nowrap}
.pbody{border-top:1px solid var(--line);padding:16px 18px 18px;background:var(--bg);display:grid;gap:14px}
.tag{font-size:11px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--yellow-ink);background:var(--yellow);padding:2px 8px;border-radius:999px;margin-left:8px;vertical-align:2px}

footer{background:var(--brand-deep);color:#c8d6f5;padding-block:28px 44px;font-size:14px}
footer a{color:#fff}
footer .wrap{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:center;justify-content:space-between}
footer .logo{height:26px;width:auto}

@media (max-width:900px){
  .reader{grid-template-columns:1fr}
  aside.rail{position:static}
}
@media (max-width:820px){
  .main{grid-template-columns:1fr;gap:20px}
  nav.side{position:static;display:flex;overflow-x:auto;gap:6px;padding-bottom:4px}
  nav.side a{white-space:nowrap;background:var(--surface);border:1px solid var(--line)}
}
@media (max-width:560px){
  .top{position:static}
  .art{grid-template-columns:1fr}
  .art .meta{grid-row:auto;grid-column:1;justify-content:flex-start;max-width:none}
  .plat{width:100%}
  .plat button{flex:1}
  .brand span{display:none}
  .wizcta{grid-template-columns:1fr}
  .wizcta a{justify-self:start}
  .media{grid-template-columns:1fr}
  .prow{grid-template-columns:auto minmax(0,1fr)}
  .prow .expand{grid-column:2;justify-self:start;padding:0}
  .pn{grid-template-columns:1fr}
  .pn a.next{grid-column:1}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

nd encourage your team."},{"s":"fix","id":"x1","t":"Something is not working","b":"Pick the symptom that matches what you see."},{"s":"fix","id":"x2","t":"Basic checks and diagnostics","b":"Quick fixes to try first, and what support may ask for."},{"s":"updates","id":"u1","t":"Release notes","b":"Newest first."},{"s":"support","id":"p1","t":"Contact support","b":""}],"arts":[{"id":"setup-checklist-google","g":"start","t":"Google setup checklist","sum":"Follow the nine step checklist to integrate CyberNut with Google Workspace, from SSO and Direct Mail Injection through add-on rollout.","p":"google","k":"setup","a":"it-admin","m":5,"u":"2026-09-25","src":["integration-checklist-google"],"orig":["https://knowledgebase.cybernut.com/cybernut-knowledge-base/integration-checklist-google"],"v":[],"sh":0,"b":[{"t":"p","x":"Start by scheduling a meeting with an Implementation Engineer, who will guide you through the rest of the process."},{"t":"h","x":"Part 1"},{"t":"note","x":"If you already held a technical integration meeting to set up the free Baseline Campaign, skip to Part 2."},{"t":"steps","items":["Configure Single Sign On so technical admins can sign in to the CyberNut Admin Portal. See Configuring Single Sign On with Google Workspace.","Turn on Direct Mail Injection and Directory Sync for Google so phishing emails get delivered. See Enabling Direct Mail Injection and Directory Sync for Google.","Create your CyberNut Admin Portal account at https://admin.cybernut.com/.","Build a Baseline Campaign in the Admin Portal. See Creating a Baseline Campaign.","Meet with a Cyber Security Advisor to review the Baseline Campaign results."]},{"t":"h","x":"Part 2"},{"t":"steps","items":["Deploy the CyberNut Add-on Reporting Tool to selected Google Groups or OUs. See Installing the CyberNut Add on Reporting Tool for Gmail.","Deploy the CyberNut Extension to selected Google Groups or OUs. See Deploying the CyberNut Chrome Extension for Gmail.","Allow CyberNut's URLs in your firewall and/or content filter. See What are the API Protocols that CyberNut uses?","Meet with a Customer Success advisor to learn the next steps."]},{"t":"note","x":"Before you schedule campaigns for all users, confirm the right users have the add-on installed. Do this before your CS Advisor meeting. To change which users receive the add-on, follow the linked directions."}],"l":[{"text":"Schedule a meeting with an Implementation Engineer","url":"https://meetings.hubspot.com/jp-hale/jp-full-integration?uuid=4f21f0fc-9320-46cb-bc83-046fe291d7b9"},{"text":"Configuring Single Sign On with Google Workspace","to":"sso-google"},{"text":"Enabling Direct Mail Injection and Directory Sync for Google","to":"dmi-google"},{"text":"CyberNut Admin Portal","url":"https://admin.cybernut.com/"},{"text":"Creating a Baseline Campaign","to":"baseline-campaign"},{"text":"Installing the CyberNut Add on Reporting Tool for Gmail","to":"install-gmail-add-on"},{"text":"Deploying the CyberNut Chrome Extension for Gmail","to":"deploy-chrome-extension"},{"text":"What are the API Protocols that CyberNut uses?","to":"firewall-allowlist"},{"text":"directions to change which users receive the add-on","to":"gmail-add-on-groups"}],"video_only":false},{"id":"setup-checklist-microsoft","g":"start","t":"Microsoft setup checklist","sum":"Follow the ten step checklist to integrate CyberNut with Microsoft 365, from SSO and Direct Mail Injection through add-in rollout.","p":"microsoft","k":"setup","a":"it-admin","m":5,"u":"2026-05-11","src":["integration-checklist-microsoft"],"orig":["https://knowledgebase.cybernut.com/cybernut-knowledge-base/integration-checklist-microsoft"],"v":[],"sh":0,"b":[{"t":"h","x":"Part 1"},{"t":"note","x":"If you already had a technical integration meeting to set up the free Baseline Campaign, skip to Part 2."},{"t":"steps","items":["Configure Single Sign On so admins can sign in to the CyberNut Admin Portal. See Configuring Single Sign On for Microsoft.","Turn on Direct Mail Injection and Active Directory Sync for Microsoft so phishing emails get delivered. See Enabling Direct Mail Injection and Active Directory Sync for Microsoft.","Sign up for and set up your CyberNut Admin Portal account at https://admin.cybernut.com/.","Create a Baseline Campaign in the Admin Portal. Skip this if you already purchased a subscription. See Creating a Baseline Campaign.","Meet with a CyberSecurity advisor to review the Baseline Campaign results. Skip this if you already purchased a subscription. See Analyzing a Baseline Campaign."]},{"t":"h","x":"Part 2"},{"t":"steps","items":["Turn on Active Directory Sync in the Admin Portal. Users added to or removed from Microsoft groups will then receive or lose the matching campaigns. See Enabling Directory Sync for Microsoft.","Install the CyberNut Add on Reporting Tool for the specified groups. See Installing the Outlook Add-in for CyberNut.","Turn on the option to delete reported threats. See Enabling Reported Threats Delete for Microsoft.","Allow the required URLs through your firewall and/or content filter. See What are the API Protocols that CyberNut uses?","Meet with a Customer Success advisor to plan next steps."]},{"t":"note","x":"Confirm that all users have the add-on installed before you schedule campaigns for everyone. Do this at least 72 hours before your CS advisor meeting. To change who needs the add-on, follow the linked directions."}],"l":[{"text":"Schedule a meeting","url":"https://meetings.hubspot.com/jp-hale/jp-full-integration?uuid=4f21f0fc-9320-46cb-bc83-046fe291d7b9"},{"text":"Configuring Single Sign On for Microsoft","to":"sso-microsoft"},{"text":"Enabling Direct Mail Injection and Active Directory Sync for Microsoft","to":"dmi-microsoft"},{"text":"CyberNut Admin Portal","url":"https://admin.cybernut.com/"},{"text":"Creating a Baseline Campaign","to":"baseline-campaign"},{"text":"Analyzing a Baseline Campaign","to":"baseline-results"},{"text":"Enabling Directory Sync for Microsoft","to":"directory-sync-microsoft"},{"text":"Installing the Outlook Add-in for CyberNut","to":"install-outlook-add-in"},{"text":"Enabling Reported Threats Delete for Microsoft","to":"reported-threats-delete-microsoft"},{"text":"What are the API Protocols that CyberNut uses?","to":"firewall-allowlist"},{"text":"these directions","to":"outlook-add-in-users"}],"video_only":false},{"id":"google-groups","g":"s1","t":"Create Google Groups for CyberNut","sum":"Create a CyberNut SSO group and department groups in the Google Admin Console so campaigns can use department templates.","p":"google","k":"setup","a":"it-admin","m":5,"u":"2026-07-11","src":["how-to-create-google-groups-for-cybernut"],"orig":["https://knowledgebase.cybernut.com/cybernut-knowledge-base/how-to-create-google-groups-for-cybernut"],"v":[],"sh":6,"b":[{"t":"p","x":"Create at least one group named CyberNut and limit it to Technical Administrators and Team Captains. CyberNut uses this group for Single Sign-On."},{"t":"p","x":"Most users work through Gmail or Outlook and do not log in to CyberNut directly."},{"t":"p","x":"Phishing simulation campaigns can use general email templates for all departments, or department-specific templates for Administrators, Finance, HR, IT, Student Services, and Teachers."},{"t":"p","x":"To assign department-specific templates, create a Google Group for each department so it appears as an option when you set up a campaign."},{"t":"h","x":"Creating a Google Group"},{"t":"steps","items":["Sign in to the Google Admin Console at https://admin.google.com.","Go to Directory > Groups, then select Create Groups.","Name the group and click Next (for example, CyberNut_Administrators). These groups are for campus, department, or similar administrators, not CyberNut administrators.","Adjust the settings as needed, then click Create Group. The recommended settings are in the screenshots in the original article.","Click Add members.","Click Add members.","Add the group's members.","Repeat for your other groups."]},{"t":"note","x":"Name groups carefully so they are not confused with other groups in your domain. Suggested names are CyberNut_Admin, CyberNut_Fin, CyberNut_HR, CyberNut_IT, CyberNutSTSVC, and CyberNut_Teach. You can also use patterns such as CyberNut_Teach_\"Name of School\" or CN_Teach_\"Name of School\"."}],"l":[{"text":"admin.google.com","url":"https://admin.google.com"}],"video_only":false},{"id":"sso-google","g":"s1","t":"Set up admin single sign on (Google)","sum":"Set up a CyberNut group and a custom SAML app in Google Admin so Tech Admins can sign in to the Admin Portal with SSO.","p":"google","k":"setup","a":"it-admin","m":12,"u":"2026-09-22","src":["enable-single-sign-on-with-google-workspaces-0"],"orig":["https://knowledgebase.cybernut.com/cybernut-knowledge-base/enable-single-sign-on-with-google-workspaces-0"],"v":[{"url":"https://cybernut.storylane.io/share/otg428trkdzd","host":"Storylane"}],"sh":1,"b":[{"t":"h","x":"Part 1: Add a CyberNut Group"},{"t":"steps","items":["Create a Google directory group in the Google Admin Console.","Name the group CyberNut and set its group email to CyberNut. Add any admins who need dashboard access as Group Owners, then click Next.","Clear the External option and select only invited users. Click Create Group. You can make the group more restrictive if you prefer."]},{"t":"note","x":"If your Google groups sync from Active Directory or another service, create the group in that source first."},{"t":"h","x":"Part 2: Add a Custom SAML App"},{"t":"steps","items":["Go to Apps, then Web and mobile apps. Click Add app, then Add custom SAML app.","Enter CyberNut SSO as the name and description, then click Continue.","Download the metadata file and save it for later use in the CyberNut Admin Portal.","Click Continue to move to the next step.","Add the ACS URL https://cybernut-prod.us.auth0.com/login/callback?connection=slug_name. Replace slug_name with the slug found in CyberNut under Settings > General.","Add the Entity ID urn:auth0:cybernut-prod:slug_name. Replace slug_name with the slug found in CyberNut under Settings > General.","Change the Name ID format to EMAIL. Click Continue.","Click Add Mapping 3 times and map Primary email to emailaddress, First name to name, and Last name to surname. Then click Finish.","Click User access.","Search for the Cybernut group and select it. Set the service to ON, then click Save.","Go to https://admin.cybernut.com and click Settings in the bottom left corner.","Confirm that the slug matches the one used in the ACS URL and Entity ID.","Click the Users tab.","Click Choose file and upload the SSO .xml file you downloaded earlier. If the file contains duplicate certificates, remove the first one before uploading."]},{"t":"note","x":"At step 4, if the Google certificate has expired or will expire within two years, create a new one. Do not delete a certificate being used by other apps."},{"t":"code","x":"https://cybernut-prod.us.auth0.com/login/callback?connection=slug_name"},{"t":"code","x":"urn:auth0:cybernut-prod:slug_name"},{"t":"p","x":"Some setups use this alternate ACS URL instead. Your Implementation Engineer can confirm which one applies to you: https://cybernut-stack-m-adminsignin.auth.us-east-1.amazoncognito.com/saml2/idpresponse"}],"l":[{"text":"admin.cybernut.com","url":"https://admin.cybernut.com"}],"video_only":false},{"id":"microsoft-groups","g":"s1","t":"Create Microsoft groups for CyberNut","sum":"Create a CyberNut SSO group and department groups in the Microsoft 365 admin center so campaigns can use department templates.","p":"microsoft","k":"setup","a":"it-admin","m":5,"u":"2026-07-11","src":["how-to-create-microsoft-groups-for-cybernut"],"orig":["https://knowledgebase.cybernut.com/cybernut-knowledge-base/how-to-create-microsoft-groups-for-cybernut"],"v":[],"sh":1,"b":[{"t":"p","x":"Keep at least one group named CyberNut, limited to Technical Administrators and Team Captains. Single Sign On to CyberNut uses this group."},{"t":"p","x":"Most users work through Gmail or Outlook and do not sign in to CyberNut directly."},{"t":"p","x":"Phishing simulation campaigns can use general emails for all departments, or emails for Teachers, Administrators, Finance, HR, IT, and Student Services."},{"t":"p","x":"To assign department specific templates, create a Microsoft Group for each department. You select these groups when you build the campaign."},{"t":"h","x":"Creating a Microsoft Group"},{"t":"steps","items":["Sign in to the Microsoft 365 Admin Center at https://admin.cloud.microsoft/.","Select Team & groups, then Active teams & groups.","Select Add a Microsoft 365 group.","Name the group and click Next (for example, CyberNut_Teachers).","Click Assign owners, add the owners, and click Next.","Click Add members, add the members, and click Next.","Enter an email address, choose the options you need, click Next, then click Create Group.","Repeat for your remaining groups."]},{"t":"note","x":"Name groups carefully so they are not confused with other groups. Suggested names are CyberNut_Admin, CyberNut_Fin, CyberNut_HR, CyberNut_IT, CyberNutSTSVC, and CyberNut_Teach. Alternatives include CyberNut_Teach_\"Name of School\" or CN_Teach_\"Name of School\"."}],"l":[{"text":"Microsoft 365 Admin Center","url":"https://admin.cloud.microsoft/"}],"video_only":false},{"id":"sso-microsoft","g":"s1","t":"Set up admin single sign on (Microsoft)","sum":"Create a CyberNut SSO enterprise app with SAML in Entra ID and send the Federation Metadata XML to your Implementation Engineer.","p":"microsoft","k":"setup","a":"it-admin","m":12,"u":"2026-06-18","src":["configure-sso-microsoft-0"],"orig":["https://knowledgebase.cybernut.com/cybernut-knowledge-base/configure-sso-microsoft-0"],"v":[{"url":"https://cybernut.storylane.io/share/rzzpykoviv1k","host":"Storylane"}],"sh":1,"b":[{"t":"h","x":"Overview"},{"t":"steps","items":["Sign in to the Microsoft Azure Portal at https://portal.azure.com with a Super Admin account, then select View under Manage Microsoft Entra ID.","Select Enterprise applications.","Select New application.","Select Create your own application.","Name the application CyberNut SSO and select Create.","Select Assign users and groups.","Select None Selected under Users.","Select the CyberNut Admins group, or the alternate group your district uses for administrative dashboard access. Choose the users who need Admin Portal access and select Assign. Those users can create, schedule, or view campaign results based on their role permissions, which can be changed later in the CyberNut admin dashboard.","After assigning users, select Single sign-on.","Choose SAML.","Select Edit on the Basic SAML Configuration tile.","Add the Identifier and Reply URL below, then select Save and close the panel with the red X in the top right corner. Replace slug_name with your school's name exactly as it is entered in CyberNut.","Select Edit next to Attributes & Claims.","Open each additional claim one at a time, remove the namespace, and select Save. Do this for emailaddress, givenname, name, and surname. When finished, the additional claims should list emailaddress, givenname, name and surname without the namespace.","Download the Federation Metadata XML and send it to your Implementation Engineer for upload."]},{"t":"p","x":"Identifier (Entity ID):"},{"t":"code","x":"urn:auth0:cybernut-prod:slug_name"},{"t":"p","x":"Reply URL:"},{"t":"code","x":"https://cybernut-prod.us.auth0.com/login/callback?connection=slug_name"}],"l":[{"text":"Microsoft Azure Portal","url":"https://portal.azure.com"}],"video_only":false},{"id":"dmi-google","g":"s2","t":"Connect Google: Direct Mail Injection and Directory Sync","sum":"Connect a Google Cloud project, service account and domain wide delegation scopes to CyberNut to enable Direct Mail Injection and Directory Sync.","p":"google","k":"setup","a":"it-admin","m":25,"u":"2026-10-02","src":["enable-direct-mail-injection"],"orig":["https://knowledgebase.cybernut.com/cybernut-knowledge-base/enable-direct-mail-injection"],"v":[{"url":"https://cybernut.storylane.io/share/0qq1sgazmcd7","host":"Storylane"}],"sh":1,"b":[{"t":"h","x":"Part 1: Google Cloud Console"},{"t":"steps","items":["Sign in to the Google Cloud Console at console.cloud.google.com and open the Project menu in the top bar.","Select New Project to create a separate space for the CyberNut integration.","Name the project CyberNut.","Select Create.","Choose the new CyberNut project from your project list.","Search the top bar for APIs & Services.","Open APIs & Services from the search results.","Select +Enable APIs and Services.","Search for and select the Gmail API, which lets CyberNut connect to Gmail.","Select Enable to turn on the Gmail API.","Search for and select Cloud Identity.","Select Enable.","Search for Admin SDK API and select Enable.","Select Enabled APIs and services.","In the left sidebar, open OAuth consent screen to set application permissions.","Complete the form and select Create. App Name is CyberNut. User Support Email is your email from the dropdown. Audience is External. Developer Contact Information is support@cybernut.com.","Open the hamburger menu (three horizontal lines) in the top left corner.","Hover over APIs & Services, then select Credentials.","Select +Create credentials.","Choose OAuth client ID.","Complete the OAuth Client ID form and select Create. Application Type is Web Application. Name is CyberNut Admin. Authorized redirect URLs is https://accounts.google.com/o/oauth2/v2/auth.","Select OK to confirm the client credentials were created.","Select +Create credentials again.","Choose Service Account.","Complete the Service Account details and select Done. Service Account Name is CyberNut. Service Account ID is cybernut. Service Account Description is Service Account for CyberNut Administration.","On the Service Accounts page, open the link for the service account you just created.","Open the Keys tab.","Select Add key, then Create new key.","Select Create to generate the key. A JSON file downloads automatically. Keep it safe because you will need it later.","Open the Details tab.","Select Advanced settings.","Find and copy the Client ID for use in the Google Admin Console.","Sign in to the Google Admin Console at admin.google.com and select Security in the left navigation.","Select Access and data control, then API controls.","Select Domain wide delegation.","Select Add new.","Paste the Client ID you copied earlier.","Add the 11 scopes below as one comma separated list.","Select Authorize."]},{"t":"note","x":"Do not open the downloaded .json key file, or it may become corrupted."},{"t":"code","x":"https://www.googleapis.com/auth/admin.reports.audit.readonly,https://www.googleapis.com/auth/admin.directory.group.readonly,https://www.googleapis.com/auth/admin.directory.group.member.readonly,https://www.googleapis.com/auth/admin.directory.user.readonly,https://www.googleapis.com/auth/gmail.insert,https://www.googleapis.com/auth/gmail.readonly,https://www.googleapis.com/auth/gmail.modify,https://mail.google.com/,https://www.googleapis.com/auth/admin.directory.user,https://www.googleapis.com/auth/admin.directory.user.security,https://www.googleapis.com/auth/cloud-identity.groups.readonly"},{"t":"h","x":"Part 2: CyberNut Admin Portal"},{"t":"steps","items":["Sign in to the CyberNut Admin Portal at admin.cybernut.com and select Settings in the main navigation.","Open the Integrations tab.","Select Upload JSON key instead and upload the JSON file from your Google Cloud project. This fills in the Service account email and Service account private key fields.","Enter the email you used in the Google Cloud Console in the Google Workspace admin email field.","Open the General tab to review settings.","Select Direct Mail Injection to choose how emails are delivered.","Select the time zone.","Select Save to lock in the settings."]}],"l":[{"text":"Google Cloud Console","url":"https://console.cloud.google.com"},{"text":"Google Admin Console","url":"https://admin.google.com"},{"text":"CyberNut Admin Portal","url":"https://admin.cybernut.com"},{"text":"support@cybernut.com","url":"mailto:support@cybernut.com"}],"video_only":false},{"id":"directory-sync-google","g":"s2","t":"Turn on Directory Sync (Google)","sum":"Add the admin.reports.audit.readonly scope and turn on Enable Directory Sync so Google Group changes flow into active campaigns.","p":"google","k":"setup","a":"it-admin","m":5,"u":"2026-01-28","src":["directory-sync-google1"],"orig":["https://knowledgebase.cybernut.com/cybernut-knowledge-base/directory-sync-google1"],"v":[{"url":"https://cybernut.storylane.io/share/rqocvekpc0fj","host":"Storylane"}],"sh":1,"b":[{"t":"h","x":"Part 1: Update Domain Wide Delegation Scopes"},{"t":"steps","items":["Sign in to the Google Admin Console at https://admin.google.com.","Go to Security > Access and data control > API controls, then select Manage Domain Wide Delegation.","Select Edit on the row that lists CyberNut.","Scroll down, enter the OAuth scope below, select Authorize, then select Confirm."]},{"t":"code","x":"https://www.googleapis.com/auth/admin.reports.audit.readonly"},{"t":"h","x":"Part 2: Enable Directory Sync in CyberNut Admin Portal"},{"t":"steps","items":["Sign in to the CyberNut Admin Portal at https://admin.cybernut.com.","Select Settings in the bottom left corner.","Select Users, scroll down, and switch on Enable Directory Sync."]},{"t":"note","x":"After you update the OAuth scope, it can take up to 24 hours before you can enable this feature."}],"l":[{"text":"admin.google.com","url":"https://admin.google.com/"},{"text":"admin.cybernut.com","url":"https://admin.cybernut.com/"}],"video_only":false},{"id":"google-scopes","g":"s2","t":"Check your Google scopes","sum":"Review and update the Domain Wide Delegation scopes on the CyberNut project in the Google Admin Console.","p":"google","k":"setup","a":"it-admin","m":5,"u":"2026-09-16","src":["updatescopes-google"],"orig":["https://knowledgebase.cybernut.com/cybernut-knowledge-base/updatescopes-google"],"v":[{"url":"https://cybernut.storylane.io/share/0mw6qq3syeil","host":"Storylane"}],"sh":8,"b":[{"t":"steps","items":["Sign in to the Google Admin Console at https://admin.google.com and select Security in the navigation bar.","Click Access and Data Control.","Click API Controls.","At the bottom of the screen, click Manage Domain Wide Delegation.","Find the CyberNut project and confirm it has all 11 scopes assigned. If it has fewer, add the missing ones. Click View Details to review the current scopes.","All currently added scopes appear on this screen.","Compare the existing scopes with the required list below. If any are missing, click Edit and add them.","Click Confirm."]},{"t":"note","x":"It may be easier to delete all existing scopes and paste in the full comma separated list."},{"t":"code","x":"https://www.googleapis.com/auth/admin.reports.audit.readonly, https://www.googleapis.com/auth/admin.directory.group.readonly, https://www.googleapis.com/auth/admin.directory.group.member.readonly, https://www.googleapis.com/auth/admin.directory.user.readonly, https://www.googleapis.com/auth/gmail.insert, https://www.googleapis.com/auth/gmail.readonly, https://www.googleapis.com/auth/gmail.modify, https://mail.google.com/, https://www.googleapis.com/auth/admin.directory.user, https://www.googleapis.com/auth/admin.directory.user.security, https://www.googleapis.com/auth/cloud-identity.groups.readonly"}],"l":[{"text":"https://admin.google.com","url":"https://admin.google.com"}],"video_only":false},{"id":"update-google-integration","g":"s2","t":"Replace your Google integration keys","sum":"Replace the service account key, client ID and scopes for an existing Google integration and confirm Direct Mail Injection and Directory Sync are on.","p":"google","k":"setup","a":"it-admin","m":15,"u":"2026-09-21","src":["update-directory-sync"],"orig":["https://knowledgebase.cybernut.com/cybernut-knowledge-base/update-directory-sync"],"v":[],"sh":1,"b":[{"t":"h","x":"Part 1: Google Cloud Console"},{"t":"steps","items":["Sign in to https://console.cloud.google.com/ with a Super Admin Account.","Open the project selector and choose CyberNut.","From the top left menu, go to APIs & Services > Credentials.","Select the blue link under the Service Accounts section.","Warning: if an existing key is listed, delete it before creating a new one.","Select Keys, then Add Key > Create New Key.","Choose JSON, then click Create. A JSON file with the required keys downloads to your computer. These keys connect the CyberNut Admin Portal to your Google Cloud Console account.","Open Details, then Advanced settings. Click the copy icon beside Client ID. Then open the Google Admin Console with the View Google Workspace Admin Console button under it."]},{"t":"h","x":"Part 2: Google Admin Console"},{"t":"steps","items":["Sign in to the Google Admin Console at https://admin.google.com/ and go to Security > Access and data control > API controls.","Open Manage Domain Wide Delegation. If an existing CyberNut client is listed, delete it.","Click Add New.","Paste the Client ID you copied in Part 1, step 8.","Paste the scopes listed below into the OAuth Scopes field, click Authorize, then click Confirm."]},{"t":"p","x":"Domain Wide Delegation Scopes:"},{"t":"code","x":"https://www.googleapis.com/auth/gmail.readonly,https://www.googleapis.com/auth/gmail.modify,https://mail.google.com/,https://www.googleapis.com/auth/admin.reports.audit.readonly,https://www.googleapis.com/auth/admin.directory.group.readonly,https://www.googleapis.com/auth/admin.directory.group.member.readonly,https://www.googleapis.com/auth/admin.directory.user.readonly,https://www.googleapis.com/auth/gmail.insert,https://www.googleapis.com/auth/admin.directory.user,https://www.googleapis.com/auth/admin.directory.user.security,https://www.googleapis.com/auth/cloud-identity.groups.readonly"},{"t":"h","x":"Part 3: CyberNut Admin Portal"},{"t":"steps","items":["Sign in to the CyberNut Admin Portal at https://admin.cybernut.com/.","Click Settings in the bottom left corner, then open the General tab. Confirm that Email Delivery Method is set to Direct Mail Injection. Scroll down and click Save.","Click the Integrations tab at the top. The required fields should appear.","Select Upload JSON key instead and upload the JSON file. This fills in the Service account email and Service account private key fields.","Enter your Google Workspace Admin Email. This is the address you used to create the CyberNut project in the Google Cloud Console.","Click Submit when finished."]},{"t":"note","x":"If Enable Directory Sync is off, slide it to the right to turn it on."}],"l":[{"text":"Google Cloud Console","url":"https://console.cloud.google.com/"},{"text":"admin.google.com","url":"https://admin.google.com/"},{"text":"admin.cybernut.com","url":"https://admin.cybernut.com/"}],"video_only":false},{"id":"dmi-microsoft","g":"s2","t":"Connect Microsoft: Direct Mail Injection and Directory Sync","sum":"Register a CyberNut Admin app in Entra with Graph and Exchange permissions and enter its IDs and secret in CyberNut Integrations.","p":"microsoft","k":"setup","a":"it-admin","m":15,"u":"2026-08-13","src":["enable-dmi-microsoft"],"orig":["https://knowledgebase.cybernut.com/cybernut-knowledge-base/enable-dmi-microsoft"],"v":[{"url":"https://cybernut.storylane.io/share/ppy7ibag40jc","host":"Storylane"}],"sh":1,"b":[{"t":"steps","items":["Sign in to Microsoft Entra at https://entra.microsoft.com with a Super Admin account.","Copy your Tenant ID and save it in a notepad file labeled Tenant ID. You will enter this value in the CyberNut Admin Portal later. Then select App Registrations in the left menu.","Select New registration, name it CyberNut Admin, and select Register at the bottom.","Copy the Application (Client) ID and save it. Label it Client ID for use in the portal.","Go to Manage, then Certificates & Secrets, and select New client secret. Name it CyberNut Admin and select Add. A two year expiry is recommended.","Open Certificates & secrets and copy the secret Value. Save it as Client Secret. The Secret ID is not needed.","Open API permissions and select Add a permission.","Choose Microsoft Graph, then Application Permissions. Search for and add the Microsoft Graph permissions listed below.","Add the Exchange permissions. Select Add a permission again, select APIs my organization uses, search for Office 365 Exchange Online, choose Application Permissions, enable full_access_as_app and Exchange.ManageAsApp under Exchange, then add the permissions.","Select Grant admin consent for CyberNut and confirm Yes in the pop up. Check that all permissions are added and granted.","Go to https://admin.cybernut.com.","After signing in, select Settings in the bottom left corner. Confirm Direct Mail Injection is selected, then select Save.","Open the Integrations tab. Enter the Application (Client) ID, the Client Secret value, and the Directory (Tenant) ID, then select Submit."]},{"t":"note","x":"Tip for step 8. Search for the first part of a permission name, then use the arrows to find the exact one. For example, search Group and select Group.Read.All."},{"t":"h","x":"Microsoft Graph application permissions"},{"t":"list","items":["Group.Read.All for Directory Sync","GroupMember.Read.All for Directory Sync","User.Read.All for Directory Sync","Mail.Send for Send Email","Mail.ReadWrite for Reported Threats Deletion and the CyberNut Reporting Tool","User-PasswordProfile.ReadWrite.All for Compromised Accounts","User.EnableDisableAccount.All for Compromised Accounts","User.RevokeSessions.All for Compromised Accounts"]},{"t":"h","x":"Office 365 Exchange Online application permissions"},{"t":"list","items":["Exchange.ManageAsApp for CyberNut Reported Threats Blocking","full_access_as_app for Direct Mail Injection"]}],"l":[{"text":"Microsoft Entra","url":"https://entra.microsoft.com"},{"text":"CyberNut Admin Portal","url":"https://admin.cybernut.com"}],"video_only":false},{"id":"microsoft-api-permissions","g":"s2","t":"Microsoft API permissions reference","sum":"Add and grant admin consent for the Microsoft Graph and Exchange Online permissions the CyberNut Admin app needs.","p":"microsoft","k":"setup","a":"it-admin","m":8,"u":"2026-08-13","src":["how-do-i-set-api-permissions-in-the-microsoft-azure-portal"],"orig":["https://knowledgebase.cybernut.com/cybernut-knowledge-base/how-do-i-set-api-permissions-in-the-microsoft-azure-portal"],"v":[{"url":"https://cybernut.storylane.io/share/57gmxizapvpj","host":"Storylane"}],"sh":9,"b":[{"t":"h","x":"Locate the CyberNut Admin App"},{"t":"steps","items":["Open the Microsoft Entra ID Portal.","Expand the Manage dropdown on the left side.","Click App registrations.","Click All applications and search for CyberNut Admin.","Select the application."]},{"t":"h","x":"Add Microsoft Graph Application Permissions"},{"t":"steps","items":["Open the API permissions section.","Click Add a permission, then select Microsoft Graph and Application permissions.","Search for and add each of the permissions listed below.","Click Add permissions.","Click Grant admin consent."]},{"t":"list","items":["Group.Read.All (Directory Sync)","GroupMember.Read.All (Directory Sync)","User.Read.All (Directory Sync)","Mail.Send (Send Email)","Mail.ReadWrite (Reported Threats Deletion and CyberNut Reporting Tool)","User-PasswordProfile.ReadWrite.All (Compromised Accounts)","User.EnableDisableAccount.All (Compromised Accounts)","User.RevokeSessions.All (Compromised Accounts)"]},{"t":"h","x":"Add Office 365 Exchange Online Application Permissions"},{"t":"steps","items":["Click Add a permission again and select APIs my organization uses at the top of the pop-up.","Search for Office 365 Exchange Online and select it.","Select Application permissions.","Under Other permissions, select full_access_as_app.","Under Exchange, select Exchange.ManageAsApp.","Click Add permissions, then click Grant admin consent again if needed."]},{"t":"note","x":"Make sure you click Grant admin consent. It is located near the Add a permission button. Every permission should show a status of Granted on the right side."}],"l":[{"text":"Microsoft Entra ID Portal","url":"https://portal.azure.com/#view/Microsoft_AAD_IAM/ActiveDirectoryMenuBlade/~/Overview"}],"video_only":false},{"id":"directory-sync-microsoft","g":"s2","t":"Turn on Directory Sync (Microsoft)","sum":"Add Group and Directory read permissions to the CyberNut Admin app in Entra and turn on Enable Directory Sync in CyberNut.","p":"microsoft","k":"setup","a":"it-admin","m":8,"u":"2026-01-29","src":["directory-sync-microsoft"],"orig":["https://knowledgebase.cybernut.com/cybernut-knowledge-base/directory-sync-microsoft"],"v":[{"url":"https://cybernut.storylane.io/share/tiajwqvherwj","host":"Storylane"}],"sh":1,"b":[{"t":"h","x":"Part 1: Check the Directory Sync permissions"},{"t":"p","x":"The CyberNut Admin app in Microsoft Entra needs Group.Read.All, GroupMember.Read.All and User.Read.All as Microsoft Graph application permissions, with admin consent granted. See the Microsoft API permissions reference for the steps."},{"t":"h","x":"Part 2: Enable Directory Sync in the CyberNut Admin Portal"},{"t":"steps","items":["Sign in to the CyberNut Admin Portal at https://admin.cybernut.com.","Select Settings in the bottom left corner.","Select Users, scroll down, and switch on Enable Directory Sync."]}],"l":[{"text":"Microsoft Azure portal","url":"https://portal.azure.com/"},{"text":"CyberNut Admin Portal","url":"https://admin.cyberrnut.com/"},{"text":"Microsoft API permissions reference","to":"microsoft-api-permissions"}],"video_only":false},{"id":"microsoft-client-secret","g":"s2","t":"Update the Microsoft client secret","sum":"Create a new CyberNut client secret in Azure and enter it with the Client ID and Tenant ID in the Admin Portal.","p":"microsoft","k":"how-to","a":"it-admin","m":6,"u":"2026-01-28","src":["update-client-secret-microsoft"],"orig":["https://knowledgebase.cybernut.com/cybernut-knowledge-base/update-client-secret-microsoft"],"v":[],"sh":10,"b":[{"t":"h","x":"Overview"},{"t":"steps","items":["Sign in to the Microsoft Azure Portal at https://portal.azure.com/ with a Super Admin account.","Copy your Tenant ID and save it in a text file labeled Tenant ID. Then select App Registrations in the left menu. You will enter this value in the CyberNut Admin Portal later.","Select View all applications in the directory, then find and select CyberNut Admin.","Copy the Application (Client) ID and save it the same way you saved the Tenant ID. You will enter this value in the CyberNut Admin Portal later.","Go to Manage and select Certificates & Secrets. Delete the old secret.","Select +New client secret.","Enter a description, set the expiration to at least 365 days, and select Add.","Copy the value of the new secret and save it. You will enter this value in the CyberNut Admin Portal later.","Go to https://admin.cybernut.com.","After signing in, select Settings in the bottom left corner. Confirm that Microsoft and Direct Mail Injection are selected, then select Save.","Select the Users tab and enter the Application (Client) ID, Client Secret, and Tenant ID in the CyberNut Admin Portal. Select Submit. Overwrite existing values if needed."]}],"l":[{"text":"Microsoft Azure Portal","url":"https://portal.azure.com/"},{"text":"CyberNut Admin Portal","url":"https://admin.cybernut.com"}],"video_only":false},{"id":"user-csv-google","g":"s2","t":"Prepare a user CSV from Google Directory","sum":"Export Google group members to Sheets and reformat names and group columns into a CyberNut user CSV.","p":"google","k":"how-to","a":"it-admin","m":8,"u":"2025-10-30","src":["preparing-a-csv-of-user-data-from-google-directory"],"orig":["https://knowledgebase.cybernut.com/cybernut-knowledge-base/preparing-a-csv-of-user-data-from-google-directory"],"v":[{"url":"https://cybernut.storylane.io/share/uru3sreiavoa","host":"Storylane"}],"sh":12,"b":[{"t":"h","x":"Overview"},{"t":"note","x":"If Direct Mail Injection is set up, you do not need this process."},{"t":"steps","items":["Sign in to the Google Admin Console at https://admin.google.com. Go to Directory > Groups, then select your group (for example, All Teachers).","Open the Members section.","Click Download Members.","Keep all columns selected, choose Google Sheets as the format, and click Download.","The export saves to a Google Sheet. Click Open in Google Sheets to view it.","Format the data to CyberNut's requirements. Select Column A and insert a column to its left.","Select Column B and insert a column to its right.","Select Column B and use Split text to columns so the first and last names land in Columns B and C.","Choose Space as the separator.","Rename the columns to the required format shown in the screenshot in the original article.","Set each user's Group name to either Staff or Student.","Go to File > Download > Comma Separated Values (.csv).","Save the file with a name of your choice (for example, CyberNut Users)."]}],"l":[{"text":"https://admin.google.com","url":"https://admin.google.com"}],"video_only":false},{"id":"user-csv-microsoft","g":"s2","t":"Prepare a user CSV from Microsoft Entra ID","sum":"Export group members from Microsoft Entra ID and format a CSV with group, first name, last name, and email for CyberNut.","p":"microsoft","k":"how-to","a":"it-admin","m":6,"u":"2025-10-30","src":["preparing-a-csv-of-user-data-from-microsoft-azure-active-directory"],"orig":["https://knowledgebase.cybernut.com/cybernut-knowledge-base/preparing-a-csv-of-user-data-from-microsoft-azure-active-directory"],"v":[{"url":"https://cybernut.storylane.io/share/rqtmbnui5kse","host":"Storylane"}],"sh":8,"b":[{"t":"h","x":"Overview of what you will learn"},{"t":"note","x":"If Direct Mail Injection is set up, this is not a necessary step."},{"t":"steps","items":["Sign in to the Azure portal and select View on the Microsoft Entra ID tile.","Open Groups, choose the group you want, and open its Members.","Select Bulk operations, then select Download members.","Name the file Cybernut campaign users and select Start download.","When the export is ready, select the download link.","Open the downloaded data in Google Sheets or Microsoft Excel.","Reorganize the columns so Column A is Group Name, Column B is First Name, Column C is Last Name, and Column D is User Email.","Set the Group name for each user to either Staff or Student.","Save the file as a CSV, for example CyberNut Users."]}],"l":[],"video_only":false},{"id":"gmail-allowlist","g":"s3","t":"Allowlist CyberNut in Gmail","sum":"Create a spam bypass rule for CyberNut and add the four simulation IP addresses so phishing simulations reach every inbox.","p":"google","k":"setup","a":"it-admin","m":8,"u":"2026-10-05","src":["google-allowlist-by-ip","google-allowlist-byip"],"orig":["https://knowledgebase.cybernut.com/cybernut-knowledge-base/google-allowlist-by-ip","https://knowledgebase.cybernut.com/cybernut-knowledge-base/google-allowlist-byip"],"v":[{"url":"https://cybernut.storylane.io/share/yn0sibb65dvv","host":"Storylane"},{"url":"https://cybernut.storylane.io/share/qvllx5tm4g5b","host":"Storylane"}],"sh":21,"b":[{"t":"h","x":"Part 1: Create the CyberNut spam bypass rule"},{"t":"steps","items":["Sign in to the Google Admin Console at https://admin.google.com.","Open Apps, then Google Workspace, then Gmail.","Scroll to the Phishing, Spam Phishing, and Malware section.","Select Configure in the spam section.","Name the rule Cybernut Rule, then check the option to bypass spam filters for messages from senders or domains in selected lists.","Scroll down slightly and select Create or Edit list.","Select Add Address List.","Name the address list Cybernut Allow List.","Select Bulk Add Addresses.","Copy the values from the CyberNut Allowlist spreadsheet into the text box, then select Add.","Select Save.","Close the tab to return to the first tab, then select Use Existing List.","Choose Cybernut Allow List, then click X to close.","Check Bypass Spam Filters and Hide Warnings for messages from senders or domains in selected lists, then select Use Existing List.","Choose Cybernut Allow List, then click X to close.","Select Save."]},{"t":"note","x":"Changes can take up to 24 hours to take effect. Schedule email campaigns to start 24 hours after the changes are made."},{"t":"h","x":"Part 2: Allow the phishing simulation IP addresses"},{"t":"steps","items":["Sign in to the Google Admin Console at https://admin.google.com, then select Apps in the left side menu.","Select Gmail.","Select Spam, Phishing and Malware.","Select the pencil icon next to Email Allowlist.","Enter these IP addresses: 34.226.146.241, 98.88.227.183, 54.85.192.239, 52.4.20.219.","Select Save."]},{"t":"code","x":"34.226.146.241\n98.88.227.183\n54.85.192.239\n52.4.20.219"},{"t":"note","x":"Add these same IP addresses to any external allowlist tools you use to manage mail flow. If they are missing, phishing simulation emails may be blocked and will not reach your users."}],"l":[{"text":"https://admin.google.com","url":"https://admin.google.com"},{"text":"CyberNut Allowlist spreadsheet","url":"https://docs.google.com/spreadsheets/d/1-IP0NZ1zUmx4hehsbIh30oDCGXUxUbW_QrfTdMjAc2E/edit?pli=1&gid=0#gid=0"}],"video_only":false},{"id":"allowlist-google-drive","g":"s3","t":"Allowlist CyberNut in Google Drive and Docs","sum":"Allowlist the Gmail API and regional CyberNut endpoints under Drive and Docs URL importing settings so the add-on works.","p":"google","k":"setup","a":"it-admin","m":6,"u":"2026-09-24","src":["allowlist-google-drive"],"orig":["https://knowledgebase.cybernut.com/cybernut-knowledge-base/allowlist-google-drive"],"v":[{"url":"https://cybernut.storylane.io/share/2bsgmrvtnsak","host":"Storylane"}],"sh":7,"b":[{"t":"note","x":"This feature is available only on Education Standard and Education Plus plans. Most schools do not need it."},{"t":"p","x":"Overview: an admin opens the Apps settings in the Google Admin console, goes to Drive and Docs, and finds the URL import controls. They choose the restricted allowlist option, add seven CyberNut API endpoints by hand, and save."},{"t":"steps","items":["Sign in to the Google Admin Console at https://admin.google.com.","Click Apps in the Admin console menu.","Select Drive and Docs from the Apps menu.","Open Features and Applications.","Click Importing and fetching from URLs.","Select Allow importing and fetching only from the following URLs.","In the Enter item field, add each URL below, clicking Add after each one. Add the All Regions URL and the URLs for your region.","Click Save to apply the changes."]},{"t":"h","x":"All Regions"},{"t":"code","x":"https://gmail.googleapis.com/gmail/v1/users/me/messages?q=in:inbox"},{"t":"h","x":"North America"},{"t":"code","x":"https://44dgkpf1cb.execute-api.us-east-1.amazonaws.com/userregion\nhttps://k3g591je54.execute-api.us-east-1.amazonaws.com/getemail\nhttps://560ef3pt4j.execute-api.us-east-1.amazonaws.com/eventdispatcher\nhttps://44dgkpf1cb.execute-api.us-east-1.amazonaws.com/admindomainsgoogle\nhttps://560ef3pt4j.execute-api.us-east-1.amazonaws.com/microsoftaddinactivitynew\nhttps://44dgkpf1cb.execute-api.us-east-1.amazonaws.com/campaignversion"},{"t":"h","x":"Europe"},{"t":"code","x":"https://dej7cfclm9.execute-api.eu-central-1.amazonaws.com/getemail\nhttps://p3shdnpenc.execute-api.eu-central-1.amazonaws.com/eventdispatcher\nhttps://telmnzu55i.execute-api.eu-central-1.amazonaws.com/admindomainsgoogle\nhttps://telmnzu55i.execute-api.eu-central-1.amazonaws.com/campaignversion"},{"t":"h","x":"Asia"},{"t":"code","x":"https://b4nzi83qm2.execute-api.ap-southeast-1.amazonaws.com/getemail\nhttps://vahgicl5qh.execute-api.ap-southeast-1.amazonaws.com/eventdispatcher\nhttps://vsqdkxcc8d.execute-api.ap-southeast-1.amazonaws.com/admindomainsgoogle\nhttps://vsqdkxcc8d.execute-api.ap-southeast-1.amazonaws.com/campaignversion"}],"l":[{"text":"https://admin.google.com","url":"https://admin.google.com"}],"video_only":false},{"id":"allowlist-microsoft","g":"s3","t":"Allowlist CyberNut in Exchange and Defender","sum":"Allowlist CyberNut in Exchange mail flow rules and Microsoft Defender, then confirm the Email delivery method in the Admin Portal.","p":"microsoft","k":"setup","a":"it-admin","m":25,"u":"2026-08-06","src":["allowlist-in-microsoft-exchange"],"orig":["https://knowledgebase.cybernut.com/cybernut-knowledge-base/allowlist-in-microsoft-exchange"],"v":[{"url":"https://cybernut.storylane.io/share/gsacveafmg00","host":"Storylane"}],"sh":13,"b":[{"t":"h","x":"Overview"},{"t":"p","x":"CyberNut sends outbound mail from four dedicated IP addresses. Add these to any connection filtering or IP allow lists that apply."},{"t":"code","x":"34.226.146.241, 98.88.227.183, 54.85.192.239, 52.4.20.219"},{"t":"p","x":"The list of current CyberNut sending domains is kept in the CyberNut Allowlist worksheet."},{"t":"h","x":"Part 1: Mail Flow Rule Creation"},{"t":"p","x":"The first rule, CyberNut Bypass Junk, skips spam filtering. The second rule, CyberNut Bypass Clutter Spam, skips clutter and other spam mechanisms. After both rules are enabled, add all current CyberNut sending domains to the allow lists in Microsoft Defender."},{"t":"steps","items":["Sign in to the Exchange admin center at https://admin.exchange.microsoft.com/. Go to Mail flow, then Rules, and click Add a rule.","Name the rule CyberNut Bypass Clutter Spam.","Under Apply this rule if, choose The Sender, then IP address is in any of these ranges or exactly matches.","Enter the four CyberNut IP addresses, click Add, then click Save.","Under Do the following, choose Modify the message properties, then set the spam confidence level (SCL).","Keep the level set to Bypass spam filtering and click Save.","Click the plus icon to add another action.","Choose Modify the message properties, then set a message header.","Click Enter text for the header name and enter X-MS-Exchange-Organization-BypassClutter. Click Save.","Click Enter text for the value and type true in lowercase. Click Save.","Click Next, Next, Finish, then Done.","The rule is disabled by default. Click Disabled, then turn on the switch.","Once the rule is enabled, duplicate it and name the copy CyberNut Bypass Junk. Delete the SCL setting using the trash icon.","Change the header name to X-Forefront-Antispam-Report.","Click true, replace the value with SFV:SKI;CAT:NONE. And click Save.","Duplicate the rule using Make copy, then Duplicate.","Find that rule and enable it."]},{"t":"code","x":"X-MS-Exchange-Organization-BypassClutter = true"},{"t":"code","x":"X-Forefront-Antispam-Report = SFV:SKI;CAT:NONE;"},{"t":"note","x":"Changes can take up to 24 hours to take effect. Schedule email campaigns to start 24 hours after making changes."},{"t":"h","x":"Part 2: Microsoft Defender"},{"t":"steps","items":["Go to Microsoft Defender at https://security.microsoft.com/.","In the left menu, select Email & Collaboration, then Policies & Rules.","Click Threat Policies.","Under Rules, click Tenant Allow/Block Lists. On the Domains & Addresses tab, click + Add, then Allow.","Enter every domain from the worksheet. Only 20 domains can be added at once, so split the list into batches and repeat this step.","After all batches are added, you should have a complete list of allowed domains.","Return to Policies & Rules under Email & Collaboration in the left menu.","Click Advanced Delivery, open the Phishing Simulation tab, and click Edit.","Under Domain, enter each worksheet domain one at a time. There is no bulk option.","Under sending IP, add the four CyberNut IP addresses and click Save.","Go back to Threat Policies and click Anti-Spam.","Click the default Connection Filter Policy, then Edit Connection Filter Policy.","Click Edit connection filter policy, add the four CyberNut IP addresses, and make sure Turn on safe list is enabled."]},{"t":"h","x":"Part 3: Allowlisting"},{"t":"p","x":"In the CyberNut Admin Portal, confirm the email delivery method is Email and not Direct Mail Injection. Email sends messages over standard SMTP, so they pass through the recipient's normal mail flow, filtering and security policies. Direct Mail Injection places messages straight into the recipient's mail environment and bypasses normal routing. Use it only when specifically required."},{"t":"steps","items":["Go to the CyberNut Admin Portal at https://admin.cybernut.com.","Click Settings, then General.","Under Email Delivery Method, set the dropdown to Email.","Scroll down and click Save."]},{"t":"note","x":"Changes can take up to 24 hours to take effect. Schedule campaigns to start 24 hours after making changes."}],"l":[{"text":"CyberNut Allowlist (worksheet)","url":"https://docs.google.com/spreadsheets/d/1-IP0NZ1zUmx4hehsbIh30oDCGXUxUbW_QrfTdMjAc2E/edit?pli=1&gid=0#gid=0"},{"text":"Exchange admin center","url":"https://admin.exchange.microsoft.com/"},{"text":"Microsoft Defender","url":"https://security.microsoft.com/"},{"text":"CyberNut Admin Portal","url":"https://admin.cybernut.com"}],"video_only":false},{"id":"firewall-allowlist","g":"s3","t":"Firewall and content filter allowlist","sum":"See the HTTPS endpoints by region and Outlook add-on domains to allow through your firewall or content filter.","p":"both","k":"setup","a":"it-admin","m":4,"u":"2026-08-12","src":["api-protocols"],"orig":["https://knowledgebase.cybernut.com/cybernut-knowledge-base/api-protocols"],"v":[],"sh":0,"b":[{"t":"h","x":"Protocols"},{"t":"list","items":["Communication Protocol: HTTPS","API Design Pattern: REST","Authentication Protocol: JWT, API Keys, Encryption","Communication Format: JSON","Port: 443"]},{"t":"p","x":"The following URLs should be allowed in your firewall or content filter."},{"t":"h","x":"North America"},{"t":"p","x":"Training Platform URLs and APIs"},{"t":"code","x":"https://api.cybernut.com\nhttps://prod-us-east-1.cybernut.ai\nhttps://btrkv77qk8.execute-api.us-east-1.amazonaws.com\nhttps://k3g591je54.execute-api.us-east-1.amazonaws.com\nhttps://4j1tsysei4.execute-api.us-east-1.amazonaws.com\nhttps://zoiu444wug.execute-api.us-east-1.amazonaws.com"},{"t":"p","x":"CyberNut Reporting Tool APIs"},{"t":"code","x":"https://560ef3pt4j.execute-api.us-east-1.amazonaws.com\nhttps://44dgkpf1cb.execute-api.us-east-1.amazonaws.com\nhttps://cybernut-outlook-addon.vercel.app/manifest.xml (Outlook users only)\ncybernut-outlook-addon.vercel.app (Outlook users only)"},{"t":"h","x":"Europe"},{"t":"p","x":"Training Platform URLs and APIs"},{"t":"code","x":"https://api.cybernut.com\nhttps://nn0dg7yt88.execute-api.eu-central-1.amazonaws.com\nhttps://dej7cfclm9.execute-api.eu-central-1.amazonaws.com\nhttps://akg5b17a6f.execute-api.eu-central-1.amazonaws.com\nhttps://c13n7mbbdk.execute-api.eu-central-1.amazonaws.com"},{"t":"p","x":"CyberNut Reporting Tool APIs"},{"t":"code","x":"https://44dgkpf1cb.execute-api.us-east-1.amazonaws.com/userregion?domain=${toDomain}\nhttps://skzb4w2nje.execute-api.eu-central-1.amazonaws.com\nhttps://dej7cfclm9.execute-api.eu-central-1.amazonaws.com\nhttps://telmnzu55i.execute-api.eu-central-1.amazonaws.com"},{"t":"h","x":"Asia"},{"t":"p","x":"Training Platform URLs and APIs"},{"t":"code","x":"https://api.cybernut.com\nhttps://yydmnmibzh.execute-api.ap-southeast-1.amazonaws.com\nhttps://b4nzi83qm2.execute-api.ap-southeast-1.amazonaws.com\nhttps://wsbqkkcub9.execute-api.ap-southeast-1.amazonaws.com\nhttps://w0hsmvl2b9.execute-api.ap-southeast-1.amazonaws.com"},{"t":"p","x":"CyberNut Reporting Tool APIs"},{"t":"code","x":"https://44dgkpf1cb.execute-api.us-east-1.amazonaws.com/userregion?domain=${toDomain}\nhttps://rmlq7e7vh7.execute-api.ap-southeast-1.amazonaws.com\nhttps://b4nzi83qm2.execute-api.ap-southeast-1.amazonaws.com\nhttps://vsqdkxcc8d.execute-api.ap-southeast-1.amazonaws.com"}],"l":[],"video_only":false},{"id":"install-gmail-add-on","g":"s4","t":"Install the Gmail Reporting Tool (v2.4.4)","sum":"Install the CyberNut reporting add-on for Gmail from the Google Workspace Marketplace to everyone or to chosen groups and OUs.","p":"google","k":"setup","a":"it-admin","m":4,"u":"2026-08-18","src":["how-do-i-install-the-gmail-add-on-for-cybernut"],"orig":["https://knowledgebase.cybernut.com/cybernut-knowledge-base/how-do-i-install-the-gmail-add-on-for-cybernut"],"v":[{"url":"https://cybernut.storylane.io/share/djvpbijpvm19","host":"Storylane"}],"sh":4,"b":[{"t":"steps","items":["Sign in to the Google Admin Console at https://admin.google.com/.","Open the CyberNut Reporting Tool listing in the Google Workspace Marketplace at https://workspace.google.com/marketplace/app/cybernut_reporting_tool/809178081701.","Select Admin install.","Select Continue.","Scroll down, choose either Everyone at your organization or Certain groups or organization units, check the boxes, and select Next.","If needed, choose the groups or OUs that should receive the add-on, then select Finish."]},{"t":"note","x":"Make sure the app is set up as a Trusted App. See How do I set CyberNut as a Trusted App in Google?"}],"l":[{"text":"Google Admin Console","url":"https://admin.google.com/"},{"text":"CyberNut Reporting Tool in Google Workspace Marketplace","url":"https://workspace.google.com/marketplace/app/cybernut_reporting_tool/809178081701"},{"text":"How do I set CyberNut as a Trusted App in Google?","url":"https://knowledgebase.cybernut.com/cybernut-knowledge-base/trustedapp"}],"video_only":false},{"id":"upgrade-gmail-add-on","g":"s4","t":"Upgrade to the Gmail Reporting Tool (v2.4.4)","sum":"Remove the legacy Gmail add-on, its Cloud project, and Apps Script, then install Reporting Tool version 2.4.4.","p":"google","k":"setup","a":"it-admin","m":12,"u":"2026-08-18","src":["upgrade-gmail-addon-0"],"orig":["https://knowledgebase.cybernut.com/cybernut-knowledge-base/upgrade-gmail-addon-0"],"v":[{"url":"https://cybernut.storylane.io/share/oawtjn9csctu","host":"Storylane"},{"url":"https://cybernut.storylane.io/share/djvpbijpvm19","host":"Storylane"}],"sh":8,"b":[{"t":"h","x":"Part 1: Remove the Legacy App, Cloud Project, and Script"},{"t":"h","x":"Google Admin Console"},{"t":"p","x":"Sign in at https://admin.google.com/."},{"t":"steps","items":["Click Apps in the left sidebar.","Click Google Workspace Marketplace apps.","Click Apps List.","Click CyberNut Gmail Add on.","Click Uninstall App.","Click Uninstall."]},{"t":"h","x":"Google Cloud Console"},{"t":"steps","items":["Go to https://console.cloud.google.com/cloud-resource-manager. Use the account that originally created the project.","In the Actions column, click the three dots for the CyberNut Addon project (or CyberNut Gmail Addon). Do not delete the other CyberNut project.","Click Delete.","Paste the Project ID into the box and click Shut down anyway."]},{"t":"note","x":"Do not delete the other CyberNut project. Only shut down the CyberNut Addon (or CyberNut Gmail Addon) project."},{"t":"h","x":"Google Script"},{"t":"steps","items":["Go to https://script.google.com/home. Use the account that originally set up the script.","Click the three dots on the CyberNut Addon row.","Click Remove, then confirm with Remove again."]},{"t":"h","x":"Part 2: Install the CyberNut Reporting Tool for Gmail (v 2.4.4)"},{"t":"steps","items":["Open https://workspace.google.com/marketplace/app/cybernut_reporting_tool/809178081701.","Click Admin install. You must be signed in to a super admin account.","Click Continue.","Scroll down, select Certain groups or organization units, check the boxes, and click Next.","Select the groups and/or organizational units that should receive the add-on, then click Finish."]}],"l":[{"text":"https://admin.google.com/","url":"https://admin.google.com/"},{"text":"https://console.cloud.google.com/cloud-resource-manager","url":"https://console.cloud.google.com/cloud-resource-manager"},{"text":"https://script.google.com/home","url":"https://script.google.com/home"},{"text":"CyberNut Reporting Tool in Google Workspace Marketplace","url":"https://workspace.google.com/marketplace/app/cybernut_reporting_tool/809178081701"}],"video_only":false},{"id":"trust-gmail-add-on","g":"s4","t":"Mark the Gmail add-on as trusted","sum":"Mark every CyberNut add-on instance as Trusted under API controls in the Google Admin Console.","p":"google","k":"setup","a":"it-admin","m":4,"u":"2025-12-09","src":["verify-add-on"],"orig":["https://knowledgebase.cybernut.com/cybernut-knowledge-base/verify-add-on"],"v":[],"sh":5,"b":[{"t":"steps","items":["Sign in to the Google Admin Console at https://admin.google.com.","Go to Security > Access and data control > API controls, then select Configure new app.","Search for CyberNut.","Select the first instance of the add-on in the results.","Click Continue.","Choose Trusted, then click Continue.","Click Finish, then click Confirm.","Repeat the process for every other CyberNut Add-on instance listed."]}],"l":[{"text":"https://admin.google.com","url":"https://admin.google.com"}],"video_only":false},{"id":"gmail-add-on-groups","g":"s4","t":"Check which groups have the Gmail add-on","sum":"Open the CyberNut add-on in Google Admin Console and review or turn on App Distribution for specific groups.","p":"google","k":"how-to","a":"it-admin","m":3,"u":"2026-02-06","src":["how-do-i-check-the-groups-to-which-i-have-the-google-add-on-deployed"],"orig":["https://knowledgebase.cybernut.com/cybernut-knowledge-base/how-do-i-check-the-groups-to-which-i-have-the-google-add-on-deployed"],"v":[],"sh":6,"b":[{"t":"steps","items":["Sign in to the Google Admin Console at https://admin.google.com.","In the left sidebar, go to Apps > Google Workspace Marketplace Apps > Apps List.","Open the CyberNut Reporting Tool (or CyberNut Addon) app from the list.","Directly below the User Access section, click the blue link View organizational units and groups.","On the left, click the Groups search box (or Organizational Unit).","Search for the gro
