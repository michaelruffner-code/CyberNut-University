ps://knowledgebase.cybernut.com/cybernut-knowledge-base/threat-with-att"],"v":[{"url":"https://cybernut.storylane.io/share/qeqftvl8ebaz","host":"Storylane"}],"sh":8,"b":[{"t":"p","x":"Click below for a full screen walkthrough video."},{"t":"p","x":"The Automated Threat Terminator (ATT) is an optional add-on package for Reported Threats. It adds three capabilities."},{"t":"list","items":["Risk-Based Prioritization. Reported threats are sorted automatically by risk. Each one receives a phishing or legitimate verdict, a security threat score out of 100, and supporting evidence, so the most dangerous items are handled first.","Automated Remediation. A policy engine lets admins set up auto-quarantine for phishing and automatic spam handling, moving work from manual triage to automatic resolution.","ATT Recommended Actions. Based on the threat type and the red flags found, you receive a tailored list of actions covering immediate steps, awareness steps and suggested policy changes to strengthen defenses."]},{"t":"note","x":"Reported Threats 2.0 features are described in the separate article Reported Threats 2.0 without Automatic Threat Terminator (ATT). ATT was previously a standalone feature but is now built in."},{"t":"steps","items":["When ATT is enabled, each threat shows a score.","ATT assigns a verdict of Phishing, Spam or Legitimate.","Click a case to reveal the ATT Recommended Actions and Key Evidence features.","Click ATT Recommended Actions to see suggested handling for that threat.","Click Key Evidence to see why the email looks suspicious.","To manage ATT, click Auto-remediation Enabled.","Click to enable Auto-Remediation. The Auto-Action Rules then appear.","Enable each rule you want automated, then click Save at the bottom."]}],"l":[{"text":"Reported Threats 2.0 without Automatic Threat Terminator (ATT)","to":"reported-threats"}],"video_only":false},{"id":"auto-spam-labeling","g":"t1","t":"Turn on automatic spam labeling","sum":"Turn on Auto-label spam in Reported Threats 2.0 or Settings Threat Manager so spam reports are labeled automatically.","p":"both","k":"how-to","a":"portal-admin","m":2,"u":"2026-07-14","src":["how-do-you-enable-automatic-spam-labeling"],"orig":["https://knowledgebase.cybernut.com/cybernut-knowledge-base/how-do-you-enable-automatic-spam-labeling"],"v":[],"sh":2,"b":[{"t":"p","x":"Reported Threats 2.0 includes a feature that detects emails considered spam and labels them. To turn it on, follow these steps."},{"t":"steps","items":["Sign in to CyberNut at https://admin.cybernut.com.","Open Reported Threats 2.0.","Click Auto-remediation Disabled in the upper right corner.","Switch on Auto-label spam.","Click Save."]},{"t":"note","x":"You can also enable this under Settings and then Threat Manager by switching on the setting and saving."}],"l":[{"text":"https://admin.cybernut.com","url":"https://admin.cybernut.com"}],"video_only":false},{"id":"reported-threats-email-templates","g":"t1","t":"Customize Reported Threats email templates","sum":"Customize the notification emails users get when reported threats are marked safe, spam, deleted, or quarantined, using variables.","p":"both","k":"how-to","a":"portal-admin","m":4,"u":"2026-04-23","src":["reported-threats-email-variables-v2"],"orig":["https://knowledgebase.cybernut.com/cybernut-knowledge-base/reported-threats-email-variables-v2"],"v":[{"url":"https://cybernut.storylane.io/share/ogrilab6ivfl","host":"Storylane"}],"sh":2,"b":[{"t":"p","x":"When you manage Reported Threats, the system can automatically email end users after you mark a message as safe, spam, deleted or quarantined. You can edit these emails and add the variables shown in the Available Variables section."},{"t":"steps","items":["Sign in to the CyberNut Admin Portal at https://admin.cybernut.com.","Click Settings.","Open the Threat Manager tab.","Click View template next to one of the notifications, for example Notify users when emails are safe.","Edit the email as needed. The example uses the email subject and reported date variables.","When the email is finished, click Save."]},{"t":"h","x":"Available Variables"}],"l":[{"text":"https://admin.cybernut.com","url":"https://admin.cybernut.com"}],"video_only":false},{"id":"reported-email-trash","g":"t1","t":"Why reported emails move to trash","sum":"Learn that reported suspicious emails that are not CyberNut simulations now move to the trash automatically.","p":"both","k":"concept","a":"everyone","m":1,"u":"2025-11-03","src":["emails-automatically-moved-to-trash-after-reporting"],"orig":["https://knowledgebase.cybernut.com/cybernut-knowledge-base/emails-automatically-moved-to-trash-after-reporting"],"v":[],"sh":0,"b":[{"t":"p","x":"When a user reports a suspicious email that is not a CyberNut simulation, the email is moved straight to the trash. This helps keep inboxes cleaner and more secure."}],"l":[],"video_only":false},{"id":"advanced-threat-search","g":"t2","t":"Advanced Threat Search","sum":"Find every copy of a reported threat across your domain, see who received it, and quarantine or delete it. Google schools add one permission first.","p":"both","k":"how-to","a":"it-admin","m":8,"u":"2026-06-19","src":["advanced-threat-search-google","advanced-threat-search-tutorial-faq"],"orig":["https://knowledgebase.cybernut.com/cybernut-knowledge-base/advanced-threat-search-google","https://knowledgebase.cybernut.com/cybernut-knowledge-base/advanced-threat-search-tutorial-faq"],"v":[{"url":"https://cybernut.storylane.io/share/j1hnqjoly94n","host":"Storylane"},{"url":"https://cybernut.storylane.io/share/msawqli5vdli","host":"Storylane"}],"sh":3,"b":[{"t":"p","x":"Advanced Threat Search finds a reported threat across your domain, shows how far it has spread, and removes it."},{"t":"h","x":"Google schools: add the permission first"},{"t":"steps","items":["Log in to the Google Admin Console at https://admin.google.com.","Go to Security > Access and data control > API controls, then click Manage Domain Wide Delegation.","Click Edit on the row for CyberNut.","Scroll down and check whether the scope below is included. If it is not, copy and paste the OAuth scope and click Authorize and then Confirm."]},{"t":"code","x":"https://www.googleapis.com/auth/admin.reports.audit.readonly"},{"t":"note","x":"It can take up to 24 hours to use this feature after you update the OAuth scope."},{"t":"h","x":"Part 2: Conduct an Advanced Threat Search in the CyberNut Admin Portal"},{"t":"steps","items":["Log in to the CyberNut Admin Portal at https://admin.cybernut.com and select Advanced Threat Search.","Set your search timeframe to focus on recent threats and reduce noise from older activity.","Identify possible recipients of suspicious messages and assess your risk. Search by recipient, email subject or message ID to find specific emails and see how many users received them.","Run the threat search to find all matching emails and identify potential victims across the organization.","Review the suspicious email's contents, potential risks and number of recipients.","Check the full message details, including headers, sender authentication and threat indicators, to confirm it is malicious.","Click the email to take action and resolve the attack.","Choose an action to neutralize the threat and prevent further damage.","For example, you can permanently remove malicious emails from all inboxes so the threat cannot be reopened by accident.","Run the remediation to protect users and close the security incident quickly."]},{"t":"h","x":"Remediation Actions"},{"t":"list","items":["Quarantine: moves the email to the user's trash. It is auto-deleted after 30 days.","Quarantine All from Domain: moves all emails from that domain to user trash. They are auto-deleted after 30 days.","Quarantine All from Sender: moves all emails from that sender to user trash. They are auto-deleted after 30 days.","Delete this: permanently deletes the email from the user's inbox.","Delete All from Domain: permanently deletes all emails from that domain across all user inboxes.","Delete All from Sender: deletes all emails from that sender across all user inboxes."]},{"t":"h","x":"FAQs"},{"t":"h","x":"Permissions and configuration"},{"t":"h","x":"I get an error when opening Advanced Threat Search on Google Workspace."},{"t":"p","x":"Schools on Google Workspace must turn on specific permissions before they can use this feature. See https://knowledgebase.cybernut.com/cybernut-knowledge-base/advanced-threat-search-google for details."},{"t":"h","x":"How long does permission sync take?"},{"t":"p","x":"Permissions usually sync in under 15 minutes but can take up to 24 hours. If the feature is not available right after setup, wait up to 24 hours before trying again."},{"t":"h","x":"Are subdomains included when removing an email across a domain?"},{"t":"p","x":"No. Removal matches the exact domain only. Subdomains are not included when deleting by domain."},{"t":"h","x":"Search"},{"t":"h","x":"Which search fields are required?"},{"t":"p","x":"Only the timeframe is mandatory. You can pick a preset of 1, 3, 7, 14 or 30 days, which searches backward from today. You can also enter specific dates within the last 30 calendar days."},{"t":"h","x":"How do I search by recipient email?"},{"t":"p","x":"Enter the complete email address. Wildcards and other pattern matching are not supported at this time."},{"t":"h","x":"How does searching by subject work?"},{"t":"p","x":"Subject search matches the keywords you provide and ignores letter case."},{"t":"h","x":"What is searching by MessageID for?"},{"t":"p","x":"A MessageID is a unique identifier for one email. If one user reports a threat, use that message's MessageID to find every other recipient of the same email and remove it from all their inboxes."},{"t":"h","x":"Can I search by sender email?"},{"t":"p","x":"Yes. Since the October 10, 2026 release, schools on both Microsoft 365 and Google Workspace can search by sender. Enter the complete sender email address."},{"t":"h","x":"Why do results show one entry for an email sent to many people?"},{"t":"p","x":"Results are grouped by MessageID. An email sent to several people appears as a single result, so an admin can delete it from many inboxes at once."},{"t":"h","x":"What happens when I use multiple search fields?"},{"t":"p","x":"Each additional field narrows the results. An email must match every criterion to appear. If you get no results when you expect some, try removing a field."},{"t":"h","x":"Deletion and remediation"},{"t":"h","x":"Can I delete one email instead of a whole domain?"},{"t":"p","x":"Yes. You can target and remove a single specific email using a soft delete. Bulk deletion of everything from a domain is not the only option."},{"t":"h","x":"Do bulk deletes show a confirmation count?"},{"t":"p","x":"No. Bulk deletes do not show a count of deleted emails. They follow the same process as actions taken from the Reported Threats or ATT screens, and that process has no deletion count notice."},{"t":"h","x":"Are users notified after deletion?"},{"t":"p","x":"Only users who reported the email earlier. Reporters receive a feedback email and threat acorns. Users who did not report it are not notified."},{"t":"h","x":"What if a reporter also reported the deleted email?"},{"t":"p","x":"Reporters still receive a feedback email and threat acorns when an admin deletes through Advanced Threat Search. This matches what happens when deleting from the Reported Threats dashboard."}],"l":[{"text":"https://admin.google.com","url":"https://admin.google.com/"},{"text":"https://www.googleapis.com/auth/admin.reports.audit.readonly","url":"https://www.googleapis.com/auth/gmail.readonly,https://www.googleapis.com/auth/gmail.modify,https://mail.google.com/"},{"text":"https://admin.cybernut.com","url":"https://admin.cybernut.com/"}],"video_only":false},{"id":"threat-forwarding","g":"t3","t":"Email Threat Forwarding","sum":"Send a copy of every real threat staff report to an admin or your email security platform, and learn what changes when forwarding is on.","p":"both","k":"how-to","a":"it-admin","m":5,"u":"2026-04-29","src":["reported-email-forwarding","advanced-threat-search-tutorial-faq-0"],"orig":["https://knowledgebase.cybernut.com/cybernut-knowledge-base/reported-email-forwarding","https://knowledgebase.cybernut.com/cybernut-knowledge-base/advanced-threat-search-tutorial-faq-0"],"v":[],"sh":2,"b":[{"t":"p","x":"Email Threat Forwarding sends a copy of every threat reported with the blue squirrel to an address you choose, such as an admin or a third party email security platform."},{"t":"h","x":"Google Admins"},{"t":"p","x":"Google admins must contact support@cybernut.com to request this feature. Once the feature is active, follow the steps below."},{"t":"h","x":"Microsoft Admins"},{"t":"p","x":"Microsoft admins can follow the steps below."},{"t":"note","x":"Microsoft admins must confirm that API Permissions are set up first."},{"t":"h","x":"Update CyberNut Admin Settings"},{"t":"steps","items":["Log in to the CyberNut Admin Portal at https://admin.cybernut.com.","Click Settings in the lower left corner.","Click the Add on tab at the top of the page.","Add an admin or service account that should receive the emails."]},{"t":"h","x":"FAQs"},{"t":"h","x":"What is Email Threat Forwarding?"},{"t":"p","x":"It lets you set an email address that automatically receives a copy of every threat reported through the blue squirrel. IT admins can then pass those messages to other email security services for risk scanning and assessment."},{"t":"h","x":"Setup and compatibility"},{"t":"h","x":"Does this feature work on both Microsoft 365 and Google Workspace?"},{"t":"p","x":"Yes. Microsoft 365 has been supported for some time. Google Workspace support is new in this release."},{"t":"h","x":"Which services does this work with?"},{"t":"p","x":"Any email security platform that can receive a forwarded message in a monitored inbox and process it there."},{"t":"h","x":"What do I need before using this feature?"},{"t":"p","x":"An existing license and an active subscription with your email security platform, plus the inbox address that platform uses for forwarded threat reports. CyberNut does not supply or manage that address."},{"t":"h","x":"How do I set it up?"},{"t":"p","x":"Follow the instructions at https://knowledgebase.cybernut.com/cybernut-knowledge-base/reported-email-forwarding."},{"t":"h","x":"How do I know if forwarding is working correctly?"},{"t":"p","x":"After saving your configuration, report an email and check whether it arrives in your third party inbox. If it does, forwarding works."},{"t":"h","x":"How it works"},{"t":"h","x":"What happens when a user reports an email with threat forwarding enabled?"},{"t":"p","x":"CyberNut and your third party platform each receive a copy at the same time. The forwarded copy appears to come from the reporter's inbox address, so your platform can attribute and process the report correctly. CyberNut training simulation emails are excluded and are not forwarded."},{"t":"h","x":"Will reported emails still show up in CyberNut's Reported Threats tab?"},{"t":"p","x":"Yes. They stay in New status indefinitely because your platform handles investigation and remediation and CyberNut does not change their status. This is expected behavior, not a bug."},{"t":"h","x":"Will CyberNut receive updates or results back from my email security platform?"},{"t":"p","x":"No. CyberNut forwards the email but receives no status updates, analysis results or remediation outcomes. All investigation and resolution happens in your platform."},{"t":"h","x":"If my admin resolves a reported threat in the third party platform, what appears in the Reported Threats dashboard?"},{"t":"p","x":"Nothing changes. The report stays in New status whatever action is taken externally. CyberNut has no integration with outside platforms and gets no notice of their actions. A report leaves New status only when an admin updates it manually in CyberNut. If all investigation is handled externally, New items will build up over time. This is normal."},{"t":"h","x":"Will the Automated Threat Terminator (ATT) process reported threats for accounts using this feature?"},{"t":"p","x":"No. ATT is designed for accounts where CyberNut manages investigation and remediation. When reports are routed to a third party platform, ATT is not part of that workflow, since the two features serve different threat management approaches."},{"t":"h","x":"Will users get a notification that their report was reviewed and addressed?"},{"t":"p","x":"Not from CyberNut. Because CyberNut receives nothing back from the third party platform, it sends no close-loop notifications when forwarding is on. If your platform is set up to send them, they come from the platform directly."},{"t":"h","x":"Are CyberNut training simulation emails forwarded to my email security platform?"},{"t":"p","x":"No. Only real reported emails go to your configured third party inbox."},{"t":"h","x":"Acorns and user engagement"},{"t":"h","x":"Will users earn threat acorns when a reported email is confirmed as a real threat?"},{"t":"p","x":"No. Remediation happens in your third party platform and CyberNut receives no confirmation, so it cannot verify an outcome. Acorns are not awarded for threat reports while forwarding is enabled."},{"t":"h","x":"Training email deliverability"},{"t":"h","x":"Will enabling threat forwarding affect whether users receive CyberNut training emails?"},{"t":"p","x":"No. Forwarding applies only to emails users report with the CyberNut add-in and does not change how training emails are delivered. If your email security platform blocks or quarantines training emails, that is a separate allowlisting issue. Contact CyberNut support for help configuring the correct allowlist settings."}],"l":[{"text":"CyberNut Admin Portal","url":"https://admin.cybernut.com"},{"text":"API Permissions","to":"microsoft-api-permissions"},{"text":"support@cybernut.com","url":"mailto:support@cybernut.com"}],"video_only":false},{"id":"compromised-accounts","g":"t4","t":"Compromised accounts","sum":"Understand how CyberNut detects and suspends compromised accounts and how admins review evidence and reinstate users.","p":"both","k":"concept","a":"portal-admin","m":8,"u":"2026-09-22","src":["what-happens-if-we-have-a-compromised-account"],"orig":["https://knowledgebase.cybernut.com/cybernut-knowledge-base/what-happens-if-we-have-a-compromised-account"],"v":[{"url":"https://www.loom.com/share/bc87b131a2024bc4bd3fc0530820dd92","host":"Loom"}],"sh":1,"b":[{"t":"note","x":"Since the October 10, 2026 release, you can force a password reset right from a case when a reporter says they clicked a link or entered their password."},{"t":"p","x":"The Compromised Account feature is included in the standard partner license at no extra cost."},{"t":"h","x":"Details"},{"t":"list","items":["Account compromise detection. CyberNut flags a user account and alerts admins when several reported emails trace back to the same internal sender and are classified as phishing. This is meant to catch account takeovers within minutes.","Automatic suspension. The system suspends a user account as soon as it detects a possibly compromised account.","Auto-quarantine. Advanced Threat Search (ATS) quarantines matching emails across other inboxes, including ones nobody has reported yet."]},{"t":"h","x":"Frequently Asked Questions"},{"t":"h","x":"Is the compromised account flag based on the number of emails sent or the number of recipients?"},{"t":"p","x":"Neither. Detection requires all three of these conditions."},{"t":"steps","items":["The email was reported with the CyberNut Reporting Tool.","The reported email came from an internal sender.","The AI enabled threat manager (ATT) scanned the email and returned a phishing verdict at or above your threat score threshold. The threshold is set in Settings under Compromised Account Detection, runs from 0 to 100, and starts at 0, which flags every internal phishing verdict."]},{"t":"h","x":"What does an end user see if their account is auto-suspended?"},{"t":"p","x":"They cannot log in."},{"t":"h","x":"Is there a delay when an account is deactivated or reinstated?"},{"t":"p","x":"Deactivation is immediate once the score is computed and the email is confirmed as phishing. Reinstatement is a manual action by an IT admin, so the delay cannot be predicted."},{"t":"h","x":"Does the user go through a password reset when the account is reinstated?"},{"t":"p","x":"When an admin reinstates the account, the new password is shown to the IT admin, who can then give it to the user."},{"t":"h","x":"Working With Compromised Emails"},{"t":"steps","items":["Open the compromised email area, where compromised emails are listed.","Click an email to view its details.","Review the score, status, subject, reports, verdict, and last reported date.","Click the row to open further details for investigation.","If you entered an address under Settings > Add on to receive CyberNut Alerts, you will get an email when an email is marked compromised.","Select ATT recommended actions.","Review the recommendations for handling the compromised account.","Select Key Evidence.","Review the reasoning behind the compromised flag.","After you complete the recommended protective steps, click Reinstate Account, then choose Reinstate (Case Solved) or Reinstate (False Positive)."]},{"t":"h","x":"Google Scopes"},{"t":"p","x":"The following scopes should be added for Google users. See the linked article for how to add them."},{"t":"code","x":"https://www.googleapis.com/auth/admin.directory.user https://www.googleapis.com/auth/admin.directory.user.security"}],"l":[{"text":"this article","to":"compromised-account-scopes-google"},{"text":"Google scopes (link target)","url":"https://www.googleapis.com/auth/gmail.readonly,https://www.googleapis.com/auth/gmail.modify,https://mail.google.com/"}],"video_only":false},{"id":"verify-dkim","g":"t4","t":"Verify DKIM","sum":"Learn when to turn on the Verify DKIM toggle in Compromised Account settings to reduce spoofing false negatives and false positives.","p":"both","k":"concept","a":"portal-admin","m":2,"u":"2026-09-03","src":["what-is-verify-dkim"],"orig":["https://knowledgebase.cybernut.com/cybernut-knowledge-base/what-is-verify-dkim"],"v":[],"sh":1,"b":[{"t":"p","x":"Under the Compromised Account tab there is an option called Verify DKIM for Business Email Compromised. This article explains what it does."},{"t":"p","x":"As part of Business Email Compromise (BEC) detection, CyberNut added a verification layer. Before an inbound email is scored as suspicious or legitimate, the system checks its DKIM signature. DKIM lets CyberNut cryptographically confirm that a message came from the domain it claims and was not altered in transit. This makes it a strong signal for catching spoofed or impersonated senders."},{"t":"p","x":"DKIM is not universal. Not every organization publishes a DKIM record in DNS. If a sending domain has no DKIM configured, the check fails by default. That can cause false positives, where legitimate emails are flagged only because DKIM could not be verified."},{"t":"p","x":"To handle this, Settings includes a per account toggle. If your own domain, or a partner or vendor domain you often receive mail from, has DKIM properly enabled, switch the toggle ON so the system enforces the DKIM check. If a domain does not support DKIM yet, leave the toggle OFF. This avoids unfairly penalizing that domain's emails, and CyberNut uses its other authentication and scoring signals instead."},{"t":"p","x":"In short, the toggle accounts for uneven DKIM adoption. Strict verification applies where DKIM is supported, and false positives are avoided where it is not."},{"t":"h","x":"DomainKeys Identified Mail (DKIM)"}],"l":[],"video_only":false},{"id":"gmail-report","g":"f1","t":"Report a suspicious email in Gmail","sum":"Use the blue squirrel CyberNut add-on in Gmail on the web to report a suspicious email, and grant it permission the first time.","p":"google","k":"how-to","a":"staff","m":3,"u":"2026-04-15","src":["report-a-suspicious-email-using-gmail","locate-gmail-addon","how-do-i-link-my-google-cloud-console-project-with-the-cybernut-admin-portal-0-7"],"orig":["https://knowledgebase.cybernut.com/cybernut-knowledge-base/report-a-suspicious-email-using-gmail","https://knowledgebase.cybernut.com/cybernut-knowledge-base/locate-gmail-addon","https://knowledgebase.cybernut.com/cybernut-knowledge-base/how-do-i-link-my-google-cloud-console-project-with-the-cybernut-admin-portal-0-7"],"v":[{"url":"https://cybernut.storylane.io/share/9fmnk2rfgf84","host":"Storylane"}],"sh":11,"b":[{"t":"steps","items":["Select the suspicious email. A generic image file in the message is often a phishing warning sign.","If the add-on bar is not visible, click the arrow to show it.","Click the CyberNut icon, a blue squirrel, in the toolbar.","Click the Report Email button to start the process.","Select every option that applies, and be as specific as possible to improve threat detection.","Click Report Email to finish. Your report also protects other users."]},{"t":"note","x":"Cannot see the add-on? Select the arrow in the lower right corner of Gmail to show your installed add-ons, including CyberNut."},{"t":"h","x":"First time using the add-on? Grant permission"},{"t":"steps","items":["Open the CyberNut add-on from the right sidebar by clicking the blue squirrel icon.","Select Grant permission.","Choose your name and email account.","Select Continue.","Select Allow."]}],"l":[{"text":"installed the Gmail add-on","to":"install-gmail-add-on"}],"video_only":false},{"id":"chrome-extension-guide","g":"f1","t":"Using the CyberNut Chrome extension","sum":"Learn how staff report suspicious emails with the CyberNut Chrome extension squirrel icon and find answers to common questions.","p":"google","k":"concept","a":"staff","m":5,"u":"2026-07-09","src":["chrome-extension-update"],"orig":["https://knowledgebase.cybernut.com/cybernut-knowledge-base/chrome-extension-update"],"v":[{"url":"https://www.loom.com/share/dceae5043d484fc89e4a377ec3bf5436","host":"Loom"}],"sh":0,"b":[{"t":"h","x":"FAQs"},{"t":"h","x":"Set up & Configuration"},{"t":"p","x":"Which browsers does the extension support? Only Google Chrome."},{"t":"p","x":"How do I install or deploy the extension across my district? Follow the deployment instructions in the linked guide."},{"t":"p","x":"I'm a Microsoft 365 customer. Do I have this extension? No. The Chrome extension is for Google Workspace customers only. Microsoft 365 customers use the CyberNut Outlook add-in, which has not changed."},{"t":"p","x":"How is the Chrome extension different from the Gmail plugin? The Gmail plugin is a side panel inside Gmail. It is always available when you use Gmail in a browser or the Gmail mobile app. The Chrome extension is a separate browser add-on that places the squirrel icon on the email you are reading, offering a faster one-click report option. Both send reports to the same place, so they follow the same district threat review process."},{"t":"p","x":"Will this update affect my district's reported threat history or analytics? No. Historical reports, analytics, and threat data stay the same. The update only changes where the report button appears in Gmail."},{"t":"h","x":"Usage"},{"t":"p","x":"Where does the squirrel icon appear? It first appears in the bottom left corner and on the top ribbon of an open email. The larger squirrel icon can be moved to a location you prefer. It also appears as a quick action when you view a list of emails."},{"t":"p","x":"I installed the extension but don't see the squirrel. What should I check?"},{"t":"steps","items":["Make sure you have an email open. The icon does not appear in the inbox list.","Make sure you are signed into Chrome with your district email.","Make sure you are running a recent version of Chrome.","If the floating squirrel icon is not available, your Tech Admin may have disabled it."]},{"t":"p","x":"How do users report a suspicious email with the new icon? Open the email and click one of the available squirrel icons. The email is reported and routed through your district's standard threat review process."},{"t":"p","x":"How do users report a suspicious email with the new icon? Open the email and click the squirrel icon. The email is reported and routed through your district's standard threat review process."}],"l":[{"text":"instructions","to":"deploy-chrome-extension"}],"video_only":false},{"id":"phone","g":"f1","t":"Report email on an iPhone","sum":"Report suspicious email from the Gmail or Outlook app on an iPhone. The add-on does not work in Apple Mail.","p":"both","k":"how-to","a":"staff","m":6,"u":"2026-03-04","src":["cybernut-on-phone","how-do-i-install-the-google-add-on-to-my-phone","report-suspicious-email-gmail-app-on-an-iphone"],"orig":["https://knowledgebase.cybernut.com/cybernut-knowledge-base/cybernut-on-phone","https://knowledgebase.cybernut.com/cybernut-knowledge-base/how-do-i-install-the-google-add-on-to-my-phone","https://knowledgebase.cybernut.com/cybernut-knowledge-base/report-suspicious-email-gmail-app-on-an-iphone"],"v":[],"sh":2,"b":[{"t":"p","x":"The CyberNut Add on works on an iPhone, but not in the built in Apple Mail app. Use the Gmail or Outlook app instead."},{"t":"note","x":"You do not install anything on your phone. If the CyberNut add-on is installed for your account on a computer, it shows up in the Gmail app too."},{"t":"h","x":"Using the CyberNut Add on with Gmail"},{"t":"steps","items":["Open the Gmail app.","Choose a suspicious email.","Scroll to the bottom of the email and tap the CyberNut icon, a blue squirrel.","Tap the red Report Email button.","If the email is a phishing simulation, you are taken to a page that awards acorns and asks a question so you can earn more.","Answer the question correctly to earn additional acorns.","If you want to join and see the Leaderboard, select the link provided.","If the email is not a simulation, select any options that apply, then tap Report Email."]},{"t":"h","x":"Using the CyberNut Add on with Outlook"},{"t":"steps","items":["Open the Outlook app.","Choose a suspicious email.","Tap the three dots just below the email's date.","Tap the CyberNut icon, a blue squirrel.","Tap the red Report Email button.","If the email is a CyberNut phishing simulation, you earn 3 acorns.","Answering a question correctly earns 2 more acorns.","If the email is not a simulation, a screen appears. Select any applicable options and tap Report Email.","After submitting, you receive a confirmation."]}],"l":[],"video_only":false},{"id":"ipad","g":"f1","t":"Using CyberNut on an iPad","sum":"Training works fully on iPad. Phishing simulations and reporting need Gmail in Safari or Chrome because Google does not support add-ons in iPad apps.","p":"google","k":"concept","a":"everyone","m":6,"u":"2026-03-31","src":["ipad-compatibility","cybernut-ipad-gmail","cybernut-ipad"],"orig":["https://knowledgebase.cybernut.com/cybernut-knowledge-base/ipad-compatibility","https://knowledgebase.cybernut.com/cybernut-knowledge-base/cybernut-ipad-gmail","https://knowledgebase.cybernut.com/cybernut-knowledge-base/cybernut-ipad"],"v":[{"url":"https://cybernut.storylane.io/share/qsywrdnqkohz","host":"Storylane"}],"sh":5,"b":[{"t":"p","x":"CyberNut phishing simulations and email reporting depend on Google Workspace add-on features that do not run in the iPad and iOS Gmail app, for both faculty and staff and students. On iPad, phishing simulations and reporting can sometimes be done through browser based Gmail in Safari, but the experience is more limited than on desktop."},{"t":"p","x":"Training content, including staff compliance videos and student training on cybersecurity, digital citizenship and AI media literacy, works fully on iPad. That includes receiving training emails in the native Gmail app and completing modules."},{"t":"h","x":"Definitions"},{"t":"list","items":["Phishing Simulations: simulated phishing emails sent to users. Clicking or reporting one triggers immediate micro-training.","Email Reporting: users report suspicious emails to CyberNut through the add-on or extension.","Student Training Modules: video lessons on cybersecurity, digital citizenship and AI media literacy, with optional quizzes.","Teacher Portal: a classroom portal where instructors run in-class training and access the content library."]},{"t":"h","x":"Current iPad Compatibility Summary"},{"t":"h","x":"Works well on an iPad"},{"t":"list","items":["Faculty and staff compliance training videos. Training emails arrive in the native Gmail app. Videos and quizzes can be completed fully on iPad.","Student training modules (cybersecurity, digital citizenship, AI media literacy). Students receive assignment emails in the native Gmail app, open links and complete training fully on iPad.","Teacher Portal. Teachers can access the content library and run in-class training on iPad."]},{"t":"h","x":"Reduced functionality"},{"t":"list","items":["Phishing simulations for faculty, staff and students","Email reporting for faculty, staff and students"]},{"t":"h","x":"Not supported on iPad today"},{"t":"list","items":["CyberNut add-on functionality inside the Gmail iOS app, for any user type (staff or students)"]},{"t":"h","x":"Root Cause"},{"t":"p","x":"The limitation comes from Google's platform support for Workspace add-ons on iPad and iOS, particularly in the Gmail app. Because it is a Google platform limit, CyberNut cannot directly control it."},{"t":"h","x":"Workaround Recommendations (Phishing Simulations and Reporting)"},{"t":"list","items":["iPad users (faculty, staff and students) need to access email through browser based Gmail, typically in Safari.","In browser Gmail, users can complete the phishing simulation and, where applicable, report using the browser."]},{"t":"h","x":"Report a suspicious email on an iPad"},{"t":"note","x":"The add-on works only in Safari or Chrome. These steps use Safari."},{"t":"steps","items":["Sign in to your Google account in Safari.","Open the suspicious email you want to report.","In the right sidebar, select the CyberNut Gmail add-on icon, a blue squirrel.","Click Report Email.","If the email is not a CyberNut simulation, check the items that apply, then click Report Email.","You have successfully submitted the report."]},{"t":"note","x":"For iPad heavy environments, use a hybrid model. Training (staff and students) is iPad friendly and fully supported. For phishing simulations and reporting, use a desktop or laptop when available and use the browser workaround on iPad if required."},{"t":"note","x":"CyberNut is working to improve the iPad phishing simulation and reporting experience and is exploring better options than the browser workaround. There is no confirmed solution or timeline yet."}],"l":[],"video_only":false},{"id":"why-not-report-spam","g":"f1","t":"Why not use Gmail's Report Spam button?","sum":"Learn why Gmail's Report Spam or Report Phish buttons bypass CyberNut, so reports, Acorns, training, and threat visibility are lost.","p":"google","k":"concept","a":"staff","m":1,"u":"2025-11-02","src":["can-staff-use-gmails-report-spam-button-instead-of-the-cybernut-add-on"],"orig":["https://knowledgebase.cybernut.com/cybernut-knowledge-base/can-staff-use-gmails-report-spam-button-instead-of-the-cybernut-add-on"],"v":[],"sh":0,"b":[{"t":"p","x":"No. Using the Gmail \"Report Spam\" or \"Report Phish\" buttons bypasses CyberNut completely."},{"t":"p","x":"When staff use the Google buttons instead of the add-on:"},{"t":"list","items":["CyberNut does not log the event.","Users do not earn Acorns (rewards).","Training modules are not triggered.","Real threats do not appear in the CyberNut dashboard."]}],"l":[],"video_only":false},{"id":"what-to-expect-gmail","g":"f2","t":"What to expect in a campaign (Gmail)","sum":"See what Gmail users experience in a campaign, including weekly simulations, reporting with the blue squirrel, and earning acorns.","p":"google","k":"concept","a":"staff","m":6,"u":"2026-07-10","src":["what-to-expect-phishing-campaign-google"],"orig":["https://knowledgebase.cybernut.com/cybernut-knowledge-base/what-to-expect-phishing-campaign-google"],"v":[{"url":"https://cybernut.storylane.io/share/2r8ugjsxigsu","host":"Storylane"}],"sh":1,"b":[{"t":"h","x":"Overview"},{"t":"p","x":"A phishing training campaign sends simulated phishing emails tailored to each recipient's behavior, so users practice spotting and reporting threats in real time. Correct responses earn acorns. Mistakes trigger short, targeted microtraining. The campaign runs continuously and with low pressure throughout the school year."},{"t":"note","x":"The campaign includes an Onboarding Campaign that first teaches users how to report a suspicious email with the CyberNut add-on (Blue Squirrel)."},{"t":"steps","items":["A district Tech Admin schedules a Phishing Training Campaign. This usually includes the Onboarding Campaign, which teaches users to report suspicious emails with the CyberNut Reporting Tool.","After onboarding, users receive a phishing simulation email about once a week.","Open the email and click the CyberNut Reporting Tool (blue squirrel) in the side panel.","Click the red Report Email button. A screen awards 3 acorns and offers Earn more acorns or Go to Leaderboard.","Choosing Earn more acorns shows a screen with Start Tutorial to learn more or Skip to move ahead.","Skipping shows the red flags in the email right away and starts the Assessment.","Clicking a red flag opens a question. Users get 3 attempts to pick the correct answer. Question mark icons give hints.","Answering correctly earns 2 more acorns.","Users can then view the Leaderboard.","Clicking a link in a phishing simulation email (such as the button shown) redirects the user to a microtraining.","The user lands on a Yikes page and can earn 2 acorns by completing the microtraining.","Clicking Start Learning shows the email with its red flags highlighted.","The user clicks through each red flag to learn about it. Simulation emails contain 2 to 4 red flags.","After the tutorial, the user moves on to the Assessment described in steps 6 to 9."]}],"l":[],"video_only":false},{"id":"what-to-expect-outlook","g":"f2","t":"What to expect in a campaign (Outlook)","sum":"See what Outlook users experience in a campaign, including weekly simulations, reporting from the ribbon, and earning acorns.","p":"microsoft","k":"concept","a":"staff","m":6,"u":"2026-07-10","src":["what-to-expect-phishing-campaign-outlook"],"orig":["https://knowledgebase.cybernut.com/cybernut-knowledge-base/what-to-expect-phishing-campaign-outlook"],"v":[{"url":"https://cybernut.storylane.io/share/2r8ugjsxigsu","host":"Storylane"}],"sh":1,"b":[{"t":"h","x":"Overview"},{"t":"p","x":"A phishing training campaign sends simulated phishing emails tailored to each recipient's behavior, so users practice spotting and reporting threats in real time. Correct responses earn acorns. Mistakes trigger short, targeted microtraining. The campaign runs continuously and with low pressure throughout the school year."},{"t":"note","x":"The campaign includes an Onboarding Campaign that first teaches users how to report a suspicious email with the CyberNut add-on (Blue Squirrel)."},{"t":"steps","items":["A district Tech Admin schedules a Phishing Training Campaign. This usually includes the Onboarding Campaign, which teaches users to report suspicious emails with the CyberNut Reporting Tool.","After onboarding, users receive a phishing simulation email about once a week.","Open the email and click the CyberNut Reporting Tool (blue squirrel) in the top ribbon.","Click the red Report Email button. A screen awards 3 acorns and offers Earn more acorns or Go to Leaderboard.","Choosing Earn more acorns shows a screen with Start Tutorial to learn more or Skip to move ahead.","Skipping shows the red flags in the email right away and starts the Assessment.","Clicking a red flag opens a question. Users get 3 attempts to pick the correct answer. Question mark icons give hints.","Answering correctly earns 2 more acorns.","Users can then view the Leaderboard.","Clicking a link in a phishing simulation email (such as the button shown) redirects the user to a microtraining.","The user lands on a Yikes page and can earn 2 acorns by completing the microtraining.","Clicking Start Learning shows the email with its red flags highlighted.","The user clicks through each red flag to learn about it. Simulation emails contain 2 to 4 red flags.","After the tutorial, the user moves on to the Assessment described in steps 6 to 9."]}],"l":[],"video_only":false},{"id":"complete-onboarding","g":"f2","t":"How to complete onboarding","sum":"Watch a Loom video walkthrough of CyberNut Onboarding that also answers common questions.","p":"both","k":"how-to","a":"staff","m":3,"u":"2024-10-18","src":["i-dont-know-how-to-complete-the-cybernut-onboarding"],"orig":["https://knowledgebase.cybernut.com/cybernut-knowledge-base/i-dont-know-how-to-complete-the-cybernut-onboarding"],"v":[{"url":"https://www.loom.com/share/9ffb78729fed4d6cb1f598840a7d3569","host":"Loom"}],"sh":0,"b":[{"t":"p","x":"Watch the recorded walk through of the CyberNut Onboarding. It answers some common questions about the onboarding process."}],"l":[{"text":"Here","url":"https://www.loom.com/share/9ffb78729fed4d6cb1f598840a7d3569"}],"video_only":false},{"id":"onboarding-without-mobile-app","g":"f2","t":"Finish onboarding without a mobile email app","sum":"Complete the Onboarding Campaign without a mobile email app by opening the second simulation email on a computer and reporting it.","p":"both","k":"how-to","a":"staff","m":1,"u":"2024-10-18","src":["i-dont-use-an-email-app-on-my-mobile-device-so-i-cant-complete-the-onboarding-campaign"],"orig":["https://knowledgebase.cybernut.com/cybernut-knowledge-base/i-dont-use-an-email-app-on-my-mobile-device-so-i-cant-complete-the-onboarding-campaign"],"v":[],"sh":0,"b":[{"t":"p","x":"If you do not use an email app on your mobile device for your school email, you can still complete the onboarding. Open the second CyberNut phishing simulation email on your computer and report it from there."}],"l":[],"video_only":false},{"id":"leaderboard","g":"f2","t":"Find the Leaderboard","sum":"Reach the Leaderboard after a micro-quiz, switch between district, team, and Teams views, find your position, or opt out.","p":"both","k":"how-to","a":"staff","m":3,"u":"2025-10-30","src":["how-do-i-access-the-leaderboard"],"orig":["https://knowledgebase.cybernut.com/cybernut-knowledge-base/how-do-i-access-the-leaderboard"],"v":[],"sh":1,"b":[{"t":"p","x":"Staff and students reach the Leaderboard by clicking on or reporting an email. After they complete the micro-quiz, a link to the Leaderboard appears."},{"t":"p","x":"If you have not already, you will need to opt in to the Leaderboard."},{"t":"p","x":"Use the dropdown in the top left corner to switch between Leaderboard views. The views you see depend on how your Admin configured them:"},{"t":"list","items":["Your district name: all users in the district, ranked by acorns earned.","Your Team name: all users on your Team, ranked by acorns earned.","Teams: Team versus Team, ranked by the average acorns earned by each Team's members."]},{"t":"p","x":"By default the Leaderboard shows the top 10 individuals or Teams. To find your own position, toggle the \"You\" view in the top right corner. Your position or your Team's position is highlighted."},{"t":"p","x":"You can opt out at the bottom of the Leaderboard. Opting out removes you from the list."}],"l":[],"video_only":false},{"id":"team-captain-guide","g":"f3","t":"Getting started as a Team Captain","sum":"Log in as a Team Captain to monitor your team's training, send reminders, export reports, and share the leaderboard.","p":"both","k":"how-to","a":"team-captain","m":12,"u":"2026-09-17","src":["getting-started-as-a-team-captain"],"orig":["https://knowledgebase.cybernut.com/cybernut-knowledge-base/getting-started-as-a-team-captain"],"v":[{"url":"https://cybernut.storylane.io/share/vdank3osmlav","host":"Storylane"}],"sh":1,"b":[{"t":"p","x":"The walkthrough shows how a Team Captain uses the CyberNut portal to monitor team cybersecurity training. It covers SSO login, campaigns, metrics, reminders, manual completions, reports, team filters, phishing email reviews, leaderboards and shareable links."},{"t":"note","x":"Before a Team Captain can log in, a school district Technology Administrator must add the user in the SSO group setup in Google or Microsoft and in the CyberNut Settings."},{"t":"steps","items":["Go to https://admin.cybernut.com.","Enter your email address to begin. If you are signed in to a Chrome profile, type only your domain (everything after the @) and Chrome completes the rest.","Click the button to sign in with Single Sign-On. No separate password is needed, only your existing credentials.","Select your account if prompted.","Some sections are visible but locked because they are reserved for CyberNut Administrators. Your Team Captain view focuses on information relevant to your team.","You see only the campaigns assigned to you. Open the Onboarding campaign to see what is available to you as a Team Captain.","This screen shows the key details of the campaign. You can view it but not edit it.","Switch between numbers and percentages to show the data in the format that suits your reporting.","Each tile shows a different campaign metric. Click one for details, such as Users to see who is on the list.","To remind people who have not finished, use the reminder button to send an automated nudge.","If a user clearly demonstrated the skill but missed the practice email, use this option to mark them as completed.","Export the completion data for the campaign as a downloadable report for audits, leadership updates or your own records.","Use the team filter to compare results across groups. This helps when you oversee multiple teams.","Next, open the Training Campaign view to see the actions available there.","Click through the tabs. Each one shows a different slice of your team's training data.","This view shows the individual progress of each team member. Click a button or tile to look more closely at someone's status.","Here you can review the top emails clicked, identify high risk users and check the Leaderboard.","Click the Activity tab for a chronological list of all user actions.","Click any email date in the list to see the exact email that user received.","This is a preview of the phishing email the user interacted with. It helps explain why it may have caught them off guard.","The Leaderboard lets team members compare standings. The friendly competition tends to keep engagement high.","Generate a shareable link to display the Leaderboard publicly, for example by posting it where your team can see it."]}],"l":[{"text":"CyberNut Admin Portal","url":"https://admin.cybernut.com"}],"video_only":false},{"id":"no-simulation-emails","g":"x1","t":"Users are not getting simulation emails","sum":"Troubleshoot missing Baseline Campaign simulation emails by checking spam folders, allowlisting CyberNut, and verifying user addresses.","p":"both","k":"troubleshoot","a":"it-admin","m":2,"u":"2025-10-30","src":["my-users-did-not-receive-phishing-simulation-emails-during-the-baseline-campaign"],"orig":["https://knowledgebase.cybernut.com/cybernut-knowledge-base/my-users-did-not-receive-phishing-simulation-emails-during-the-baseline-campaign"],"v":[],"sh":0,"b":[{"t":"h","x":"Solutions"},{"t":"list","items":["Check spam or junk folders. The simulation emails may have been filtered there.","Allowlist our domains. Make sure your email server accepts emails from our domains and IP addresses.","Verify that each user's email address is correct and active."]}],"l":[],"video_only":false},{"id":"no-welcome-email","g":"x1","t":"Users never got the onboarding welcome email","sum":"Troubleshoot missing onboarding welcome emails by checking message trace, email filters, user groups, and resending from the Admin Dashboard.","p":"both","k":"troubleshoot","a":"it-admin","m":2,"u":"2024-10-18","src":["users-did-not-receive-the-welcome-email-for-the-onboarding-campaign"],"orig":["https://knowledgebase.cybernut.com/cybernut-knowledge-base/users-did-not-receive-the-welcome-email-for-the-onboarding-campaign"],"v":[],"sh":0,"b":[{"t":"h","x":"Solutions"},{"t":"list","items":["Message Trace: check whether the email went to spam or junk, or was quarantined.","Email Filters: make sure the school's filtering rules are not blocking these emails.","User Groups Updated: make sure the recipient is in the user group.","Resend Emails: resend the welcome email from the Admin Dashboard."]}],"l":[],"video_only":false},{"id":"welcome-link-reset-page","g":"x1","t":"The welcome email link opens a Reset page","sum":"Fix onboarding links that land on a Reset page by allowlisting CyberNut in content filters such as Cisco Umbrella or Securly.","p":"both","k":"troubleshoot","a":"it-admin","m":1,"u":"2024-10-18","src":["when-i-click-the-link-in-the-onboarding-welcome-email-it-redirects-to-a-page-that-says-reset"],"orig":["https://knowledgebase.cybernut.com/cybernut-knowledge-base/when-i-click-the-link-in-the-onboarding-welcome-email-it-redirects-to-a-page-that-says-reset"],"v":[],"sh":0,"b":[{"t":"h","x":"Solutions"},{"t":"list","items":["Content filter: a content filter may be interfering. Allowlist CyberNut in your filtering tool, for example Cisco Umbrella, Lightspeed Systems, Securly, Gaggle, Barracuda, iBoss, and others."]}],"l":[],"video_only":false},{"id":"progress-not-tracking","g":"x1","t":"Progress is stuck on Not Started or In Progress","sum":"Fix stuck Not Started or In Progress metrics caused by blocked API calls from firewalls, proxies, VPNs, or browser settings.","p":"both","k":"troubleshoot","a":"it-admin","m":3,"u":"2024-10-18","src":["users-progress-is-not-being-tracked-metrics-show-users-as-not-started-or-in-progress-indefinitely"],"orig":["https://knowledgebase.cybernut.com/cybernut-knowledge-base/users-progress-is-not-being-tracked-metrics-show-users-as-not-started-or-in-progress-indefinitely"],"v":[],"sh":0,"b":[{"t":"note","x":"Known issue: network or local security measures may block the platform's API calls, so user data does not reach the servers."},{"t":"h","x":"Solutions"},{"t":"list","items":["Network Firewall: check whether the school's network firewall is blocking the API endpoints. Action: ask the IT department to allow the API URLs.","Local Firewall: check whether a firewall on the end user's device is blocking the API endpoints.","Proxy Servers: if a proxy is used, make sure it allows API traffic to the servers.","VPN: if a VPN is used, make sure it allows API traffic to the servers.","Browser Settings: make sure the browser is not blocking scripts or API calls.","Alternate Networks: try a different network to see if the problem continues.","Contact Support: if the problem continues, contact support for help."]}],"l":[],"video_only":false},{"id":"cannot-log-in","g":"x1","t":"I cannot log in to the Admin Portal","sum":"Fix Admin Portal login or access denied errors by signing up, checking credentials, and confirming CyberNut Admin group membership.","p":"both","k":"troubleshoot","a":"portal-admin","m":2,"u":"2025-11-01","src":["i-am-unable-to-log-in-to-the-admin-dashboard-or-i-receive-access-denied-errors"],"orig":["https://knowledgebase.cybernut.com/cybernut-knowledge-base/i-am-unable-to-log-in-to-the-admin-dashboard-or-i-receive-access-denied-errors"],"v":[],"sh":0,"b":[{"t":"h","x":"Solutions"},{"t":"list","items":["Sign up for an account. Each administrator needs their own account, created by signing up at https://admin.cybernut.com/login. If another administrator adds you as a user, that only grants you permissions. It does not create your account.","Verify your credentials. Make sure you are entering the correct email address and password.","Check account permissions. Confirm your account is in the CyberNut Admin group, which is managed in either the Google Admin Console or the Microsoft Azure Portal. Only members of this group can log in to the CyberNut Admin Dashboard."]}],"l":[{"text":"https://admin.cybernut.com/login","url":"https://admin.cybernut.com/login"}],"video_only":false},{"id":"unblock-domain-mail-flow","g":"x1","t":"A real domain got blocked by the CyberNut mail rule","sum":"Remove an accidentally blocked domain from the CyberNut mail flow rule in the Exchange admin center.","p":"microsoft","k":"troubleshoot","a":"it-admin","m":4,"u":"2026-02-05","src":["how-do-we-remove-a-blocked-domain-that-was-accidentally-added-to-our-cybernut-mail-flow-rules"],"orig":["https://knowledgebase.cybernut.com/cybernut-knowledge-base/how-do-we-remove-a-blocked-domain-that-was-accidentally-added-to-our-cybernut-mail-flow-rules"],"v":[],"sh":0,"b":[{"t":"p","x":"If a domain was blocked by mistake in your Microsoft Exchange mail flow, you need to edit the CyberNut rule your organization created."},{"t":"note","x":"Domains must be unblocked in the CyberNut dashboard. If you only remove a domain from the Microsoft transport rule, CyberNut will add it back automatically."},{"t":"steps","items":["Sign in to the Exchange admin center at https://admin.exchange.microsoft.com/.","Open Mail flow, then select Rules.","Find the CyberNut rule.","Open the rule to edit it.","In the conditions section (for example Apply this rule if), find the domain or IP address you want to remove.","Delete the blocked domain from the list.","Save your changes."]},{"t":"note","x":"Changes can take up to 24 hours to take effect."}],"l":[{"text":"Exchange admin center","url":"https://admin.exchange.microsoft.com/"}],"video_only":false},{"id":"basic-fixes","g":"x2","t":"Basic fixes to try first","sum":"Five quick browser fixes to try before troubleshooting anything specific to CyberNut.","p":"both","k":"troubleshoot","a":"everyone","m":2,"u":"2025-10-30","src":["what-are-some-general-troubleshooting-tips-for-microsoft"],"orig":["https://knowledgebase.cybernut.com/cybernut-knowledge-base/what-are-some-general-troubleshooting-tips-for-microsoft"],"v":[],"sh":0,"b":[{"t":"h","x":"General Troubleshooting Steps"},{"t":"p","x":"Try these general steps before looking into specific issues."},{"t":"list","items":["Refresh the page. A simple reload can clear temporary glitches.","Clear your browser cache and cookies. This can fix loading and sign in problems.","Use a supported browser. CyberNut works best on Chrome.","Update your browser to the latest version.","Check your internet connection. A stable connection is necessary."]}],"l":[],"video_only":false},{"id":"system-requirements","g":"x2","t":"System requirements","sum":"Check the supported operating systems, browsers, email clients, and network access needed to use CyberNut.","p":"both","k":"concept","a":"everyone","m":3,"u":"2026-01-28","src":["compatibility"],"orig":["https://knowledgebase.cybernut.com/cybernut-knowledge-base/compatibility"],"v":[],"sh":0,"b":[{"t":"h","x":"System Requirements"},{"t":"p","x":"Ensure your system meets the minimum requirements. Before you start, confirm that your setup meets the requirements below."},{"t":"h","x":"Operating Systems"},{"t":"list","items":["Windows 10 or later","macOS 10.13 (High Sierra) or later","Chrome OS (Chromebooks)","iPadOS using the Safari browser"]},{"t":"h","x":"Browsers"},{"t":"list","items":["Google Chrome v89 or later","Mozilla Firefox v86 or later","Microsoft Edge v89 or later","Gmail (web version)","Gmail mobile app (iOS and Android)"]},{"t":"h","x":"Email Clients"},{"t":"list","items":["Gmail (web version)","Gmail mobile app (iOS and Android)","Outlook 365"]},{"t":"h","x":"Network"},{"t":"p","x":"Your network must allow open access to CyberNut's service URLs and APIs. See CyberNut URLs & APIs."}],"l":[{"text":"CyberNut URLs & APIs","to":"firewall-allowlist"}],"video_only":false},{"id":"har-file","g":"x2","t":"Capture a HAR file for support","sum":"Record and export a sanitized HAR file from Chrome DevTools while reproducing a CyberNut add-on error in Gmail for support.","p":"google","k":"support","a":"everyone","m":4,"u":"2026-10-01","src":["capture-har-file"],"orig":["https://knowledgebase.cybernut.com/cybernut-knowledge-base/capture-har-file"],"v":[],"sh":7,"b":[{"t":"steps","items":["Sign in to Gmail and open the CyberNut add-on.","Right click anywhere in the side panel and select Inspect.","In the DevTools panel, open the Network tab. Recording starts automatically.","Turn on Keep log.","Click Clear network log.","Reproduce the problem by clicking Report Email.","When finished, click Export HAR (sanitized) and save the file.","Name the file cybernut_error."]},{"t":"p","x":"After saving, upload the HAR file as an attachment to your support case."}],"l":[{"text":"HAR","url":"https://en.wikipedia.org/wiki/HAR_(file_format)"}],"video_only":false},{"id":"release-2026-10-10","g":"u1","t":"October 10, 2026 release","sum":"See what changed in the October 2026 release, including student phishing senders, force password reset, and compromised account threat thresholds.","p":"both","k":"release","a":"everyone","m":8,"u":"2026-10-12","src":["product-updates-oct-10-2026-release"],"orig":["https://knowledgebase.cybernut.com/cybernut-knowledge-base/product-updates-oct-10-2026-release"],"v":[],"sh":11,"b":[{"t":"p","x":"This release includes updates across several product areas, grouped by area below."},{"t":"h","x":"Advanced Threat Search"},{"t":"list","items":["Advanced Threat Search has been rebuilt so results return much faster, which matters most for large districts.","Admins can find every copy of a phishing email across the district and remove it before more people click.","Schools on Google Workspace can now search by sender, often the fastest way to find every copy of a campaign.","Results show how many mailboxes were searched and where copies were found.","Opening Advanced Threat Search from a case pre-fills the search form."]},{"t":"h","x":"Student Phishing Simulations"},{"t":"list","items":["The student phishing simulation library has been refreshed with scams students are more likely to fall for, such as fake game rewards, streaming offers, and messages that mimic school apps.","The library has 33 senders across five categories (EdTech vendors, gaming, streaming and entertainment, food and retail, and prizes and giveaways) at three difficulty levels.","Admins can preview each sender's template and turn off senders that do not fit, as long as at least 8 stay on.","Active student phishing campaigns switch to the refreshed senders automatically. New campaigns can be scheduled starting October 1."]},{"t":"h","x":"Student Training Reminders and Warnings"},{"t":"list","items":["Student training campaigns send reminder emails on the schedule the admin sets.","When a module is overdue, students receive warning emails until they finish the module or the campaign ends."]},{"t":"h","x":"Force Password Reset"},{"t":"list","items":["When a reporter says they may have entered their password, admins can force a reset directly from the case without leaving CyberNut.","A temporary password is issued in the Dashboard."]},{"t":"h","x":"Compromised Account Detection"},{"t":"p","x":"These options are in Settings, under Compromised Account Detection."},{"t":"list","items":["Threshold. Scores run from 0 to 100, and higher means riskier. The threshold starts at 0, which flags every internal phishing verdict, matching the previous behavior. Raising it flags only higher risk emails.","Auto-suspend. When enabled, a flagged account is locked automatically. The user must contact IT to reset the password, and IT admins are notified. This works for Google and Microsoft accounts. The threshold also controls when auto-suspend applies.","Exception list. Accounts on this list are never locked, but they are still flagged and IT admins are still notified.","Alert recipients. Admins can add up to 10 email addresses. If the list is empty, alerts go to the address on the Report Button tab.","Reported actions. Compromised Accounts show what each reporter did with the email."]},{"t":"h","x":"Active Threat Manager"},{"t":"list","items":["Escalated cases first. In Needs Review, escalated cases are pinned to the top with a count and a solid red badge. The list also shows the total case count.","Email preview. The old View Email pop-up is gone. The preview opens automatically inside the case, and the Headers tab shows only useful fields.","Credentials at risk filter. Shows only cases where a reporter said they entered a password or logged into a page.","Bulk actions. The bulk Action menu matches the single case menu in actions, order, and wording. New options Quarantine All Emails in the Case and Delete All Emails in the Case apply to every selected case. Quarantined emails are deleted automatically after 30 days.","Alert email content. New report emails describe what the reporter did, such as clicking a link.","Default date range. The Reported Threats page opens on the last 30 days, and the side menu count matches the Needs Review tab.","Safe cases. If someone reports an email already marked Safe, the case is not reopened or acted on automatically and stays in the Safe tab."]},{"t":"h","x":"Automated Threat Terminator improvements"},{"t":"list","items":["Clean-ups find more emails and report their status accurately.","Alerts reach every recipient, even if one address on the list is invalid.","Microsoft 365 searches find emails whose subjects contain extra spaces.","Clean-ups handle unusual email IDs more safely and act only on exact matches.","A running clean-up is no longer marked as failed. Scan complete appears whenever a scan finishes.","Accounts with multiple Google or Microsoft domains can select campaign groups and find members on the correct domain.","Fixed a bug that awarded too many threat acorns for one report.","Clean-ups no longer return empty results because of how an email ID or missing subject was searched.","Gmail clean-ups find emails whose IDs contain a pipe character.","If an email was already removed, the clean-up says so instead of reporting zero matches.","Microsoft 365 clean-ups no longer stall on Processing when an email has a very long subject."]},{"t":"h","x":"Campaign Creation Flow Updates"},{"t":"list","items":["Admins select courses first, then configure the campaign.","Staff compliance and student video campaigns follow the same steps.","A date can be set for each video, and the first module can start on the campaign start date."]},{"t":"h","x":"Campaign Reporting"},{"t":"list","items":["Micro-learning counts. Each session counts once, so completed cannot exceed sent. The micro tutorial no longer affects stats, acorns, or risk scores.","Campaign pages. The Users tab, Leaderboard tab, and overview cards display data again.","Top clicked categories. The chart shows the phishing type, such as Brand Impersonation.","Exports. Exports cover every campaign version and show whether each person is active or inactive, so an export may list more users than the active count on the dashboard.","Dashboard. Active campaigns that were missing from the dashboard appear again.","Click totals. Users Clicked and Total Clicks on the campaign dashboard are consistent.","Activity filter. Teams with identical names can be told apart."]},{"t":"h","x":"Compliance Videos and Templates"},{"t":"list","items":["Reminder and warning email templates display correctly.","Module 20 has been added."]},{"t":"h","x":"Chrome Extension and Report Button"},{"t":"list","items":["Gmail performance. The CyberNut Chrome extension no longer slows Gmail or uses excessive memory.","SSO error. Staff with SSO no longer see the Network or Server error message when they click the report button."]},{"t":"h","x":"Training and Simulation Emails"},{"t":"list","items":["Progress. Refreshing the page no longer restarts training.","Clue highlighting. Highlighted clues use a clean animated line, and hovering over a clue hides the other flags.","Simulation logging. Simulation emails are logged once so they are not reported back as real threats.","Gift card simulations. Fixed an issue with reporting gift card simulations."]}],"l":[],"video_only":false},{"id":"release-2026-09-07","g":"u1","t":"September 7, 2026 release","sum":"Learn about faster bulk email remediation and new Google Workspace dynamic groups support in the September 2026 release.","p":"both","k":"release","a":"everyone","m":3,"u":"2026-09-10","src":["product-updates-sept-7-2026"],"orig":["https://knowledgebase.cybernut.com/cybernut-knowledge-base/product-updates-sept-7-2026"],"v":[],"sh":1,"b":[{"t":"h","x":"CyberNut Platform Improvements"},{"t":"h","x":"Faster bulk email remediation across every inbox"},{"t":"p","x":"A platform update speeds up how CyberNut bulk processes and remediates reported emails across an entire domain. Remediation that used to take about 30 minutes now usually finishes in under 5 minutes, an improvement of at least 80%."},{"t":"p","x":"Reported Threats shows only the emails users report. When you remediate one of those reports, CyberNut also finds and removes every other matching copy in your domain, including copies nobody reported. That full cleanup now takes minutes, regardless of district size."},{"t":"p","x":"The update is live today for all customers on Google Workspace and Microsoft 365."},{"t":"h","x":"Dynamic Groups Support"},{"t":"p","x":"CyberNut now supports Google Workspace Dynamic Groups. It can detect dynamic group membership and keep it synced in real time as users are added or removed based on organizational criteria."},{"t":"note","x":"Google Workspace super admins must update service account permissions to turn this on. See the knowledge base article for configuration details."}],"l":[{"text":"knowledge base for configuration details","to":"dynamic-groups-google"}],"video_only":false},{"id":"release-2026-07-13","g":"u1","t":"July 13, 2026 release","sum":"Review the back to school 2026 release, including Active Threat Manager, compromised accounts, credential harvesting simulations and leaderboard resets.","p":"both","k":"release","a":"everyone","m":12,"u":"2026-07-27","src":["updates-7-13-26"],"orig":["https://knowledgebase.cybernut.com/cybernut-knowledge-base/updates-7-13-26"],"v":[{"url":"https://www.loom.com/share/2030479ce01b451dae133770df35b0ef","host":"Loom"},{"url":"https://www.loom.com/share/f00634ebfb704bafa4458ce3e45230e8","host":"Loom"},{"url":"https://www.loom.com/share/a1740818f96e4ba5b1441e143980b407","host":"Loom"},{"url":"https://www.loom.com/share/9331070ed6df404fad599ded368a18b5","host":"Loom"},{"url":"https://www.loom.com/share/a9fc3d4b78c6408fbe35b52e397fb33b","host":"Loom"},{"url":"https://www.loom.com/share/b36b4e1247e74b1c9254b9a38d738bff","host":"Loom"},{"url":"https://www.loom.com/share/3e000094af274580bbb55c229a4b7073","host":"Loom"},{"url":"https://www.loom.com/share/568d35a53d52439daed41327f204f019","host":"Loom"},{"url":"https://www.loom.com/share/f3172cca1d9142368a4926d30945b8f2","host":"Loom"},{"url":"https://www.loom.com/share/df8d6ce672ca4d398675197a5ab79909","host":"Loom"},{"url":"https://www.loom.com/share/9ccd64f370ff45379187b86f6bbf65dd","host":"Loom"},{"url":"https://www.loom.com/share/9c10a98fb90f4a4a94ae05dfaeca7f48","host":"Loom"},{"url":"https://www.loom.com/share/dceae5043d484fc89e4a377ec3bf5436","host":"Loom"}],"sh":28,"b":[{"t":"p","x":"Updates arriving for the back to school season."},{"t":"h","x":"What's New in This Release"},{"t":"p","x":"The updates are grouped by product area so you can scan them quickly."},{"t":"note","x":"Updates may not appear right away. They are rolling out gradually over the coming weeks."},{"t":"h","x":"Microtraining"},{"t":"list","items":["Redesigned around interactive red flag detection that staff are more likely to finish.","Modernized design that shows the red flags for each simulation email.","New quiz format to verify learning and demonstrate cybersecurity knowledge.","The acorn reward system continues to drive engagement and competition."]},{"t":"h","x":"Active Threat Manager"},{"t":"p","x":"Redesigned investigations let teams judge reported threats as a case grouped by sender and subject cluster, rather than one domain at a time. With the Automated Threat Terminator (ATT), reported emails are sorted into threat, spam, or safe verdicts automatically."},{"t":"list","items":["Unified Case-Based Dashboard. Reported Threats now groups emails by sender and subject so admins can judge look-alike emails together.","Advanced Threat Search. Admins can start a domain wide sweep from any reported threat case, pre-filled with sender and subject data.","Action Audit Log. A chronological, read-only record of every case action, showing whether an admin or CyberNut performed it.","Risk-Based Prioritization (with ATT Add-on). Each case gets a 0 to 100 score and a verdict of Phishing, Spam, or Legitimate. Admins can sort by any column, including date.","Automated Remediation (with ATT Add-on). A policy engine lets admins set auto-quarantine for phishing and automatic spam management.","ATT Recommended Actions (with ATT Add-on). Guidance ranging from immediate steps to awareness measures and policy updates."]},{"t":"h","x":"Compromised Accounts"},{"t":"list","items":["A new feature alerts you to potentially compromised accounts. It flags reported threats that trace back to your domain and are determined to be phishing.","Automatically suspend user accounts once a potentially compromised account is detected, so it cannot send more phishing emails.","Auto-quarantine reported emails when auto-suspend is on, removing the threat from the reporter's inbox.","Included in the standard license plan for partners at no additional cost."]},{"t":"h","x":"Spam Verdict Labeling for Reported Threats"},{"t":"p","x":"For all standard plan partners, reported threats that CyberNut determines to be spam are automatically labeled Spam. This lets IT admins handle spam quickly and focus on other reported threats."},{"t":"h","x":"Department Specific Training Campaigns"},{"t":"p","x":"When you choose which sender types to include or exclude for a team, you can now add phishing templates made for finance, HR, student services, teachers, IT, and administrators."},{"t":"p","x":"How to use this feature: Creating a Phishing Training Campaign."},{"t":"h","x":"Onboarding Campaign Auto-Continuation"},{"t":"p","x":"To make sure all users complete CyberNut onboarding, you can set up an onboarding campaign that continues from the previous school year."},{"t":"list","items":["Skip Ahead for Experienced Staff. Employees who finished onboarding skip the onboarding lessons and go straight to phishing simulation practice. Employees with partial progress resume where they left off.","Full Support for New Hires. New employees, or those who never finished prior onboarding, get the full introductory experience.","Preserved Campaign Data. Campaign data and reporting pick up where they left off, so you can focus on users who still need to finish."]},{"t":"p","x":"How to use this feature: Creating an onboarding campaign."},{"t":"h","x":"Credential Harvesting Simulations"},{"t":"p","x":"The CyberNut Learning Path now includes level 4 training. It goes beyond click tracking to credential harvesting, the final stage of a real phishing attack."},{"t":"list","items":["Email simulations with fake landing pages. Some simulations now include fake landing pages that mimic credential harvesting.","Updated Analytics Reporting. Reports now show which users passed or failed the credential harvesting test.","Safe by design. CyberNut does not capture or store credentials users type. It only logs the page load, the declared field type, and the submission event."]},{"t":"h","x":"Improved Chrome Extension"},{"t":"p","x":"An optional, refreshed Chrome extension adds a floating report widget so staff can report suspicious emails more easily. It is available for Google Workspace customers."},{"t":"p","x":"How to use this feature: Deploying the CyberNut Chrome Extension."},{"t":"h","x":"Student Campaign Analytics Update"},{"t":"list","items":["More detailed reporting. Drill down into student training data to see each student's completion progress and overall campaign performance.","Send reminders. Admins can email students reminders to complete training."]},{"t":"h","x":"Updated Onboarding Experience"},{"t":"p","x":"For back to school, onboarding was refreshed so users understand they must click Chip to report suspicious emails."},{"t":"list","items":["Visual improvements to help users get through onboarding training.","Refreshed onboarding email templates.","The sample click email now finishes onboarding with an introduction to the new Microtraining when users report.","A Microtraining tutorial is sent to users who completed onboarding so everyone learns about the changes. This requires continuing from the previous year's campaign.","New videos showing how to report on mobile."]},{"t":"h","x":"Campaign Creation Flow Updates"},{"t":"p","x":"Setup instructions were refreshed for clarity on each campaign step."},{"t":"h","x":"Leaderboard Ranking Reset"},{"t":"list","items":["Schedule automatic leaderboard reset dates to build engagement programs with staff and students. You can also update reporting periods within any active phishing campaign.","Reset options are Automatic Monthly, Trimester, Quarterly, and one-time custom dates.","Review past leaderboard winners from completed periods."]},{"t":"h","x":"Newly Added Compliance Videos"},{"t":"p","x":"Training videos for COPPA, FERPA, CIPA, PPRA, and HIPAA were added to the compliance video library, alongside the existing cybersecurity and AI awareness videos."},{"t":"h","x":"Delete Simulation Email after Reporting"},{"t":"p","x":"CyberNut simulation emails are automatically deleted from a user's inbox after they finish reporting through Chip, the blue squirrel."}],"l":[{"text":"Creating a Phishing Training Campaign","url":"https://knowledgebase.cybernut.com/cybernut-knowledge-base/creating-a-baseline-campaign-2026"},{"text":"Creating an onboarding campaign","to":"onboarding-campaign"},{"text":"Deploying the CyberNut Chrome Extension","to":"deploy-chrome-extension"}],"video_only":false},{"id":"release-2026-02-21","g":"u1","t":"February 21, 2026 release","sum":"See the February 2026 usability changes to campaign creation, user and team selection, and auto saving settings tabs.","p":"both","k":"release","a":"everyone","m":6,"u":"2026-02-23","src":["updates-2-23-26"],"orig":["https://knowledgebase.cybernut.com/cybernut-knowledge-base/updates-2-23-26"],"v":[{"url":"https://cybernut.storylane.io/share/jigayvpqffcm","host":"Storylane"}],"sh":24,"b":[{"t":"p","x":"This release contains small usability fixes based on user feedback. The goals are simpler workflows, clearer wording, and a more intuitive platform."},{"t":"h","x":"Enhanced Campaign Creation and Management"},{"t":"p","x":"Campaign management is clearer and faster through changes to input fields, previews, and flow."},{"t":"list","items":["Campaign Scheduling. Start Date and End Date now have separate input fields. Campaigns of any type cannot start on their creation date.","Onboarding Campaign Flow. Streamlined to keep only the required fields for training frequency and email sending.","Onboarding Card Placement. The onboarding campaign card sits under a dropdown or hidden section in the training campaign creation flow, so admins create both together.","Selected Campaign Removal. A Clear button removes a previously selected campaign.","Campaign Description Clarity. Descriptions were reworded for clarity, with the note: Phishing Training Campaign includes Setup & Onboarding.","Review Campaign. The Create Campaign button on the review screen is now Schedule Campaign.","Email Preview. Hovering over an email's time slot in Reported Threats opens a template thumbnail automatically, without a click. The editor for compliance and onboarding email templates was also updated so admins can see how emails will look before sending.","Time to Complete Display. Shows the length of the onboarding or compliance training instead of the full campaign, matching the compliance due date.","Campaign Action Grouping. The Edit Campaign button moved next to End Campaign.","Compliance Module Preview. For compliance campaigns, a Preview list replaces View all module videos and matches other campaign types. Clicking a thumbnail opens the video in a modal instead of a new tab.","Download Clarity. The word Download appears beside the download icon, with a tooltip saying the file is a SCORM file."]},{"t":"h","x":"Improved User/Team Management"},{"t":"p","x":"Changes focus on selection clarity and navigation."},{"t":"list","items":["User Selection. Added a Deselect All checkbox and increased the font size of user selection elements.","Group Selection Logic. Selecting a group automatically selects its users. The added user count stays hidden at zero and appears once users are selected.","Admin Portal Leaderboard. An opt-in button on the Users tab of the admin portal lets an admin find a user and opt them into the leaderboard.","Team Captain Note. A note in the team captain modal reads: Note: Please enable SSO for the team captain.","Campaign Review User Screen. Clicking the Total users card on the final campaign review page opens a screen where users can be reviewed and searched.","User CSV Samples. A sample CSV and card explanations clarify each file's purpose for user uploads."]},{"t":"h","x":"Settings and User Portal Updates"},{"t":"p","x":"Changes cover how settings are saved and how video plays in the portal."},{"t":"list","items":["Settings Management. The General, Add-on, and Threats Manager tabs in Settings now save automatically. The Save button was removed to avoid confusion about unsaved changes.","Team Settings. All additional settings display by default, with no dropdown to open.","Texas State Compliance. For users whose state is Texas, Core is now DIR Approved where it applies.","User Portal Video Playback. Auto-play was removed from the user portal, and YouTube links in compliance campaigns are disabled, so users stay in the media player."]}],"l":[],"video_only":false},{"id":"submit-a-ticket","g":"p1","t":"Submit a ticket","sum":"Contact CyberNut support by online form, email to support@cybernut.com, or the Help link in the Admin Portal.","p":"both","k":"support","a":"everyone","m":1,"u":"2026-02-26","src":["submit-a-ticket"],"orig":["https://knowledgebase.cybernut.com/cybernut-knowledge-base/submit-a-ticket"],"v":[],"sh":0,"b":[{"t":"p","x":"Our team is happy to help. You can open a support ticket in any of three ways."},{"t":"list","items":["Web form (recommended): use the support ticket form at https://www.cybernut.com/support-ticket.","Email: send your request to support@cybernut.com.","Admin Portal: use the Help link in your CyberNut Admin Portal at https://admin.cybernut.com."]}],"l":[{"text":"here (recommended)","url":"https://www.cybernut.com/support-ticket?hsLang=en"},{"text":"support@cybernut.com","url":"mailto:support@cybernut.com"},{"text":"Help link in your CyberNut Admin Portal","url":"https://admin.cybernut.com"}],"video_only":false},{"id":"system-status","g":"p1","t":"Live system status","sum":"Check the current operational status of CyberNut on the external live status page.","p":"both","k":"support","a":"everyone","m":1,"u":"2025-10-30","src":["system-status"],"orig":["https://knowledgebase.cybernut.com/cybernut-knowledge-base/system-status"],"v":[],"sh":0,"b":[{"t":"p","x":"CyberNut works to keep its     return {a:a,s:score}}).filter(Boolean).sort(function(x,y){return y.s-x.s});
  var rx=new RegExp("("+terms.map(function(t){return t.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")}).join("|")+")","gi");
  function hl(s){return s.replace(rx,"<mark>$1</mark>")}
  view.innerHTML='<div class="wrap"><div id="results"><h2>'+hits.length+' result'+(hits.length===1?'':'s')+' for “'+esc(q)+'”</h2>'+
   (hits.length?'<ul class="list">'+hits.map(function(h){var g=G[h.a.g];return row(h.a,esc(SEC[g.s].t)+' · '+esc(g.t),hl)}).join("")+'</ul>'
   :'<div class="empty">No articles match. Try a shorter word, set the platform filter to All, or <a href="#support">contact support</a>.</div>')+'</div></div>';
}

/* ---------- routing ---------- */
var view=document.getElementById("view"), io;
function observe(){
  if(!("IntersectionObserver" in window))return; if(io)io.disconnect();
  io=new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting)document.querySelectorAll("nav.side a").forEach(function(a){a.classList.toggle("on",a.dataset.s===e.target.id)})})},{rootMargin:"-30% 0px -60% 0px"});
  document.querySelectorAll("section.sec").forEach(function(s){io.observe(s)})}
function route(){
  var q=document.getElementById("q").value.trim();
  var h=location.hash.replace(/^#/,"");
  if(q&&!A[h]){search(q);return}
  if(A[h]){article(A[h]);return}
  
  home();
  if(SEC[h]){var el=document.getElementById(h);if(el)el.scrollIntoView()} else window.scrollTo(0,0);
}
window.addEventListener("hashchange",function(){document.getElementById("q").value="";route()});
document.getElementById("q").addEventListener("input",function(e){var q=e.target.value.trim();if(q){search(q)}else route()});
document.querySelectorAll(".plat button").forEach(function(b){b.addEventListener("click",function(){plat=b.dataset.p;save("cn-plat",plat);setPlatUI();route()})});
function setPlatUI(){document.querySelectorAll(".plat button").forEach(function(b){b.setAttribute("aria-pressed",String(b.dataset.p===plat))})}
document.addEventListener("keydown",function(e){if(e.key==="/"&&document.activeElement.tagName!=="INPUT"){e.preventDefault();document.getElementById("q").focus()}});
setPlatUI(); route();
</script>
